<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>WORKOUT LOG</title>

<style>
*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:#090909;
 color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif;
}

button,
input,
select,
textarea{
 font:inherit;
}

button{
 cursor:pointer;
 border:0;
}

.app{
 max-width:680px;
 margin:auto;
 padding-bottom:90px;
}

header{
 position:sticky;
 top:0;
 z-index:20;
 background:#090909ee;
 backdrop-filter:blur(12px);
 border-bottom:1px solid #252525;
 padding:16px;
}

.logo{
 font-size:20px;
 font-weight:900;
 letter-spacing:1.5px;
}

.date{
 color:#888;
 font-size:12px;
 margin-top:3px;
}

main{
 padding:14px;
}

.card{
 background:#151515;
 border:1px solid #252525;
 border-radius:18px;
 padding:15px;
 margin-bottom:12px;
}

.row{
 display:flex;
 gap:8px;
 align-items:center;
}

.between{
 justify-content:space-between;
}

.title{
 font-weight:900;
 font-size:17px;
}

.sub{
 color:#888;
 font-size:12px;
 margin-top:3px;
}

.btn{
 background:#fff;
 color:#000;
 padding:11px 14px;
 border-radius:12px;
 font-weight:800;
}

.btn.dark{
 background:#242424;
 color:#fff;
}

.btn.red{
 background:#321616;
 color:#ff7777;
}

.btn.green{
 background:#18351f;
 color:#7cff98;
}

.btn.full{
 width:100%;
}

input,
select,
textarea{
 width:100%;
 border:1px solid #303030;
 background:#0e0e0e;
 color:#fff;
 border-radius:11px;
 padding:11px;
 outline:none;
}

input:focus,
select:focus,
textarea:focus{
 border-color:#777;
}

label{
 display:block;
 font-size:11px;
 color:#888;
 margin:10px 0 5px;
}

.badge{
 display:inline-block;
 padding:4px 8px;
 border-radius:99px;
 background:#292929;
 color:#aaa;
 font-size:10px;
 margin-left:4px;
}

.set{
 background:#101010;
 border:1px solid #242424;
 border-radius:13px;
 padding:9px;
 margin-top:7px;
}

.setgrid{
 display:grid;
 grid-template-columns:34px 1fr 1fr 38px;
 gap:6px;
 align-items:center;
}

.setnum{
 color:#777;
 text-align:center;
 font-size:12px;
}

.options{
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 margin-top:8px;
}

.toggle{
 background:#222;
 color:#aaa;
 padding:7px 9px;
 border-radius:9px;
 font-size:11px;
}

.toggle.active{
 background:#fff;
 color:#000;
}

.prev{
 background:#191919;
 border-radius:10px;
 padding:8px;
 margin-top:8px;
 font-size:11px;
 color:#aaa;
}

.exercise-actions{
 display:flex;
 gap:6px;
 margin-top:9px;
}

.exercise-actions button{
 flex:1;
}

.empty{
 text-align:center;
 color:#666;
 padding:35px 10px;
}

.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 z-index:30;
 background:#111e;
 backdrop-filter:blur(15px);
 border-top:1px solid #292929;
}

.bottom-inner{
 max-width:680px;
 margin:auto;
 display:flex;
}

.bottom button{
 flex:1;
 padding:14px 4px;
 background:transparent;
 color:#777;
 font-size:11px;
}

.bottom button.active{
 color:#fff;
}

.hidden{
 display:none!important;
}

.history-item{
 padding:13px 0;
 border-bottom:1px solid #292929;
}

.history-item:last-child{
 border:0;
}

.pr{
 display:flex;
 justify-content:space-between;
 padding:10px 0;
 border-bottom:1px solid #292929;
}

.timer{
 position:fixed;
 right:14px;
 bottom:72px;
 z-index:40;
 background:#fff;
 color:#000;
 border-radius:15px;
 padding:12px 15px;
 font-weight:900;
 box-shadow:0 5px 30px #000;
}

.timer button{
 background:#000;
 color:#fff;
 border-radius:8px;
 padding:6px 9px;
 margin-left:6px;
}

h2{
 font-size:14px;
 margin:0 0 10px;
}


/* スーパー・ジャイアント */

.group{
 margin-top:10px;
 border:1px solid #292929;
 border-radius:14px;
 padding:10px;
 background:#0d0d0d;
}

.group-title{
 font-size:12px;
 font-weight:900;
 color:#aaa;
 margin-bottom:8px;
}

.group-exercise{
 background:#151515;
 border:1px solid #292929;
 border-radius:12px;
 padding:10px;
 margin-top:8px;
}

.group-exercise-title{
 font-size:11px;
 color:#888;
 font-weight:800;
 margin-bottom:6px;
}

.group-set{
 background:#101010;
 border:1px solid #242424;
 border-radius:10px;
 padding:8px;
 margin-top:7px;
}

.group-set-grid{
 display:grid;
 grid-template-columns:34px 1fr 1fr 38px;
 gap:6px;
 align-items:center;
}

.group-set-num{
 color:#777;
 font-size:11px;
 text-align:center;
}

.group-actions{
 display:flex;
 gap:6px;
 margin-top:8px;
}

.group-actions button{
 flex:1;
}

.drop-stage{
 background:#151515;
 border:1px solid #292929;
 border-radius:11px;
 padding:8px;
 margin-top:7px;
}

.drop-stage-grid{
 display:grid;
 grid-template-columns:34px 1fr 1fr 38px;
 gap:6px;
 align-items:center;
}

.drop-stage-num{
 color:#777;
 text-align:center;
 font-size:11px;
}

.drop-set{
 background:#101010;
 border:1px solid #242424;
 border-radius:13px;
 padding:9px;
 margin-top:7px;
}

.drop-set-title{
 color:#888;
 font-size:11px;
 font-weight:800;
 margin-bottom:5px;
}

.drop-actions{
 display:flex;
 gap:6px;
 margin-top:8px;
}

.drop-actions button{
 flex:1;
}

@media(max-width:420px){

 .setgrid,
 .group-set-grid,
 .drop-stage-grid{
  grid-template-columns:30px 1fr 1fr 34px;
 }

 .btn{
  padding:10px 10px;
 }

}
</style>
</head>

<body>

<div class="app">

<header>

 <div class="logo">
  WORKOUT LOG
 </div>

 <div
  class="date"
  id="date">
 </div>

</header>


<main>


<!-- WORKOUT -->

<section id="workoutPage">

<div class="card">

 <div class="row between">

  <div>

   <div class="title">
    TODAY'S WORKOUT
   </div>

   <div class="sub">
    前回の記録を確認しながら入力
   </div>

  </div>

  <button
   class="btn green"
   onclick="finishWorkout()">
   保存
  </button>

 </div>

</div>


<div id="exerciseList"></div>


<!-- 種目追加 -->

<div class="card">

 <h2>
  種目を追加
 </h2>

 <button
  class="btn full"
  onclick="addExercise('normal')">
  ＋ 通常セット
 </button>


 <div
  class="row"
  style="margin-top:8px">

  <button
   class="btn dark"
   style="flex:1"
   onclick="addExercise('drop')">
   ドロップセット
  </button>

  <button
   class="btn dark"
   style="flex:1"
   onclick="addExercise('superset')">
   スーパーセット
  </button>

 </div>


 <button
  class="btn dark full"
  style="margin-top:8px"
  onclick="addExercise('giant')">
  ジャイアントセット
 </button>

</div>


<div class="card">

 <button
  class="btn dark full"
  onclick="copyLastWorkout()">
  前回メニューをコピー
 </button>

</div>

</section>


<!-- HISTORY -->

<section
 id="historyPage"
 class="hidden">

<div class="card">

 <h2>
  トレーニング履歴
 </h2>

 <div id="historyList"></div>

</div>


<div class="card">

 <h2>
  種目別PR
 </h2>

 <div id="prList"></div>

</div>

</section>


<!-- SETTINGS -->

<section
 id="settingsPage"
 class="hidden">

<div class="card">

 <h2>
  データ管理
 </h2>


 <button
  class="btn full"
  onclick="backup()">
  バックアップ
 </button>


 <label>
  バックアップを復元
 </label>


 <input
  type="file"
  accept=".json"
  onchange="restore(event)"
 >


 <button
  class="btn red full"
  style="margin-top:12px"
  onclick="clearAll()">
  全データ削除
 </button>

</div>

</section>

</main>


<!-- TIMER -->

<div
 id="timer"
 class="timer hidden">

 <span id="timerText">
  00:00
 </span>

 <button
  onclick="stopTimer()">
  停止
 </button>

</div>


<!-- BOTTOM -->

<nav class="bottom">

 <div class="bottom-inner">

  <button
   class="active"
   onclick="showPage('workout',this)">
   記録
  </button>

  <button
   onclick="showPage('history',this)">
   履歴
  </button>

  <button
   onclick="showPage('settings',this)">
   設定
  </button>

 </div>

</nav>

</div>


<script>


const KEY="WORKOUT_LOG_V2";


let db=JSON.parse(
 localStorage.getItem(KEY) ||
 '{"history":[],"draft":[]}'
);


let draft=db.draft || [];


const uid=()=>Date.now().toString(36)+
 Math.random().toString(36).substring(2);


const esc=s=>String(s??"").replace(
 /[&<>"']/g,
 m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[m])
);


document.getElementById("date").textContent=
 new Date().toLocaleDateString(
  "ja-JP",
  {
   year:"numeric",
   month:"long",
   day:"numeric",
   weekday:"short"
  }
);


/* 保存 */

function save(){

 db.draft=draft;

 localStorage.setItem(
  KEY,
  JSON.stringify(db)
 );

}


/* 新しいセット */

function createSet(){

 return{

  id:uid(),

  weight:"",

  reps:"",

  assist:false,

  restPause:false,

  restSeconds:"",

  cheating:false,

  note:""

 };

}


/* スーパー・ジャイアントの種目 */

function createGroupExercise(){

 return{

  id:uid(),

  name:"",

  sets:[
   createSet(),
   createSet(),
   createSet()
  ]

 };

}


/* ドロップ段階 */

function createDropStage(){

 return{

  id:uid(),

  weight:"",

  reps:"",

  note:""

 };

}


/* ドロップセット */

function createDropSet(){

 return{

  id:uid(),

  stages:[
   createDropStage(),
   createDropStage(),
   createDropStage()
  ]

 };

}


/* 種目追加 */

function addExercise(type){

 let ex={

  id:uid(),

  type:type,

  name:"",

  sets:[]

 };


 /* 通常 */

 if(type==="normal"){

  ex.sets=[
   createSet(),
   createSet(),
   createSet()
  ];

 }


 /* ドロップ */

 if(type==="drop"){

  ex.sets=[
   createDropSet(),
   createDropSet(),
   createDropSet()
  ];

 }


 /* スーパー */

 if(type==="superset"){

  ex.items=[
   createGroupExercise(),
   createGroupExercise()
  ];

 }


 /* ジャイアント */

 if(type==="giant"){

  ex.items=[
   createGroupExercise(),
   createGroupExercise(),
   createGroupExercise(),
   createGroupExercise()
  ];

 }


 draft.push(ex);

 save();

 render();

}


/* 前回記録 */

function previous(name){

 if(!name)return null;


 for(const workout of db.history){

  for(const ex of workout.exercises || []){


   if(
    (ex.type==="normal" ||
     ex.type==="drop") &&
    ex.name===name
   ){

    return ex;

   }


   if(
    ex.type==="superset" ||
    ex.type==="giant"
   ){

    for(const item of ex.items || []){

     if(item.name===name){

      return item;

     }

    }

   }

  }

 }


 return null;

}


/* 種目削除 */

function deleteExercise(id){

 draft=draft.filter(
  e=>e.id!==id
 );

 save();

 render();

}


/* 通常セット追加 */

function addSet(eid){

 const e=draft.find(
  x=>x.id===eid
 );

 if(!e)return;


 e.sets.push(
  createSet()
 );


 save();

 render();

}


/* 通常セット削除 */

function deleteSet(eid,sid){

 const e=draft.find(
  x=>x.id===eid
 );

 if(!e)return;


 e.sets=e.sets.filter(
  s=>s.id!==sid
 );


 save();

 render();

}


/* ドロップセット追加 */

function addDropSet(eid){

 const e=draft.find(
  x=>x.id===eid
 );

 if(!e)return;


 e.sets.push(
  createDropSet()
 );


 save();

 render();

}


/* ドロップ段階追加 */

function addDropStage(
 eid,
 sid
){

 const e=draft.find(
  x=>x.id===eid
 );

 if(!e)return;


 const set=e.sets.find(
  x=>x.id===sid
 );

 if(!set)return;


 set.stages.push(
  createDropStage()
 );


 save();

 render();

}


/* ドロップ段階削除 */

function deleteDropStage(
 eid,
 sid,
 stageId
){

 const e=draft.find(
  x=>x.id===eid
 );

 if(!e)return;


 const set=e.sets.find(
  x=>x.id===sid
 );

 if(!set)return;


 if(set.stages.length<=1){

  alert(
   "最低1段階は必要です"
  );

  return;

 }


 set.stages=set.stages.filter(
  x=>x.id!==stageId
 );


 save();

 render();

}


/* ドロップセット削除 */

function deleteDropSet(
 eid,
 sid
){

 const e=draft.find(
  x=>x.id===eid
 );

 if(!e)return;


 e.sets=e.sets.filter(
  x=>x.id!==sid
 );


 save();

 render();

}


/* グループ種目追加 */

function addGroupExercise(eid){

 const e=draft.find(
  x=>x.id===eid
 );

 if(!e)return;


 e.items.push(
  createGroupExercise()
 );


 save();

 render();

}


/* グループ種目削除 */

function deleteGroupExercise(
 eid,
 itemId
){

 const e=draft.find(
  x=>x.id===eid
 );

 if(!e)return;


 if(e.items.length<=2){

  alert(
   "最低2種目は必要です"
  );

  return;

 }


 e.items=e.items.filter(
  x=>x.id!==itemId
 );


 save();

 render();

}


/* グループセット追加 */

function addGroupSet(
 eid,
 itemId
){

 const e=draft.find(
  x=>x.id===eid
 );

 if(!e)return;


 const item=e.items.find(
  x=>x.id===itemId
 );

 if(!item)return;


 item.sets.push(
  createSet()
 );


 save();

 render();

}


/* グループセット削除 */

function deleteGroupSet(
 eid,
 itemId,
 sid
){

 const e=draft.find(
  x=>x.id===eid
 );

 if(!e)return;


 const item=e.items.find(
  x=>x.id===itemId
 );

 if(!item)return;


 if(item.sets.length<=1){

  alert(
   "最低1セットは必要です"
  );

  return;

 }


 item.sets=item.sets.filter(
  x=>x.id!==sid
 );


 save();

 render();

}


/* 種目更新 */

function updateExercise(
 id,
 key,
 value
){

 const e=draft.find(
  x=>x.id===id
 );

 if(!e)return;


 e[key]=value;

 save();

}


/* セット更新 */

function updateSet(
 eid,
 sid,
 key,
 value
){

 const e=draft.find(
  x=>x.id===eid
 );

 if(!e)return;


 const s=e.sets.find(
  x=>x.id===sid
 );

 if(!s)return;


 s[key]=value;

 save();

}


/* ドロップ段階更新 */

function updateDropStage(
 eid,
 sid,
 stageId,
 key,
 value
){

 const e=draft.find(
  x=>x.id===eid
 );

 if(!e)return;


 const set=e.sets.find(
  x=>x.id===sid
 );

 if(!set)return;


 const stage=set.stages.find(
  x=>x.id===stageId
 );

 if(!stage)return;


 stage[key]=value;

 save();

}


/* グループ種目更新 */

function updateGroupExercise(
 eid,
 itemId,
 value
){

 const e=draft.find(
  x=>x.id===eid
 );

 if(!e)return;


 const item=e.items.find(
  x=>x.id===itemId
 );

 if(!item)return;


 item.name=value;

 save();

}


/* グループセット更新 */

function updateGroupSet(
 eid,
 itemId,
 sid,
 key,
 value
){

 const e=draft.find(
  x=>x.id===eid
 );

 if(!e)return;


 const item=e.items.find(
  x=>x.id===itemId
 );

 if(!item)return;


 const s=item.sets.find(
  x=>x.id===sid
 );

 if(!s)return;


 s[key]=value;

 save();

}


/* 通常セットトグル */

function toggleSet(
 eid,
 sid,
 key
){

 const e=draft.find(
  x=>x.id===eid
 );

 if(!e)return;


 const s=e.sets.find(
  x=>x.id===sid
 );

 if(!s)return;


 s[key]=!s[key];

 save();

 render();

}


/* 通常セットHTML */

function setHTML(
 e,
 s,
 i
){

 return`

 <div class="set">

  <div class="setgrid">

   <div class="setnum">
    SET<br>${i+1}
   </div>


   <input
    type="number"
    step="0.5"
    placeholder="重量 kg"
    value="${esc(s.weight)}"
    oninput="
    updateSet(
     '${e.id}',
     '${s.id}',
     'weight',
     this.value
    )"
   >


   <input
    type="number"
    placeholder="回数"
    value="${esc(s.reps)}"
    oninput="
    updateSet(
     '${e.id}',
     '${s.id}',
     'reps',
     this.value
    )"
   >


   <button
    class="btn red"
    onclick="
    deleteSet(
     '${e.id}',
     '${s.id}'
    )">
    ×
   </button>

  </div>


  <div class="options">

   <button
    class="toggle ${s.assist?'active':''}"
    onclick="
    toggleSet(
     '${e.id}',
     '${s.id}',
     'assist'
    )">
    補助
   </button>


   <button
    class="toggle ${s.restPause?'active':''}"
    onclick="
    toggleSet(
     '${e.id}',
     '${s.id}',
     'restPause'
    )">
    レストポーズ
   </button>


   <button
    class="toggle ${s.cheating?'active':''}"
    onclick="
    toggleSet(
     '${e.id}',
     '${s.id}',
     'cheating'
    )">
    チーティング
   </button>

  </div>


  ${
   s.restPause
   ?
   `

   <div
    class="row"
    style="margin-top:7px">

    <input
     type="number"
     placeholder="休憩秒数"
     value="${esc(s.restSeconds)}"
     oninput="
     updateSet(
      '${e.id}',
      '${s.id}',
      'restSeconds',
      this.value
     )"
    >


    <button
     class="btn"
     onclick="
     startTimer(
      ${Number(s.restSeconds)||15}
     )">
     タイマー
    </button>

   </div>

   `
   :
   ""
  }


  <input
   style="margin-top:7px"
   placeholder="メモ"
   value="${esc(s.note)}"
   oninput="
   updateSet(
    '${e.id}',
    '${s.id}',
    'note',
    this.value
   )"
  >

 </div>

 `;

}


/* ドロップ段階HTML */

function dropStageHTML(
 e,
 set,
 stage,
 i
){

 return`

 <div class="drop-stage">

  <div class="drop-stage-grid">

   <div class="drop-stage-num">
    ${i===0 ? "開始" : "DROP"}
   </div>


   <input
    type="number"
    step="0.5"
    placeholder="重量 kg"
    value="${esc(stage.weight)}"
    oninput="
    updateDropStage(
     '${e.id}',
     '${set.id}',
     '${stage.id}',
     'weight',
     this.value
    )"
   >


   <input
    type="number"
    placeholder="回数"
    value="${esc(stage.reps)}"
    oninput="
    updateDropStage(
     '${e.id}',
     '${set.id}',
     '${stage.id}',
     'reps',
     this.value
    )"
   >


   <button
    class="btn red"
    onclick="
    deleteDropStage(
     '${e.id}',
     '${set.id}',
     '${stage.id}'
    )">
    ×
   </button>

  </div>


  <input
   style="margin-top:7px"
   placeholder="メモ"
   value="${esc(stage.note)}"
   oninput="
   updateDropStage(
    '${e.id}',
    '${set.id}',
    '${stage.id}',
    'note',
    this.value
   )"
  >

 </div>

 `;

}


/* ドロップセットHTML */

function dropSetHTML(
 e,
 set,
 i
){

 return`

 <div class="drop-set">

  <div class="row between">

   <div class="drop-set-title">
    SET ${i+1}
   </div>


   <button
    class="btn red"
    onclick="
    deleteDropSet(
     '${e.id}',
     '${set.id}'
    )">
    削除
   </button>

  </div>


  ${
   set.stages.map(
    (stage,index)=>
    dropStageHTML(
     e,
     set,
     stage,
     index
    )
   ).join("")
  }


  <div class="drop-actions">

   <button
    class="btn dark"
    onclick="
    addDropStage(
     '${e.id}',
     '${set.id}'
    )">
    ＋ ドロップ
   </button>

  </div>

 </div>

 `;

}


/* グループセットHTML */

function groupSetHTML(
 e,
 item,
 s,
 i
){

 return`

 <div class="group-set">

  <div class="group-set-grid">

/* スーパー・ジャイアント種目HTML */

function groupHTML(
 e,
 item,
 index
){

 return`

 <div class="group-exercise">

  <div class="row between">

   <div class="group-exercise-title">
    種目 ${index+1}
   </div>


   ${
    e.items.length>2
    ?
    `
    <button
     class="btn red"
     onclick="
     deleteGroupExercise(
      '${e.id}',
      '${item.id}'
     )">
     削除
    </button>
    `
    :
    ""
   }

  </div>


  <input
   placeholder="種目名"
   value="${esc(item.name)}"
   oninput="
   updateGroupExercise(
    '${e.id}',
    '${item.id}',
    this.value
   )"
  >


  ${
   item.name
   ?
   `
   <div class="prev">

    前回：
    ${
     (previous(item.name)?.sets || [])
     .map(
      s=>
      `${s.weight||"-"}kg × ${s.reps||"-"}`
     )
     .join(" / ")
     || "記録なし"
    }

   </div>
   `
   :
   ""
  }


  ${
   item.sets.map(
    (s,i)=>
    groupSetHTML(
     e,
     item,
     s,
     i
    )
   ).join("")
  }


  <div class="group-actions">

   <button
    class="btn dark"
    onclick="
    addGroupSet(
     '${e.id}',
     '${item.id}'
    )">
    ＋ セット
   </button>

  </div>

 </div>

 `;

}


/* メイン描画 */

function render(){

 const root=
 document.getElementById(
  "exerciseList"
 );


 root.innerHTML="";


 if(!draft.length){

  root.innerHTML=
  '<div class="card empty">種目を追加してトレーニング開始</div>';

  return;

 }


 draft.forEach(
 (e,index)=>{


  /* スーパー・ジャイアント */

  if(
   e.type==="superset" ||
   e.type==="giant"
  ){

   const typeName=
   e.type==="superset"
   ?
   "スーパーセット"
   :
   "ジャイアントセット";


   let html=`

   <div class="card">

    <div class="row between">

     <div class="title">

      ${index+1}.
      ${typeName}

      <span class="badge">
       ${e.items.length}種目
      </span>

     </div>


     <button
      class="btn red"
      onclick="
      deleteExercise(
       '${e.id}'
      )">
      削除
     </button>

    </div>


    <div class="group">

     ${
      e.items.map(
       (item,i)=>
       groupHTML(
        e,
        item,
        i
       )
      ).join("")
     }


     ${
      e.type==="giant"
      ?
      `
      <button
       class="btn dark full"
       style="margin-top:8px"
       onclick="
       addGroupExercise(
        '${e.id}'
       )">
       ＋ 種目
      </button>
      `
      :
      ""
     }

    </div>

   </div>

   `;


   root.insertAdjacentHTML(
    "beforeend",
    html
   );


   return;

  }


  /* 通常・ドロップ */

  const typeName=
  e.type==="normal"
  ?
  "通常セット"
  :
  "ドロップセット";


  const prev=
  previous(e.name);


  let html=`

  <div class="card">

   <div class="row between">

    <div class="title">

     ${index+1}.
     ${esc(e.name || "種目名")}

     <span class="badge">
      ${typeName}
     </span>

    </div>


    <button
     class="btn red"
     onclick="
     deleteExercise(
      '${e.id}'
     )">
     削除
    </button>

   </div>


   <label>
    種目名
   </label>


   <input
    value="${esc(e.name)}"
    placeholder="例：ベンチプレス"
    oninput="
    updateExercise(
     '${e.id}',
     'name',
     this.value
    )"
   >


   ${
    prev
    ?
    `
    <div class="prev">

     前回：
     ${
      prev.sets
      ?
      prev.sets.map(
       s=>
       `${s.weight||"-"}kg × ${s.reps||"-"}`
      ).join(" / ")
      :
      "記録あり"
     }

    </div>
    `
    :
    ""
   }


   ${
    e.type==="normal"
    ?
    e.sets.map(
     (s,i)=>
     setHTML(
      e,
      s,
      i
     )
    ).join("")
    :
    e.sets.map(
     (set,i)=>
     dropSetHTML(
      e,
      set,
      i
     )
    ).join("")
   }


   <div class="exercise-actions">

    ${
     e.type==="normal"
     ?
     `
     <button
      class="btn dark"
      onclick="
      addSet(
       '${e.id}'
      )">
      ＋ セット
     </button>
     `
     :
     `
     <button
      class="btn dark"
      onclick="
      addDropSet(
       '${e.id}'
      )">
      ＋ セット
     </button>
     `
    }

   </div>

  </div>

  `;


  root.insertAdjacentHTML(
   "beforeend",
   html
  );

 });

}


/* トレーニング保存 */

function finishWorkout(){

 if(!draft.length){

  alert(
   "種目を追加してください"
  );

  return;

 }


 const workout={

  id:uid(),

  date:
  new Date().toISOString(),

  exercises:
  JSON.parse(
   JSON.stringify(draft)
  )

 };


 db.history.unshift(
  workout
 );


 draft=[];


 save();

 render();

 renderHistory();


 alert(
  "トレーニングを保存しました！"
 );

}


/* 前回メニューコピー */

function copyLastWorkout(){

 if(!db.history.length){

  alert(
   "まだ前回の記録がありません"
  );

  return;

 }


 const last=
 db.history[0];


 draft=
 JSON.parse(
  JSON.stringify(
   last.exercises
  )
 );


 draft.forEach(
 e=>{

  e.id=uid();


  /* 通常 */

  if(
   e.type==="normal"
  ){

   e.sets.forEach(
    s=>{

     s.id=uid();

     s.weight="";
     s.reps="";
     s.note="";
     s.restSeconds="";

    }
   );

  }


  /* ドロップ */

  if(
   e.type==="drop"
  ){

   e.sets.forEach(
    set=>{

     set.id=uid();


     set.stages.forEach(
      stage=>{

       stage.id=uid();

       stage.weight="";
       stage.reps="";
       stage.note="";

      }
     );

    }
   );

  }


  /* スーパー・ジャイアント */

  if(
   e.type==="superset" ||
   e.type==="giant"
  ){

   e.items.forEach(
    item=>{

     item.id=uid();


     item.sets.forEach(
      s=>{

       s.id=uid();

       s.weight="";
       s.reps="";
       s.note="";
       s.restSeconds="";

      }
     );

    }
   );

  }

 });


 save();

 render();


 alert(
  "前回メニューをコピーしました！"
 );

}


/* 履歴 */

function renderHistory(){

 const root=
 document.getElementById(
  "historyList"
 );


 if(!db.history.length){

  root.innerHTML=
  '<div class="empty">まだ記録がありません</div>';

  return;

 }


 root.innerHTML=
 db.history.map(
  w=>{

   const date=
   new Date(
    w.date
   ).toLocaleDateString(
    "ja-JP",
    {
     year:"numeric",
     month:"short",
     day:"numeric"
    }
   );


   return`

   <div class="history-item">

    <b>
     ${date}
    </b>


    <div class="sub">

     ${
      w.exercises.map(
       e=>{

        if(
         e.type==="superset" ||
         e.type==="giant"
        ){

         return`
         ${
          e.type==="superset"
          ?
          "スーパーセット"
          :
          "ジャイアントセット"
         }
         （
         ${
          e.items.map(
           x=>
           esc(
            x.name ||
            "名称未設定"
           )
          ).join(" → ")
         }
         ）
         `;

        }


        return`
        ${esc(
         e.name ||
         "名称未設定"
        )}
        （${e.sets.length}セット）
        `;

       }
      ).join(" / ")
     }

    </div>

   </div>

   `;

  }
 ).join("");


 renderPR();

}


/* PR */

function renderPR(){

 const root=
 document.getElementById(
  "prList"
 );


 const prs={};


 db.history.forEach(
  w=>{

   w.exercises.forEach(
    e=>{


     /* 通常 */

     if(
      e.type==="normal"
     ){

      if(!e.name)return;


      e.sets.forEach(
       s=>{

        const weight=
        Number(s.weight)||0;


        if(
         !prs[e.name] ||
         weight>prs[e.name]
        ){

         prs[e.name]=weight;

        }

       }
      );

     }


     /* ドロップ */

     if(
      e.type==="drop"
     ){

      if(!e.name)return;


      e.sets.forEach(
       set=>{

        set.stages.forEach(
         stage=>{

          const weight=
          Number(stage.weight)||0;


          if(
           !prs[e.name] ||
           weight>prs[e.name]
          ){

           prs[e.name]=weight;

          }

         }
        );

       }
      );

     }


     /* スーパー・ジャイアント */

     if(
      e.type==="superset" ||
      e.type==="giant"
     ){

      e.items.forEach(
       item=>{

        if(!item.name)return;


        item.sets.forEach(
         s=>{

          const weight=
          Number(s.weight)||0;


          if(
           !prs[item.name] ||
           weight>prs[item.name]
          ){

           prs[item.name]=weight;

          }

         }
        );

       }
      );

     }

    }
   );

  }
 );


 const names=
 Object.keys(prs);


 if(!names.length){

  root.innerHTML=
  '<div class="empty">まだPRがありません</div>';

  return;

 }


 root.innerHTML=
 names.map(
  name=>`

  <div class="pr">

   <span>
    ${esc(name)}
   </span>

   <b>
    ${prs[name]} kg
   </b>

  </div>

  `
 ).join("");

}


/* ページ切り替え */

function showPage(
 name,
 button
){

 [
  "workout",
  "history",
  "settings"
 ].forEach(
  x=>{

   document
    .getElementById(
     x+"Page"
    )
    .classList.toggle(
     "hidden",
     x!==name
    );

  }
 );


 document
  .querySelectorAll(
   ".bottom button"
  )
  .forEach(
   b=>
   b.classList.remove(
    "active"
   )
  );


 button.classList.add(
  "active"
 );


 if(
  name==="history"
 ){

  renderHistory();

 }

}


/* タイマー */

let timerInterval=null;
let timerEnd=0;


function startTimer(
 seconds
){

 stopTimer();


 timerEnd=
 Date.now()+
 seconds*1000;


 document
  .getElementById(
   "timer"
  )
  .classList.remove(
   "hidden"
  );


 updateTimer();


 timerInterval=
 setInterval(
  updateTimer,
  250
 );

}


function updateTimer(){

 const remaining=
 Math.max(
  0,
  timerEnd-Date.now()
 );


 const sec=
 Math.ceil(
  remaining/1000
 );


 const m=
 String(
  Math.floor(
   sec/60
  )
 ).padStart(
  2,
  "0"
 );


 const s=
 String(
  sec%60
 ).padStart(
  2,
  "0"
 );


 document
  .getElementById(
   "timerText"
  )
  .textContent=
  `${m}:${s}`;


 if(
  remaining<=0
 ){

  clearInterval(
   timerInterval
  );


  if(
   navigator.vibrate
  ){

   navigator.vibrate(
    [200,100,200]
   );

  }

 }

}


/* タイマー停止 */

function stopTimer(){

 clearInterval(
  timerInterval
 );


 document
  .getElementById(
   "timer"
  )
  .classList.add(
   "hidden"
  );

}


/* バックアップ */

function backup(){

 const blob=
 new Blob(
  [
   JSON.stringify(
    db,
    null,
    2
   )
  ],
  {
   type:"application/json"
  }
 );


 const url=
 URL.createObjectURL(
  blob
 );


 const a=
 document.createElement(
  "a"
 );


 a.href=url;


 a.download=
 "workout-log-backup-"+
 new Date()
  .toISOString()
  .slice(
   0,
   10
  )+
 ".json";


 a.click();


 URL.revokeObjectURL(
  url
 );

}


/* 復元 */

function restore(
 event
){

 const file=
 event.target.files[0];


 if(!file)return;


 const reader=
 new FileReader();


 reader.onload=()=>{

  try{

   const imported=
   JSON.parse(
    reader.result
   );


   if(
    !imported.history ||
    !Array.isArray(
     imported.history
    )
   ){

    throw new Error();

   }


   db=imported;


   draft=
   db.draft || [];


   save();

   render();

   renderHistory();


   alert(
    "バックアップを復元しました！"
   );


  }
  catch{

   alert(
    "バックアップファイルを読み込めませんでした。"
   );

  }

 };


 reader.readAsText(
  file
 );

}


/* 全データ削除 */

function clearAll(){

 if(
  confirm(
   "すべてのトレーニングデータを削除しますか？"
  )
 ){

  db={
   history:[],
   draft:[]
  };


  draft=[];


  save();

  render();

  renderHistory();

 }

}


/* 初期表示 */

render();

renderHistory();

</script>
