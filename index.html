<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>WORKOUT LOG</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#090909;
 color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif;
}

button,input,select,textarea{
 font:inherit;
}

button{
 cursor:pointer;
 border:0;
}

.app{
 max-width:680px;
 margin:auto;
 padding-bottom:90px;
}

header{
 position:sticky;
 top:0;
 z-index:20;
 background:#090909ee;
 backdrop-filter:blur(12px);
 border-bottom:1px solid #252525;
 padding:16px;
}

.logo{
 font-size:20px;
 font-weight:900;
 letter-spacing:1.5px;
}

.date{
 color:#888;
 font-size:12px;
 margin-top:3px;
}

main{
 padding:14px;
}

.card{
 background:#151515;
 border:1px solid #252525;
 border-radius:18px;
 padding:15px;
 margin-bottom:12px;
}

.row{
 display:flex;
 gap:8px;
 align-items:center;
}

.between{
 justify-content:space-between;
}

.title{
 font-weight:900;
 font-size:17px;
}

.sub{
 color:#888;
 font-size:12px;
 margin-top:3px;
}

.btn{
 background:#fff;
 color:#000;
 padding:11px 14px;
 border-radius:12px;
 font-weight:800;
}

.btn.dark{
 background:#242424;
 color:#fff;
}

.btn.red{
 background:#321616;
 color:#ff7777;
}

.btn.green{
 background:#18351f;
 color:#7cff98;
}

.btn.full{
 width:100%;
}

input,select,textarea{
 width:100%;
 border:1px solid #303030;
 background:#0e0e0e;
 color:#fff;
 border-radius:11px;
 padding:11px;
 outline:none;
}

input:focus,select:focus,textarea:focus{
 border-color:#777;
}

label{
 display:block;
 font-size:11px;
 color:#888;
 margin:10px 0 5px;
}

.badge{
 display:inline-block;
 padding:4px 8px;
 border-radius:99px;
 background:#292929;
 color:#aaa;
 font-size:10px;
 margin-left:4px;
}

.set{
 background:#101010;
 border:1px solid #242424;
 border-radius:13px;
 padding:9px;
 margin-top:7px;
}

.setgrid{
 display:grid;
 grid-template-columns:34px 1fr 1fr 38px;
 gap:6px;
 align-items:center;
}

.setnum{
 color:#777;
 text-align:center;
 font-size:12px;
}

.options{
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 margin-top:8px;
}

.toggle{
 background:#222;
 color:#aaa;
 padding:7px 9px;
 border-radius:9px;
 font-size:11px;
}

.toggle.active{
 background:#fff;
 color:#000;
}

.prev{
 background:#191919;
 border-radius:10px;
 padding:8px;
 margin-top:8px;
 font-size:11px;
 color:#aaa;
}

.progress{
 margin-top:6px;
 color:#7cff98;
 font-size:11px;
 font-weight:800;
}

.exercise-actions{
 display:flex;
 gap:6px;
 margin-top:9px;
}

.exercise-actions button{
 flex:1;
}

.empty{
 text-align:center;
 color:#666;
 padding:35px 10px;
}

.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 z-index:30;
 background:#111e;
 backdrop-filter:blur(15px);
 border-top:1px solid #292929;
}

.bottom-inner{
 max-width:680px;
 margin:auto;
 display:flex;
}

.bottom button{
 flex:1;
 padding:14px 4px;
 background:transparent;
 color:#777;
 font-size:11px;
}

.bottom button.active{
 color:#fff;
}

.hidden{
 display:none!important;
}

.history-item{
 padding:13px 0;
 border-bottom:1px solid #292929;
}

.history-item:last-child{
 border:0;
}

.pr{
 display:flex;
 justify-content:space-between;
 padding:10px 0;
 border-bottom:1px solid #292929;
}

.timer{
 position:fixed;
 right:14px;
 bottom:72px;
 z-index:40;
 background:#fff;
 color:#000;
 border-radius:15px;
 padding:12px 15px;
 font-weight:900;
 box-shadow:0 5px 30px #000;
}

.timer button{
 background:#000;
 color:#fff;
 border-radius:8px;
 padding:6px 9px;
 margin-left:6px;
}

h2{
 font-size:14px;
 margin:0 0 10px;
}

.group{
 margin-top:10px;
 border:1px solid #292929;
 border-radius:14px;
 padding:10px;
 background:#0d0d0d;
}

.group-title{
 font-size:12px;
 font-weight:900;
 color:#aaa;
 margin-bottom:8px;
}

.group-exercise{
 background:#151515;
 border:1px solid #292929;
 border-radius:12px;
 padding:10px;
 margin-top:8px;
}

.group-exercise-title{
 font-size:11px;
 color:#888;
 font-weight:800;
 margin-bottom:6px;
}

.group-set{
 background:#101010;
 border:1px solid #242424;
 border-radius:10px;
 padding:8px;
 margin-top:7px;
}

.group-set-grid{
 display:grid;
 grid-template-columns:34px 1fr 1fr 38px;
 gap:6px;
 align-items:center;
}

.group-set-num{
 color:#777;
 font-size:11px;
 text-align:center;
}

.group-actions{
 display:flex;
 gap:6px;
 margin-top:8px;
}

.group-actions button{
 flex:1;
}

.drop-stage{
 background:#151515;
 border:1px solid #292929;
 border-radius:11px;
 padding:8px;
 margin-top:7px;
}

.drop-stage-grid{
 display:grid;
 grid-template-columns:45px 1fr 1fr 38px;
 gap:6px;
 align-items:center;
}

.drop-stage-num{
 color:#777;
 text-align:center;
 font-size:10px;
}

.drop-set{
 background:#101010;
 border:1px solid #242424;
 border-radius:13px;
 padding:9px;
 margin-top:7px;
}

.drop-set-title{
 color:#888;
 font-size:11px;
 font-weight:800;
 margin-bottom:5px;
}

.drop-actions{
 display:flex;
 gap:6px;
 margin-top:8px;
}

.drop-actions button{
 flex:1;
}

.master-row{
 display:grid;
 grid-template-columns:1fr 100px 40px;
 gap:6px;
 margin-top:7px;
 align-items:center;
}

.chart-wrap{
 position:relative;
 width:100%;
 height:260px;
 margin-top:10px;
}

canvas{
 width:100%;
 height:100%;
 background:#101010;
 border:1px solid #292929;
 border-radius:12px;
}

.section-divider{
 height:1px;
 background:#292929;
 margin:14px 0;
}

.small{
 color:#777;
 font-size:11px;
}

@media(max-width:420px){

 .setgrid,
 .group-set-grid{
  grid-template-columns:30px 1fr 1fr 34px;
 }

 .drop-stage-grid{
  grid-template-columns:38px 1fr 1fr 34px;
 }

 .btn{
  padding:10px;
 }

}
</style>
</head>

<body>

<div class="app">

<header>
 <div class="logo">WORKOUT LOG</div>
 <div class="date" id="date"></div>
</header>

<main>

<section id="workoutPage">

<div class="card">

 <div class="row between">

  <div>
   <div class="title">TODAY'S WORKOUT</div>
   <div class="sub">前回の記録を確認しながら入力</div>
  </div>

  <button class="btn green" onclick="finishWorkout()">
   保存
  </button>

 </div>

</div>


<div id="exerciseList"></div>


<div class="card">

 <h2>種目を追加</h2>

 <label>登録済み種目</label>

 <select id="exerciseSelect">
  <option value="">種目を選択</option>
 </select>

 <div class="row" style="margin-top:8px">

  <button
   class="btn"
   style="flex:1"
   onclick="addSelectedExercise('normal')">
   通常セット
  </button>

  <button
   class="btn dark"
   style="flex:1"
   onclick="addSelectedExercise('drop')">
   ドロップセット
  </button>

 </div>

 <div class="row" style="margin-top:8px">

  <button
   class="btn dark"
   style="flex:1"
   onclick="addSelectedExercise('superset')">
   スーパーセット
  </button>

  <button
   class="btn dark"
   style="flex:1"
   onclick="addSelectedExercise('giant')">
   ジャイアントセット
  </button>

 </div>

 <div class="section-divider"></div>

 <h2>登録されていない種目を追加</h2>

 <input
  id="quickExerciseName"
  placeholder="例：ベンチプレス">

 <select
  id="quickExercisePart"
  style="margin-top:7px">

  <option value="胸">胸</option>
  <option value="背中">背中</option>
  <option value="肩">肩</option>
  <option value="脚">脚</option>
  <option value="二頭">二頭</option>
  <option value="三頭">三頭</option>
  <option value="腹">腹</option>
  <option value="その他">その他</option>

 </select>

 <button
  class="btn full"
  style="margin-top:8px"
  onclick="registerAndAdd()">
  種目を登録して追加
 </button>

</div>


<div class="card">

 <button
  class="btn dark full"
  onclick="copyLastWorkout()">
  前回メニューをコピー
 </button>

</div>

</section>


<section id="historyPage" class="hidden">

<div class="card">

 <h2>トレーニング履歴</h2>

 <label>部位で絞り込み</label>

 <select id="historyPart" onchange="renderHistory()">
  <option value="">すべて</option>
  <option value="胸">胸</option>
  <option value="背中">背中</option>
  <option value="肩">肩</option>
  <option value="脚">脚</option>
  <option value="二頭">二頭</option>
  <option value="三頭">三頭</option>
  <option value="腹">腹</option>
  <option value="その他">その他</option>
 </select>

 <div id="historyList"></div>

</div>


<div class="card">

 <h2>種目別PR</h2>

 <div id="prList"></div>

</div>


<div class="card">

 <h2>重量推移</h2>

 <select id="chartExercise" onchange="drawChart()">
  <option value="">種目を選択</option>
 </select>

 <div class="chart-wrap">
  <canvas id="progressChart"></canvas>
 </div>

 <div
  id="chartInfo"
  class="small"
  style="margin-top:7px">
 </div>

</div>

</section>


<section id="settingsPage" class="hidden">

<div class="card">

 <h2>種目管理</h2>

 <div class="small">
 登録した種目は次回から選択できます。
 </div>

 <div id="masterList"></div>

</div>


<div class="card">

 <h2>新しい種目を登録</h2>

 <input
  id="masterName"
  placeholder="種目名">

 <select
  id="masterPart"
  style="margin-top:7px">

  <option value="胸">胸</option>
  <option value="背中">背中</option>
  <option value="肩">肩</option>
  <option value="脚">脚</option>
  <option value="二頭">二頭</option>
  <option value="三頭">三頭</option>
  <option value="腹">腹</option>
  <option value="その他">その他</option>

 </select>

 <button
  class="btn full"
  style="margin-top:8px"
  onclick="registerExercise()">
  種目を登録
 </button>

</div>


<div class="card">

 <h2>データ管理</h2>

 <button
  class="btn full"
  onclick="backup()">
  バックアップ
 </button>

 <label>バックアップを復元</label>

 <input
  type="file"
  accept=".json"
  onchange="restore(event)">

 <button
  class="btn red full"
  style="margin-top:12px"
  onclick="clearAll()">
  全データ削除
 </button>

</div>

</section>

</main>


<div id="timer" class="timer hidden">

 <span id="timerText">
  00:00
 </span>

 <button onclick="stopTimer()">
  停止
 </button>

</div>


<nav class="bottom">

 <div class="bottom-inner">

  <button
   class="active"
   onclick="showPage('workout',this)">
   記録
  </button>

  <button
   onclick="showPage('history',this)">
   履歴
  </button>

  <button
   onclick="showPage('settings',this)">
   設定
  </button>

 </div>

</nav>

</div>


<script>

const KEY="WORKOUT_LOG_V3";

const DEFAULT_PARTS=[
 "胸",
 "背中",
 "肩",
 "脚",
 "二頭",
 "三頭",
 "腹",
 "その他"
];

let db=JSON.parse(
 localStorage.getItem(KEY) ||
 '{"history":[],"draft":[],"exercises":[]}'
);

let draft=db.draft || [];

db.history=db.history || [];
db.exercises=db.exercises || [];

const uid=()=>Date.now().toString(36)+
 Math.random().toString(36).substring(2);

const esc=s=>String(s??"").replace(
 /[&<>"']/g,
 m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[m])
);

document.getElementById("date").textContent=
 new Date().toLocaleDateString(
  "ja-JP",
  {
   year:"numeric",
   month:"long",
   day:"numeric",
   weekday:"short"
  }
);


function save(){

 db.draft=draft;

 localStorage.setItem(
  KEY,
  JSON.stringify(db)
 );

}


function createSet(){

 return{
  id:uid(),
  weight:"",
  reps:"",
  assist:false,
  restPause:false,
  restSeconds:"",
  cheating:false,
  note:""
 };

}


function createGroupExercise(){

 return{
  id:uid(),
  name:"",
  part:"その他",
  sets:[
   createSet(),
   createSet(),
   createSet()
  ]
 };

}


function createDropStage(){

 return{
  id:uid(),
  weight:"",
  reps:"",
  note:""
 };

}


function createDropSet(){

 return{
  id:uid(),
  stages:[
   createDropStage(),
   createDropStage(),
   createDropStage()
  ]
 };

}


function registerExercise(){

 const name=
 document.getElementById(
  "masterName"
 ).value.trim();

 const part=
 document.getElementById(
  "masterPart"
 ).value;

 if(!name){
  alert("種目名を入力してください");
  return;
 }

 const exists=
 db.exercises.find(
  x=>x.name===name
 );

 if(exists){
  alert("その種目はすでに登録されています");
  return;
 }

 db.exercises.push({
  id:uid(),
  name:name,
  part:part
 });

 document.getElementById(
  "masterName"
 ).value="";

 save();

 renderMaster();
 renderExerciseSelect();

 alert("種目を登録しました");

}


function registerAndAdd(){

 const name=
 document.getElementById(
  "quickExerciseName"
 ).value.trim();

 const part=
 document.getElementById(
  "quickExercisePart"
 ).value;

 if(!name){
  alert("種目名を入力してください");
  return;
 }

 let exMaster=
 db.exercises.find(
  x=>x.name===name
 );

 if(!exMaster){

  exMaster={
   id:uid(),
   name:name,
   part:part
  };

  db.exercises.push(exMaster);

 }

 document.getElementById(
  "quickExerciseName"
 ).value="";

 renderExerciseSelect();

 addExercise(
  "normal",
  exMaster.name,
  exMaster.part
 );

}


function deleteMaster(id){

 if(
  !confirm(
   "この種目を登録リストから削除しますか？\n過去の記録は削除されません。"
  )
 ){
  return;
 }

 db.exercises=
 db.exercises.filter(
  x=>x.id!==id
 );

 save();

 renderMaster();
 renderExerciseSelect();

}


function renderMaster(){

 const root=
 document.getElementById(
  "masterList"
 );

 if(!db.exercises.length){

  root.innerHTML=
  '<div class="empty">登録された種目はありません</div>';

  return;
 }

 root.innerHTML=
 db.exercises.map(
  ex=>`

  <div class="master-row">

   <div>
    <b>${esc(ex.name)}</b>
    <div class="small">${esc(ex.part)}</div>
   </div>

   <div></div>

   <button
    class="btn red"
    onclick="deleteMaster('${ex.id}')">
    ×
   </button>

  </div>

  `
 ).join("");

}


function renderExerciseSelect(){

 const select=
 document.getElementById(
  "exerciseSelect"
 );

 select.innerHTML=
 '<option value="">種目を選択</option>';

 db.exercises.forEach(
  ex=>{

   const option=
   document.createElement(
    "option"
   );

   option.value=ex.id;

   option.textContent=
   `${ex.name} / ${ex.part}`;

   select.appendChild(
    option
   );

  }
 );

}


function addSelectedExercise(type){

 const id=
 document.getElementById(
  "exerciseSelect"
 ).value;

 if(!id){

  alert("種目を選択してください");

  return;
 }

 const master=
 db.exercises.find(
  x=>x.id===id
 );

 if(!master)return;

 addExercise(
  type,
  master.name,
  master.part
 );

}


function addExercise(
 type,
 name="",
 part="その他"
){

 const ex={
  id:uid(),
  type:type,
  name:name,
  part:part,
  sets:[]
 };


 if(
  type==="normal"
 ){

  ex.sets=[
   createSet(),
   createSet(),
   createSet()
  ];

 }


 if(
  type==="drop"
 ){

  ex.sets=[
   createDropSet(),
   createDropSet(),
   createDropSet()
  ];

 }


 if(
  type==="superset"
 ){

  ex.items=[
   createGroupExercise(),
   createGroupExercise()
  ];

 }


 if(
  type==="giant"
 ){

  ex.items=[
   createGroupExercise(),
   createGroupExercise(),
   createGroupExercise(),
   createGroupExercise()
  ];

 }


 draft.push(ex);

 save();

 render();

}


function previous(name){

 if(!name)return null;

 for(
  const workout of db.history
 ){

  for(
   const ex of workout.exercises || []
  ){

   if(
    (ex.type==="normal" ||
     ex.type==="drop") &&
    ex.name===name
   ){

    return ex;

   }

   if(
    ex.type==="superset" ||
    ex.type==="giant"
   ){

    for(
     const item of ex.items || []
    ){

     if(item.name===name){

      return item;

     }

    }

   }

  }

 }

 return null;

}


function previousBest(name){

 const prev=
 previous(name);

 if(!prev)return null;

 let bestWeight=0;
 let bestReps=0;

 if(prev.sets){

  prev.sets.forEach(
   s=>{

    if(
     s.stages
    ){

     s.stages.forEach(
      stage=>{

       bestWeight=
       Math.max(
        bestWeight,
        Number(stage.weight)||0
       );

       if(
        Number(stage.weight)===bestWeight
       ){

        bestReps=
        Math.max(
         bestReps,
         Number(stage.reps)||0
        );

       }

      }
     );

    }else{

     const w=
     Number(s.weight)||0;

     const r=
     Number(s.reps)||0;

     if(w>bestWeight){

      bestWeight=w;
      bestReps=r;

     }else if(
      w===bestWeight &&
      r>bestReps
     ){

      bestReps=r;

     }

    }

   }
  );

 }

 return{
  weight:bestWeight,
  reps:bestReps
 };

}


function deleteExercise(id){

 draft=
 draft.filter(
  e=>e.id!==id
 );

 save();

 render();

}


function addSet(eid){

 const e=
 draft.find(
  x=>x.id===eid
 );

 if(!e)return;

 e.sets.push(
  createSet()
 );

 save();

 render();

}


function deleteSet(eid,sid){

 const e=
 draft.find(
  x=>x.id===eid
 );

 if(!e)return;

 e.sets=
 e.sets.filter(
  s=>s.id!==sid
 );

 save();

 render();

}


function addDropSet(eid){

 const e=
 draft.find(
  x=>x.id===eid
 );

 if(!e)return;

 e.sets.push(
  createDropSet()
 );

 save();

 render();

}


function addDropStage(
 eid,
 sid
){

 const e=
 draft.find(
  x=>x.id===eid
 );

 if(!e)return;

 const set=
 e.sets.find(
  x=>x.id===sid
 );

 if(!set)return;

 set.stages.push(
  createDropStage()
 );

 save();

 render();

}


function deleteDropStage(
 eid,
 sid,
 stageId
){

 const e=
 draft.find(
  x=>x.id===eid
 );

 if(!e)return;

 const set=
 e.sets.find(
  x=>x.id===sid
 );

 if(!set)return;

 if(
  set.stages.length<=1
 ){

  alert(
   "最低1段階は必要です"
  );

  return;

 }

 set.stages=
 set.stages.filter(
  x=>x.id!==stageId
 );

 save();

 render();

}


function deleteDropSet(
 eid,
 sid
){

 const e=
 draft.find(
  x=>x.id===eid
 );

 if(!e)return;

 e.sets=
 e.sets.filter(
  x=>x.id!==sid
 );

 save();

 render();

}


function addGroupExercise(eid){

 const e=
 draft.find(
  x=>x.id===eid
 );

 if(!e)return;

 e.items.push(
  createGroupExercise()
 );

 save();

 render();

}


function deleteGroupExercise(
 eid,
 itemId
){

 const e=
 draft.find(
  x=>x.id===eid
 );

 if(!e)return;

 if(
  e.items.length<=2
 ){

  alert(
   "最低2種目は必要です"
  );

  return;

 }

 e.items=
 e.items.filter(
  x=>x.id!==itemId
 );

 save();

 render();

}


function addGroupSet(
 eid,
 itemId
){

 const e=
 draft.find(
  x=>x.id===eid
 );

function renderHistory(){

  "historyList"
 );

  "historyPart"
 )?.value || "";

 if(!db.history.length){

  root.innerHTML=
  '<div class="empty">まだ記録がありません</div>';

  w=>{

   const date=
   new Date(
    w.date
   ).toLocaleDateString(
    "ja-JP",
    {
     year:"numeric",
     month:"short",
     day:"numeric"
    }
   );

   const exNames=[];

   w.exercises.forEach(
    e=>{

     if(

      e.type==="giant"

        `${

        ).join(" → ")

       !filter ||
       e.part===filter

       exNames.push(
        esc(
         e.name||

        )
       );

 root.innerHTML=
 html.length
 ?
 html.join("")

function renderPR(){

 const root=
 document.getElementById(
  "prList"
 );

 const prs={};

 db.history.forEach(
  w=>{

   w.exercises.forEach(
    e=>{

     if(
      e.type==="superset" ||
      e.type==="giant"
     ){

      e.items.forEach(
       item=>{

        if(!item.name)return;

        item.sets.forEach(
         s=>{

          const weight=
          Number(s.weight)||0;

          if(
           !prs[item.name] ||
           weight>prs[item.name]
          ){

       set=>{

        if(set.stages){

         set.stages.forEach(
          stage=>{

           const weight=
           Number(stage.weight)||0;

           if(
            !prs[e.name] ||
            weight>prs[e.name]
           ){

            prs[e.name]=weight;

           }

          }
         );

        }else{

         const weight=
         Number(set.weight)||0;

          !prs[e.name] ||
          weight>prs[e.name]
         ){

          prs[e.name]=weight;

         }

      );

function getExerciseHistory(name){

 const result=[];

 db.history
 .slice()
 .reverse()
 .forEach(
  w=>{

   let best=0;

   w.exercises.forEach(
    e=>{

     if(
      e.type==="superset" ||
      e.type==="giant"
     ){

      e.items.forEach(
       item=>{

        if(
         item.name!==name
        )return;

        item.sets.forEach(
         s=>{
          best=Math.max(
           best,
           Number(s.weight)||0
          );
         }
        );

       }
      );

     }else{

      if(e.name!==name)return;

      e.sets.forEach(
       set=>{

        if(set.stages){

         set.stages.forEach(
          stage=>{
           best=Math.max(
            best,
            Number(stage.weight)||0
           );
          }
         );

        }else{

         best=Math.max(
          best,
          Number(set.weight)||0
         );

        }

       }
      );

     }

    }
   );

   if(best>0){

    result.push({
     date:new Date(w.date),
     weight:best
    });

   }

  }
 );

 return result;

}


function drawChart(){

 const canvas=
 document.getElementById(
  "progressChart"
 );

 const ctx=
 canvas.getContext("2d");

 const wrap=
 canvas.parentElement;

 const width=
 wrap.clientWidth;

 const height=
 wrap.clientHeight;

 const dpr=
 window.devicePixelRatio||1;

 canvas.width=
 width*dpr;

 canvas.height=
 height*dpr;

 ctx.scale(dpr,dpr);

 ctx.clearRect(
  0,
  0,
  width,
  height
 );

 const name=
 document.getElementById(
  "chartExercise"
 ).value;

 const info=
 document.getElementById(
  "chartInfo"
 );

 if(!name){

  info.textContent=
  "種目を選択すると重量推移が表示されます";

  return;

 }

 const data=
 getExerciseHistory(name);

 if(!data.length){

  info.textContent=
  "記録がありません";

  return;

 }

 const pad=35;

 const max=
 Math.max(
  ...data.map(
   x=>x.weight
  )
 );

 const min=
 Math.min(
  ...data.map(
   x=>x.weight
  )
 );

 const range=
 Math.max(
  1,
  max-min
 );

 ctx.strokeStyle="#292929";
 ctx.lineWidth=1;

 for(let i=0;i<5;i++){

  const y=
  pad+
  ((height-pad*1.5)/4)*i;

  ctx.beginPath();

  ctx.moveTo(
   pad,
   y
  );

  ctx.lineTo(
   width-pad,
   y
  );

  ctx.stroke();

 }

 ctx.strokeStyle="#fff";
 ctx.lineWidth=2;

 ctx.beginPath();

 data.forEach(
  (point,i)=>{

   const x=
   data.length===1
   ?
   width/2
   :
   pad+
   ((width-pad*2)/
   (data.length-1))*i;

   const y=
   pad+
   (height-pad*1.5)*
   (1-(point.weight-min)/range);

   if(i===0){
    ctx.moveTo(x,y);
   }else{
    ctx.lineTo(x,y);
   }

  }
 );

 ctx.stroke();

 data.forEach(
  (point,i)=>{

   const x=
   data.length===1
   ?
   width/2
   :
   pad+
   ((width-pad*2)/
   (data.length-1))*i;

   const y=
   pad+
   (height-pad*1.5)*
   (1-(point.weight-min)/range);

   ctx.fillStyle="#fff";

   ctx.beginPath();

   ctx.arc(
    x,
    y,
    4,
    0,
    Math.PI*2
   );

   ctx.fill();

  }
 );

 ctx.fillStyle="#888";
 ctx.font="10px sans-serif";

 ctx.fillText(
  `${max}kg`,
  5,
  pad+4
 );

 ctx.fillText(
  `${min}kg`,
  5,
  height-20
 );

 const first=
 data[0];

 const last=
 data[data.length-1];

 const diff=
 last.weight-first.weight;

 info.textContent=
 `記録 ${data.length}回 / 初回 ${first.weight}kg → 最新 ${last.weight}kg / ${
  diff>0
  ?
  "+"+diff
  :
  diff
 }kg`;

}


function showPage(
 name,
 button
){

 [
  "workout",
  "history",
  "settings"
 ].forEach(
  x=>{

   document
   .getElementById(
    x+"Page"
   )
   .classList.toggle(
    "hidden",
    x!==name
   );

  }
 );

 document
 .querySelectorAll(
  ".bottom button"
 )
 .forEach(
  b=>
  b.classList.remove(
   "active"
  )
 );

 button.classList.add(
  "active"
 );

 if(
  name==="history"
 ){

  renderHistory();
  renderChartSelect();
  drawChart();

 }

 if(
  name==="settings"
 ){

  renderMaster();

 }

}


let timerInterval=null;
let timerEnd=0;


function startTimer(seconds){

 stopTimer();

 timerEnd=
 Date.now()+
 seconds*1000;

 document
 .getElementById(
  "timer"
 )
 .classList.remove(
  "hidden"
 );

 updateTimer();

 timerInterval=
 setInterval(
  updateTimer,
  250
 );

}


function updateTimer(){

 const remaining=
 Math.max(
  0,
  timerEnd-Date.now()
 );

 const sec=
 Math.ceil(
  remaining/1000
 );

 const m=
 String(
  Math.floor(sec/60)
 ).padStart(2,"0");

 const s=
 String(
  sec%60
 ).padStart(2,"0");

 document
 .getElementById(
  "timerText"
 )
 .textContent=
 `${m}:${s}`;

 if(remaining<=0){

  clearInterval(
   timerInterval
  );

  if(
   navigator.vibrate
  ){

   navigator.vibrate(
    [200,100,200]
   );

  }

 }

}


function stopTimer(){

 clearInterval(
  timerInterval
 );

 document
 .getElementById(
  "timer"
 )
 .classList.add(
  "hidden"
 );

}


function backup(){

 const blob=
 new Blob(
  [
   JSON.stringify(
    db,
    null,
    2
   )
  ],
  {
   type:"application/json"
  }
 );

 const url=
 URL.createObjectURL(
  blob
 );

 const a=
 document.createElement(
  "a"
 );

 a.href=url;

 a.download=
 "workout-log-backup-"+
 new Date()
 .toISOString()
 .slice(0,10)+
 ".json";

 a.click();

 URL.revokeObjectURL(
  url
 );

}


function restore(event){

 const file=
 event.target.files[0];

 if(!file)return;

 const reader=
 new FileReader();

 reader.onload=()=>{

  try{

   const imported=
   JSON.parse(
    reader.result
   );

   if(
    !imported.history ||
    !Array.isArray(
     imported.history
    )
   ){

    throw new Error();

   }

   db=imported;

   db.history=
   db.history||[];

   db.draft=
   db.draft||[];

   db.exercises=
   db.exercises||[];

   draft=db.draft;

   save();

   render();

   renderHistory();

   renderExerciseSelect();

   renderMaster();

   renderChartSelect();

   alert(
    "バックアップを復元しました"
   );

  }catch{

   alert(
    "バックアップファイルを読み込めませんでした"
   );

  }

 };

 reader.readAsText(file);

}


function clearAll(){

 if(
  confirm(
   "すべてのトレーニングデータを削除しますか？"
  )
 ){

  db={
   history:[],
   draft:[],
   exercises:[]
  };

  draft=[];

  save();

  render();

  renderHistory();

  renderExerciseSelect();

  renderMaster();

  renderChartSelect();

 }

}


renderExerciseSelect();
renderMaster();
render();
renderHistory();
renderChartSelect();

window.addEventListener(
 "resize",
 drawChart
);

</script>
