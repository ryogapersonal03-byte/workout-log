<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>WORKOUT LOG</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#090909;
 color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif;
}

button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}

.app{
 max-width:680px;
 margin:auto;
 padding-bottom:90px;
}

header{
 position:sticky;
 top:0;
 z-index:20;
 background:#090909ee;
 backdrop-filter:blur(12px);
 border-bottom:1px solid #252525;
 padding:16px;
}

.logo{
 font-size:20px;
 font-weight:900;
 letter-spacing:1.5px;
}

.date{
 color:#888;
 font-size:12px;
 margin-top:3px;
}

main{padding:14px}

.card{
 background:#151515;
 border:1px solid #252525;
 border-radius:18px;
 padding:15px;
 margin-bottom:12px;
}

.row{
 display:flex;
 gap:8px;
 align-items:center;
}

.between{justify-content:space-between}

.title{
 font-weight:900;
 font-size:17px;
}

.sub{
 color:#888;
 font-size:12px;
 margin-top:3px;
}

.btn{
 background:#fff;
 color:#000;
 padding:11px 14px;
 border-radius:12px;
 font-weight:800;
}

.btn.dark{
 background:#242424;
 color:#fff;
}

.btn.red{
 background:#321616;
 color:#ff7777;
}

.btn.green{
 background:#18351f;
 color:#7cff98;
}

.btn.full{width:100%}

input,select,textarea{
 width:100%;
 border:1px solid #303030;
 background:#0e0e0e;
 color:#fff;
 border-radius:11px;
 padding:11px;
 outline:none;
}

input:focus,select:focus,textarea:focus{
 border-color:#777;
}

label{
 display:block;
 font-size:11px;
 color:#888;
 margin:10px 0 5px;
}

.badge{
 display:inline-block;
 padding:4px 8px;
 border-radius:99px;
 background:#292929;
 color:#aaa;
 font-size:10px;
 margin-left:4px;
}

.set{
 background:#101010;
 border:1px solid #242424;
 border-radius:13px;
 padding:9px;
 margin-top:7px;
}

.setgrid{
 display:grid;
 grid-template-columns:34px 1fr 1fr 38px;
 gap:6px;
 align-items:center;
}

.setnum{
 color:#777;
 text-align:center;
 font-size:12px;
}

.options{
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 margin-top:8px;
}

.toggle{
 background:#222;
 color:#aaa;
 padding:7px 9px;
 border-radius:9px;
 font-size:11px;
}

.toggle.active{
 background:#fff;
 color:#000;
}

.small{
 font-size:11px;
 color:#777;
}

.prev{
 background:#191919;
 border-radius:10px;
 padding:8px;
 margin-top:8px;
 font-size:11px;
 color:#aaa;
}

.exercise-actions{
 display:flex;
 gap:6px;
 margin-top:9px;
}

.exercise-actions button{
 flex:1;
}

.empty{
 text-align:center;
 color:#666;
 padding:35px 10px;
}

.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 z-index:30;
 background:#111e;
 backdrop-filter:blur(15px);
 border-top:1px solid #292929;
}

.bottom-inner{
 max-width:680px;
 margin:auto;
 display:flex;
}

.bottom button{
 flex:1;
 padding:14px 4px;
 background:transparent;
 color:#777;
 font-size:11px;
}

.bottom button.active{
 color:#fff;
}

.hidden{
 display:none!important;
}

.history-item{
 padding:13px 0;
 border-bottom:1px solid #292929;
}

.history-item:last-child{
 border:0;
}

.history-exercise{
 margin-top:12px;
 padding:10px;
 background:#101010;
 border-radius:12px;
 border:1px solid #242424;
}

.history-set{
 display:flex;
 justify-content:space-between;
 padding:6px 0;
 border-bottom:1px solid #222;
 font-size:12px;
}

.history-set:last-child{
 border-bottom:0;
}

.pr{
 display:flex;
 justify-content:space-between;
 padding:10px 0;
 border-bottom:1px solid #292929;
}

.timer{
 position:fixed;
 right:14px;
 bottom:72px;
 z-index:40;
 background:#fff;
 color:#000;
 border-radius:15px;
 padding:12px 15px;
 font-weight:900;
 box-shadow:0 5px 30px #000;
}

.timer button{
 background:#000;
 color:#fff;
 border-radius:8px;
 padding:6px 9px;
 margin-left:6px;
}

h2{
 font-size:14px;
 margin:0 0 10px;
}

.method-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}

.method{
 background:#222;
 color:#fff;
 border:1px solid #333;
 border-radius:13px;
 padding:15px 8px;
 text-align:center;
 font-weight:800;
}

.method:hover{
 border-color:#777;
}

.exercise-picker{
 margin-top:12px;
}

.part-title{
 font-size:12px;
 font-weight:900;
 color:#aaa;
 margin:15px 0 7px;
}

.exercise-choice{
 display:flex;
 gap:7px;
 margin-top:6px;
}

.exercise-choice button:first-child{
 flex:1;
 text-align:left;
}

.delete-small{
 background:#321616;
 color:#ff7777;
 border-radius:9px;
 padding:7px 10px;
}

.drop-row{
 display:grid;
 grid-template-columns:34px 1fr 1fr 38px;
 gap:6px;
 align-items:center;
 margin-top:7px;
}

.group-exercise{
 background:#101010;
 border:1px solid #242424;
 border-radius:13px;
 padding:10px;
 margin-top:8px;
}

.group-header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:8px;
}

@media(max-width:420px){
 .setgrid,
 .drop-row{
  grid-template-columns:30px 1fr 1fr 34px;
 }

 .btn{
  padding:10px 10px;
 }
}
</style>
</head>

<body>

<div class="app">

<header>
 <div class="logo">WORKOUT LOG</div>
 <div class="date" id="date"></div>
</header>

<main>

<section id="workoutPage">

<div class="card">
 <div class="row between">
  <div>
   <div class="title">TODAY'S WORKOUT</div>
   <div class="sub">前回の記録を確認しながら入力</div>
  </div>

  <button class="btn green" onclick="finishWorkout()">
   保存
  </button>
 </div>
</div>

<div id="exerciseList"></div>

<!-- セット法選択 -->
<div class="card">

 <h2>セット法を選択</h2>

 <div class="method-grid">

  <button class="method"
   onclick="openExercisePicker('normal')">
   通常セット
  </button>

  <button class="method"
   onclick="openExercisePicker('drop')">
   ドロップセット
  </button>

  <button class="method"
   onclick="openExercisePicker('superset')">
   スーパーセット
  </button>

  <button class="method"
   onclick="openExercisePicker('giant')">
   ジャイアントセット
  </button>

 </div>

 <div id="exercisePicker"></div>

</div>

<div class="card">
 <button class="btn dark full"
 onclick="copyLastWorkout()">
 前回メニューをコピー
 </button>
</div>

</section>


<section id="historyPage" class="hidden">

<div class="card">

 <h2>トレーニング履歴</h2>

 <div id="historyList"></div>

</div>

<div class="card">

 <h2>種目別PR</h2>

 <div id="prList"></div>

</div>

</section>


<section id="settingsPage" class="hidden">

<div class="card">

 <h2>種目管理</h2>

 <div id="exerciseManager"></div>

</div>

<div class="card">

 <h2>データ管理</h2>

 <button class="btn full" onclick="backup()">
 バックアップ
 </button>

 <label>バックアップを復元</label>

 <input
  type="file"
  accept=".json"
  onchange="restore(event)"
 >

 <button
  class="btn red full"
  style="margin-top:12px"
  onclick="clearAll()">
  全データ削除
 </button>

</div>

</section>

</main>


<div id="timer" class="timer hidden">

 <span id="timerText">00:00</span>

 <button onclick="stopTimer()">
  停止
 </button>

</div>


<nav class="bottom">

 <div class="bottom-inner">

  <button class="active"
   onclick="showPage('workout',this)">
   記録
  </button>

  <button
   onclick="showPage('history',this)">
   履歴
  </button>

  <button
   onclick="showPage('settings',this)">
   設定
  </button>

 </div>

</nav>

</div>


<script>

const KEY="WORKOUT_LOG_V3";

let db=JSON.parse(
 localStorage.getItem(KEY) ||
 '{"history":[],"draft":[],"exerciseLibrary":[]}'
);

let draft=db.draft || [];

let exerciseLibrary=db.exerciseLibrary || [];

const parts=[
 "胸",
 "背中",
 "肩",
 "腕",
 "脚",
 "お尻",
 "腹部",
 "その他"
];

const uid=()=>Date.now().toString(36)+
 Math.random().toString(36).substring(2);

const esc=s=>String(s??"").replace(
 /[&<>"']/g,
 m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[m])
);


document.getElementById("date").textContent=
 new Date().toLocaleDateString(
  "ja-JP",
  {
   year:"numeric",
   month:"long",
   day:"numeric",
   weekday:"short"
  }
);


function save(){

 db.draft=draft;
 db.exerciseLibrary=exerciseLibrary;

 localStorage.setItem(
  KEY,
  JSON.stringify(db)
 );

}


function previous(name){

 if(!name)return null;

 for(const workout of db.history){

  for(const ex of workout.exercises || []){

   if(ex.name===name){
    return ex;
   }

  }

 }

 return null;

}


/* =========================
   種目ライブラリ
========================= */

function addLibraryExercise(name,part){

 if(!name.trim())return;

 exerciseLibrary.push({
  id:uid(),
  name:name.trim(),
  part
 });

 save();

 renderExerciseManager();

}


function removeLibraryExercise(id){

 exerciseLibrary=
 exerciseLibrary.filter(x=>x.id!==id);

 save();

 renderExerciseManager();

}


function renderExerciseManager(){

 const root=
 document.getElementById("exerciseManager");

 if(!exerciseLibrary.length){

  root.innerHTML=
  '<div class="empty">登録された種目はありません</div>';

  return;

 }

 root.innerHTML=parts.map(part=>{

  const list=
  exerciseLibrary.filter(x=>x.part===part);

  if(!list.length)return "";

  return`

  <div class="part-title">
   ${part}
  </div>

  ${list.map(x=>`

   <div class="exercise-choice">

    <div class="btn dark">
     ${esc(x.name)}
    </div>

    <button
     class="delete-small"
     onclick="removeLibraryExercise('${x.id}')">
     ×
    </button>

   </div>

  `).join("")}

  `;

 }).join("")+

 `

 <label>種目名</label>

 <input
  id="newExerciseName"
  placeholder="例：スクワット"
 >

 <label>部位</label>

 <select id="newExercisePart">

  ${parts.map(p=>
   `<option value="${p}">${p}</option>`
  ).join("")}

 </select>

 <button
  class="btn full"
  style="margin-top:10px"
  onclick="createLibraryExercise()">
  種目を登録
 </button>

 `;

}


function createLibraryExercise(){

 const name=
 document.getElementById("newExerciseName").value;

 const part=
 document.getElementById("newExercisePart").value;

 addLibraryExercise(name,part);

}


/* =========================
   セット法選択
========================= */

let selectedMethod=null;


function openExercisePicker(type){

 selectedMethod=type;

 const root=
 document.getElementById("exercisePicker");

 root.innerHTML=`

 <div class="exercise-picker">

  <div class="sub">
   ${methodName(type)}の種目を選択
  </div>

  ${parts.map(part=>{

   const list=
   exerciseLibrary.filter(x=>x.part===part);

   if(!list.length)return "";

   return`

   <div class="part-title">
    ${part}
   </div>

   ${list.map(x=>`

    <button
     class="btn dark full"
     style="margin-top:5px"
     onclick="addExerciseFromLibrary(
      '${type}',
      '${x.id}'
     )">
     ${esc(x.name)}
    </button>

   `).join("")}

   `;

  }).join("")}

  <button
   class="btn red full"
   style="margin-top:12px"
   onclick="cancelPicker()">
   キャンセル
  </button>

 </div>

 `;

}


function cancelPicker(){

 selectedMethod=null;

 document.getElementById(
  "exercisePicker"
 ).innerHTML="";

}


function methodName(type){

 return{
  normal:"通常セット",
  drop:"ドロップセット",
  superset:"スーパーセット",
  giant:"ジャイアントセット"
 }[type] || type;

}


/* =========================
   種目追加
========================= */

function newSet(){

 return{
  id:uid(),
  weight:"",
  reps:"",
  assist:false,
  restPause:false,
  restSeconds:"",
  cheating:false,
  note:""
 };

}


function addExerciseFromLibrary(type,libraryId){

 const lib=
 exerciseLibrary.find(x=>x.id===libraryId);

 if(!lib)return;

 let ex={
  id:uid(),
  type,
  name:lib.name,
  part:lib.part,
  sets:[]
 };

 if(type==="normal"){

  ex.sets=[
   newSet(),
   newSet(),
   newSet()
  ];

 }

 if(type==="drop"){

  ex.sets=[
   newSet(),
   newSet()
  ];

 }

 if(type==="superset"){

  ex.group=[
   {
    id:uid(),
    name:lib.name,
    part:lib.part,
    sets:[newSet(),newSet(),newSet()]
   }
  ];

  ex.sets=ex.group[0].sets;

 }

 if(type==="giant"){

  ex.group=[
   {
    id:uid(),
    name:lib.name,
    part:lib.part,
    sets:[newSet(),newSet(),newSet()]
   }
  ];

  ex.sets=ex.group[0].sets;

 }

 draft.push(ex);

 save();

 cancelPicker();

 render();

}


/* =========================
   通常セット
========================= */

function addSet(eid){

 const e=draft.find(x=>x.id===eid);

 if(!e)return;

 e.sets.push(newSet());

 save();

 render();

}


function deleteSet(eid,sid){

 const e=draft.find(x=>x.id===eid);

 if(!e)return;

 if(e.sets.length<=1){

  alert("最低1セットは残してください");

  return;

 }

 e.sets=
 e.sets.filter(s=>s.id!==sid);

 save();

 render();

}


/* =========================
   ドロップセット
========================= */

function addDropSet(eid){

 const e=draft.find(x=>x.id===eid);

 if(!e)return;

 e.sets.push(newSet());

 save();

 render();

}


function deleteDropSet(eid,sid){

 deleteSet(eid,sid);

}


/* =========================
   グループ種目
========================= */

function addGroupExercise(eid){

 const e=draft.find(x=>x.id===eid);

 if(!e)return;

 const item={
  id:uid(),
  name:"",
  part:"その他",
  sets:[
   newSet(),
   newSet(),
   newSet()
  ]
 };

 e.group.push(item);

 save();

 render();

}


function deleteGroupExercise(eid,gid){

 const e=draft.find(x=>x.id===eid);

 if(!e)return;

 if(e.group.length<=2){

  alert("最低2種目は残してください");

  return;

 }

 e.group=
 e.group.filter(g=>g.id!==gid);

 syncGroupSets(e);

 save();

 render();

}


function addGroupSet(eid,gid){

 const e=draft.find(x=>x.id===eid);

 if(!e)return;

 const g=e.group.find(x=>x.id===gid);

 if(!g)return;

 g.sets.push(newSet());

 syncGroupSets(e);

 save();

 render();

}


function deleteGroupSet(eid,gid,sid){

 const e=draft.find(x=>x.id===eid);

 if(!e)return;

 const g=e.group.find(x=>x.id===gid);

 if(!g)return;

 if(g.sets.length<=1){

  alert("最低1セットは残してください");

  return;

 }

 g.sets=
 g.sets.filter(s=>s.id!==sid);

 syncGroupSets(e);

 save();

 render();

}


function syncGroupSets(e){

 if(e.group && e.group.length){

  e.sets=e.group[0].sets;

 }

}


/* =========================
   更新
========================= */

function updateExercise(id,key,value){

 const e=draft.find(x=>x.id===id);

 if(!e)return;

 e[key]=value;

 save();

}


function updateGroupExercise(eid,gid,key,value){

 const e=draft.find(x=>x.id===eid);

 if(!e)return;

 const g=e.group.find(x=>x.id===gid);

 if(!g)return;

 g[key]=value;

 if(key==="name"){
  e.name=g.name;
 }

 save();

}


function updateSet(eid,sid,key,value){

 const e=draft.find(x=>x.id===eid);

 if(!e)return;

 const s=e.sets.find(x=>x.id===sid);

 if(!s)return;

 s[key]=value;

 save();

}


function updateGroupSet(
 eid,
 gid,
 sid,
 key,
 value
){

 const e=draft.find(x=>x.id===eid);

 if(!e)return;

 const g=e.group.find(x=>x.id===gid);

 if(!g)return;

 const s=g.sets.find(x=>x.id===sid);

 if(!s)return;

 s[key]=value;

 save();

}


function toggleSet(eid,sid,key){

 const e=draft.find(x=>x.id===eid);

 if(!e)return;

 const s=e.sets.find(x=>x.id===sid);

 if(!s)return;

 s[key]=!s[key];

 save();

 render();

}


function toggleGroupSet(
 eid,gid,sid,key
){

 const e=draft.find(x=>x.id===eid);

 if(!e)return;

 const g=e.group.find(x=>x.id===gid);

 if(!g)return;

 const s=g.sets.find(x=>x.id===sid);

 if(!s)return;

 s[key]=!s[key];

 save();

 render();

}


/* =========================
   種目削除
========================= */

function deleteExercise(id){

 if(!confirm("この種目を削除しますか？")){
  return;
 }

 draft=
 draft.filter(e=>e.id!==id);

 save();

 render();

}


/* =========================
   セット表示
========================= */

function renderSet(
 e,
 s,
 i
){

 return`

 <div class="set">

  <div class="setgrid">

   <div class="setnum">
    SET<br>${i+1}
   </div>

   <input
    type="number"
    step="0.5"
    placeholder="重量 kg"
    value="${esc(s.weight)}"
    oninput="
     updateSet(
      '${e.id}',
      '${s.id}',
      'weight',
      this.value
     )
    "
   >

   <input
    type="number"
    placeholder="回数"
    value="${esc(s.reps)}"
    oninput="
     updateSet(
      '${e.id}',
      '${s.id}',
      'reps',
      this.value
     )
    "
   >

   <button
    class="btn red"
    onclick="
     deleteSet(
      '${e.id}',
      '${s.id}'
     )
    ">
    ×
   </button>

  </div>

  <div class="options">

   <button
    class="toggle ${s.assist?'active':''}"
    onclick="
     toggleSet(
      '${e.id}',
      '${s.id}',
      'assist'
     )
    ">
    補助
   </button>

   <button
    class="toggle ${s.restPause?'active':''}"
    onclick="
     toggleSet(
      '${e.id}',
      '${s.id}',
      'restPause'
     )
    ">
    レストポーズ
   </button>

   <button
    class="toggle ${s.cheating?'active':''}"
    onclick="
     toggleSet(
      '${e.id}',
      '${s.id}',
      'cheating'
     )
    ">
    チーティング
   </button>

  </div>

  ${s.restPause?`

   <div class="row" style="margin-top:7px">

    <input
     type="number"
     placeholder="休憩秒数"
     value="${esc(s.restSeconds)}"
     oninput="
      updateSet(
       '${e.id}',
       '${s.id}',
       'restSeconds',
       this.value
      )
     "
    >

    <button
     class="btn"
     onclick="
      startTimer(
       ${Number(s.restSeconds)||15}
      )
     ">
     タイマー
    </button>

   </div>

  `:""}

  <input
   style="margin-top:7px"
   placeholder="メモ"
   value="${esc(s.note)}"
   oninput="
    updateSet(
     '${e.id}',
     '${s.id}',
     'note',
     this.value
    )
   "
  >

 </div>

 `;

}


/* =========================
   グループ表示
========================= */

function renderGroupExercise(e,g){

 return`

 <div class="group-exercise">

  <div class="group-header">

   <input
    placeholder="種目名"
    value="${esc(g.name)}"
    oninput="
     updateGroupExercise(
      '${e.id}',
      '${g.id}',
      'name',
      this.value
     )
    "
   >

   <button
    class="delete-small"
    onclick="
     deleteGroupExercise(
      '${e.id}',
      '${g.id}'
     )
    ">
    ×
   </button>

  </div>

  ${g.sets.map((s,i)=>`

   <div class="set">

    <div class="setgrid">

     <div class="setnum">
      SET<br>${i+1}
     </div>

     <input
      type="number"
      step="0.5"
      placeholder="重量 kg"
      value="${esc(s.weight)}"
      oninput="
       updateGroupSet(
        '${e.id}',
        '${g.id}',
        '${s.id}',
        'weight',
        this.value
       )
      "
     >

     <input
      type="number"
      placeholder="回数"
      value="${esc(s.reps)}"
      oninput="
       updateGroupSet(
        '${e.id}',
        '${g.id}',
        '${s.id}',
        'reps',
        this.value
       )
      "
     >

     <button
      class="btn red"
      onclick="
       deleteGroupSet(
        '${e.id}',
        '${g.id}',
        '${s.id}'
       )
      ">
      ×
     </button>

    </div>

   </div>

  `).join("")}

  <button
   class="btn dark full"
   style="margin-top:8px"
   onclick="
    addGroupSet(
     '${e.id}',
     '${g.id}'
    )
   ">
   ＋ セット
  </button>

 </div>

 `;

}


/* =========================
   メイン描画
========================= */

function render(){

 const root=
 document.getElementById("exerciseList");

 root.innerHTML="";

 if(!draft.length){

  root.innerHTML=
  '<div class="card empty">セット法を選択して種目を追加してください</div>';

  return;

 }


 draft.forEach((e,index)=>{

  const prev=
  previous(e.name);

  let html=`

  <div class="card">

   <div class="row between">

    <div class="title">
     ${index+1}. ${esc(e.name || "種目名")}
     <span class="badge">
      ${methodName(e.type)}
     </span>
    </div>

    <button
     class="btn red"
     onclick="
      deleteExercise('${e.id}')
     ">
     削除
    </button>

   </div>
  `;


  if(e.type==="normal" || e.type==="drop"){

   if(prev){

    html+=`

    <div class="prev">

     前回：
     ${prev.sets.map(s=>
      `${s.weight||"-"}kg × ${s.reps||"-"}回`
     ).join(" / ")}

    </div>

    `;

   }

   html+=`

   <label>種目名</label>

   <input
    value="${esc(e.name)}"
    oninput="
     updateExercise(
      '${e.id}',
      'name',
      this.value
     )
    "
   >

   `;

   e.sets.forEach((s,i)=>{

    html+=renderSet(e,s,i);

   });


   if(e.type==="normal"){

    html+=`

    <button
     class="btn dark full"
     style="margin-top:9px"
     onclick="
      addSet('${e.id}')
     ">
     ＋ セット
    </button>

    `;

   }


   if(e.type==="drop"){

    html+=`

    <button
     class="btn dark full"
     style="margin-top:9px"
     onclick="
      addDropSet('${e.id}')
     ">
     ＋ ドロップ追加
    </button>

    `;

   }

  }


  if(
   e.type==="superset" ||
   e.type==="giant"
  ){

   html+=`

   <div class="sub">
    種目を自由に追加・削除できます
   </div>

   `;

   e.group.forEach(g=>{

    html+=renderGroupExercise(e,g);

   });


   html+=`

   <button
    class="btn dark full"
    style="margin-top:9px"
    onclick="
     addGroupExercise('${e.id}')
    ">
    ＋ 種目追加
   </button>

   `;

  }


  html+=`

  </div>

  `;

  root.insertAdjacentHTML(
   "beforeend",
   html
  );

 });

}


/* =========================
   保存
========================= */

function finishWorkout(){

 if(!draft.length){

  alert("種目を追加してください");

  return;

 }


 const workout={
  id:uid(),
  date:new Date().toISOString(),
  exercises:
   JSON.parse(JSON.stringify(draft))
 };

 db.history.unshift(workout);

 draft=[];

 save();

 render();

 renderHistory();

 alert("トレーニングを保存しました！");

}


/* =========================
   前回コピー
========================= */

function copyLastWorkout(){

 if(!db.history.length){

  alert("まだ前回の記録がありません");

  return;

 }

 const last=db.history[0];

 draft=
 JSON.parse(
  JSON.stringify(last.exercises)
 );

 draft.forEach(e=>{

  e.id=uid();

  if(e.sets){

   e.sets.forEach(s=>{
    s.id=uid();

    s.weight="";
    s.reps="";
    s.note="";
   });

  }

  if(e.group){

   e.group.forEach(g=>{

    g.id=uid();

    g.sets.forEach(s=>{

     s.id=uid();
     s.weight="";
     s.reps="";
     s.note="";

    });

   });

   syncGroupSets(e);

  }

 });

 save();

 render();

 alert("前回メニューをコピーしました！");

}


/* =========================
   履歴
========================= */

function historySetHTML(s,i){

 return`

 <div class="history-set">

  <span>
   SET${i+1}
  </span>

  <b>
   ${s.weight ? s.weight+"kg" : "-"}
   ×
   ${s.reps ? s.reps+"回" : "-"}
  </b>

 </div>

 `;

}


function historyExerciseHTML(e){

 if(
  e.type==="superset" ||
  e.type==="giant"
 ){

  return`

  <div class="history-exercise">

   <div class="row between">

    <b>${esc(e.name||"セット")}</b>

    <span class="badge">
     ${methodName(e.type)}
    </span>

   </div>

   ${e.group.map(g=>`

    <div style="margin-top:10px">

     <div class="small">
      ${esc(g.name||"種目名")}
     </div>

     ${g.sets.map((s,i)=>
      historySetHTML(s,i)
     ).join("")}

    </div>

   `).join("")}

  </div>

  `;

 }


 return`

 <div class="history-exercise">

  <div class="row between">

   <b>${esc(e.name||"名称未設定")}</b>

   <span class="badge">
    ${methodName(e.type)}
   </span>

  </div>

  ${e.sets.map((s,i)=>
   historySetHTML(s,i)
  ).join("")}

 </div>

 `;

}


function renderHistory(){

 const root=
 document.getElementById("historyList");

 if(!db.history.length){

  root.innerHTML=
  '<div class="empty">まだ記録がありません</div>';

  renderPR();

  return;

 }


 root.innerHTML=
 db.history.map(w=>{

  const date=
  new Date(w.date).toLocaleDateString(
   "ja-JP",
   {
    year:"numeric",
    month:"short",
    day:"numeric"
   }
  );

  return`

  <div class="history-item">

   <b>${date}</b>

   ${w.exercises.map(e=>
    historyExerciseHTML(e)
   ).join("")}

  </div>

  `;

 }).join("");

 renderPR();

}


/* =========================
   PR
========================= */

function renderPR(){

 const root=
 document.getElementById("prList");

 const prs={};

 db.history.forEach(w=>{

  w.exercises.forEach(e=>{

   if(
    e.type==="superset" ||
    e.type==="giant"
   ){

    (e.group||[]).forEach(g=>{

     if(!g.name)return;

     g.sets.forEach(s=>{

      const weight=
       Number(s.weight)||0;

      if(
       !prs[g.name] ||
       weight>prs[g.name]
      ){

       prs[g.name]=weight;

      }

     });

    });

   }else{

    if(!e.name)return;

    e.sets.forEach(s=>{

     const weight=
      Number(s.weight)||0;

     if(
      !prs[e.name] ||
      weight>prs[e.name]
     ){

      prs[e.name]=weight;

     }

    });

   }

  });

 });


 const names=
 Object.keys(prs);

 if(!names.length){

  root.innerHTML=
  '<div class="empty">まだPRがありません</div>';

  return;

 }


 root.innerHTML=
 names.map(name=>`

  <div class="pr">

   <span>${esc(name)}</span>

   <b>${prs[name]} kg</b>

  </div>

 `).join("");

}


/* =========================
   ページ切替
========================= */

function showPage(name,button){

 [
  "workout",
  "history",
  "settings"
 ].forEach(x=>{

  document
   .getElementById(x+"Page")
   .classList.toggle(
    "hidden",
    x!==name
   );

 });

 document
  .querySelectorAll(".bottom button")
  .forEach(b=>
   b.classList.remove("active")
  );

 button.classList.add("active");

 if(name==="history"){
  renderHistory();
 }

 if(name==="settings"){
  renderExerciseManager();
 }

}


/* =========================
   タイマー
========================= */

let timerInterval=null;
let timerEnd=0;


function startTimer(seconds){

 stopTimer();

 timerEnd=
  Date.now()+seconds*1000;

 document
  .getElementById("timer")
  .classList.remove("hidden");

 updateTimer();

 timerInterval=
  setInterval(
   updateTimer,
   250
  );

}


function updateTimer(){

 const remaining=
  Math.max(
   0,
   timerEnd-Date.now()
  );

 const sec=
  Math.ceil(
   remaining/1000
  );

 const m=
  String(
   Math.floor(sec/60)
  ).padStart(2,"0");

 const s=
  String(
   sec%60
  ).padStart(2,"0");

 document
  .getElementById("timerText")
  .textContent=
  `${m}:${s}`;

 if(remaining<=0){

  clearInterval(
   timerInterval
  );

  if(navigator.vibrate){

   navigator.vibrate(
    [200,100,200]
   );

  }

 }

}


function stopTimer(){

 clearInterval(
  timerInterval
 );

 document
  .getElementById("timer")
  .classList.add("hidden");

}


/* =========================
   バックアップ
========================= */

function backup(){

 const blob=
 new Blob(
  [JSON.stringify(db,null,2)],
  {
   type:"application/json"
  }
 );

 const url=
 URL.createObjectURL(blob);

 const a=
 document.createElement("a");

 a.href=url;

 a.download=
 "workout-log-backup-"+
 new Date()
  .toISOString()
  .slice(0,10)+
 ".json";

 a.click();

 URL.revokeObjectURL(url);

}


/* =========================
   復元
========================= */

function restore(event){

 const file=
 event.target.files[0];

 if(!file)return;

 const reader=
 new FileReader();

 reader.onload=()=>{

  try{

   const imported=
    JSON.parse(
     reader.result
    );

   if(
    !imported.history ||
    !Array.isArray(
     imported.history
    )
   ){

    throw new Error();

   }

   db=imported;

   draft=
    db.draft||[];

   exerciseLibrary=
    db.exerciseLibrary||[];

   save();

   render();

   renderHistory();

   alert(
    "バックアップを復元しました！"
   );

  }catch{

   alert(
    "バックアップファイルを読み込めませんでした。"
   );

  }

 };

 reader.readAsText(file);

}


/* =========================
   全削除
========================= */

function clearAll(){

 if(
  confirm(
   "すべてのトレーニングデータを削除しますか？"
  )
 ){

  db={
   history:[],
   draft:[],
   exerciseLibrary:[]
  };

  draft=[];

  exerciseLibrary=[];

  save();

  render();

  renderHistory();

  renderExerciseManager();

 }

}


/* =========================
   初期化
========================= */

render();

renderHistory();

renderExerciseManager();
