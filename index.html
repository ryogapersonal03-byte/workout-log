<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#090909">

<title>WORKOUT LOG</title>

<style>

*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:#090909;
 color:#fff;
 font-family:
 -apple-system,
 BlinkMacSystemFont,
 "Helvetica Neue",
 "Noto Sans JP",
 sans-serif;
}

button,
input,
select,
textarea{
 font:inherit;
}

button{
 cursor:pointer;
 border:0;
}

.app{
 max-width:680px;
 margin:auto;
 padding-bottom:90px;
}

header{
 position:sticky;
 top:0;
 z-index:20;
 background:#090909ee;
 backdrop-filter:blur(12px);
 border-bottom:1px solid #252525;
 padding:16px;
}

.logo{
 font-size:20px;
 font-weight:900;
 letter-spacing:1.5px;
}

.date{
 color:#888;
 font-size:12px;
 margin-top:3px;
}

main{
 padding:14px;
}

.card{
 background:#151515;
 border:1px solid #252525;
 border-radius:18px;
 padding:15px;
 margin-bottom:12px;
}

.row{
 display:flex;
 gap:8px;
 align-items:center;
}

.between{
 justify-content:space-between;
}

.title{
 font-weight:900;
 font-size:17px;
}

.sub{
 color:#888;
 font-size:12px;
 margin-top:3px;
}

.btn{
 background:#fff;
 color:#000;
 padding:11px 14px;
 border-radius:12px;
 font-weight:800;
}

.btn.dark{
 background:#242424;
 color:#fff;
}

.btn.red{
 background:#321616;
 color:#ff7777;
}

.btn.green{
 background:#18351f;
 color:#7cff98;
}

.btn.full{
 width:100%;
}

input,
select,
textarea{
 width:100%;
 border:1px solid #303030;
 background:#0e0e0e;
 color:#fff;
 border-radius:11px;
 padding:11px;
 outline:none;
}

input:focus,
select:focus{
 border-color:#777;
}

label{
 display:block;
 font-size:11px;
 color:#888;
 margin:10px 0 5px;
}

.badge{
 display:inline-block;
 padding:4px 8px;
 border-radius:99px;
 background:#292929;
 color:#aaa;
 font-size:10px;
 margin-left:4px;
}

.set{
 background:#101010;
 border:1px solid #242424;
 border-radius:13px;
 padding:9px;
 margin-top:7px;
}

.setgrid{
 display:grid;
 grid-template-columns:40px 1fr 1fr 38px;
 gap:6px;
 align-items:center;
}

.setnum{
 color:#777;
 text-align:center;
 font-size:12px;
}

.options{
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 margin-top:8px;
}

.toggle{
 background:#222;
 color:#aaa;
 padding:7px 9px;
 border-radius:9px;
 font-size:11px;
}

.toggle.active{
 background:#fff;
 color:#000;
}

.prev{
 background:#191919;
 border-radius:10px;
 padding:9px;
 margin-top:8px;
 font-size:11px;
 color:#aaa;
 line-height:1.6;
}

.exercise-actions{
 display:flex;
 gap:6px;
 margin-top:9px;
}

.exercise-actions button{
 flex:1;
}

.empty{
 text-align:center;
 color:#666;
 padding:35px 10px;
}

.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 z-index:30;
 background:#111e;
 backdrop-filter:blur(15px);
 border-top:1px solid #292929;
}

.bottom-inner{
 max-width:680px;
 margin:auto;
 display:flex;
}

.bottom button{
 flex:1;
 padding:14px 4px;
 background:transparent;
 color:#777;
 font-size:11px;
}

.bottom button.active{
 color:#fff;
}

.hidden{
 display:none!important;
}

.history-item{
 padding:13px 0;
 border-bottom:1px solid #292929;
}

.history-item:last-child{
 border:0;
}

.history-exercise{
 margin-top:9px;
 padding:9px;
 background:#101010;
 border-radius:10px;
}

.history-set{
 font-size:12px;
 color:#aaa;
 margin-top:4px;
}

.pr{
 display:flex;
 justify-content:space-between;
 padding:10px 0;
 border-bottom:1px solid #292929;
}

.timer{
 position:fixed;
 right:14px;
 bottom:72px;
 z-index:40;
 background:#fff;
 color:#000;
 border-radius:15px;
 padding:12px 15px;
 font-weight:900;
 box-shadow:0 5px 30px #000;
}

.timer button{
 background:#000;
 color:#fff;
 border-radius:8px;
 padding:6px 9px;
 margin-left:6px;
}

h2{
 font-size:14px;
 margin:0 0 10px;
}

.section-title{
 font-size:13px;
 font-weight:900;
 margin-bottom:8px;
 color:#aaa;
}

.method-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}

.method-btn{
 background:#202020;
 color:#aaa;
 padding:14px 8px;
 border-radius:12px;
 text-align:center;
 font-weight:800;
 border:1px solid #303030;
}

.method-btn.active{
 background:#fff;
 color:#000;
 border-color:#fff;
}

.part-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:7px;
}

.part-btn{
 background:#202020;
 color:#aaa;
 padding:12px 8px;
 border-radius:10px;
 text-align:center;
 border:1px solid #303030;
}

.part-btn.active{
 background:#fff;
 color:#000;
 border-color:#fff;
}

.exercise-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:7px;
}

.exercise-btn{
 background:#202020;
 color:#fff;
 padding:12px 8px;
 border-radius:10px;
 text-align:left;
 border:1px solid #303030;
}

.exercise-btn:hover{
 border-color:#777;
}

.count-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}

.count-btn{
 background:#202020;
 color:#aaa;
 padding:13px;
 border-radius:11px;
 border:1px solid #303030;
 text-align:center;
}

.count-btn.active{
 background:#fff;
 color:#000;
 border-color:#fff;
}

.small{
 font-size:11px;
 color:#777;
}

.selection-info{
 margin-top:10px;
 padding:10px;
 background:#101010;
 border:1px solid #292929;
 border-radius:10px;
 color:#aaa;
 font-size:11px;
 line-height:1.7;
}

.selection-info strong{
 color:#fff;
}

.group-box{
 margin-top:12px;
 padding:10px;
 background:#0d0d0d;
 border:1px solid #292929;
 border-radius:12px;
}

.group-title{
 font-size:11px;
 font-weight:900;
 color:#aaa;
 margin-bottom:7px;
}

.group-exercise{
 font-size:13px;
 font-weight:800;
 padding:5px 0;
}

</style>
</head>

<body>

<div class="app">

<header>

<div class="logo">
WORKOUT LOG
</div>

<div class="date" id="date"></div>

</header>


<main>


<!-- ========================= -->
<!-- WORKOUT -->
<!-- ========================= -->

<section id="workoutPage">


<div class="card">

<div class="row between">

<div>

<div class="title">
TODAY'S WORKOUT
</div>

<div class="sub">
セット法・部位・種目を選択して記録
</div>

</div>

<button
class="btn green"
onclick="finishWorkout()">

保存

</button>

</div>

</div>


<div id="exerciseList"></div>


<!-- 種目追加 -->

<div class="card">

<h2>
新しい種目を追加
</h2>


<div class="section-title">
1. セット法
</div>


<div class="method-grid">


<button
class="method-btn active"
id="method-normal"
onclick="selectMethod('normal')">

通常セット

</button>


<button
class="method-btn"
id="method-drop"
onclick="selectMethod('drop')">

ドロップセット

</button>


<button
class="method-btn"
id="method-superset"
onclick="selectMethod('superset')">

スーパーセット

</button>


<button
class="method-btn"
id="method-giant"
onclick="selectMethod('giant')">

ジャイアントセット

</button>


</div>


<div style="margin-top:16px">

<div class="section-title">
2. 部位
</div>


<div
class="part-grid"
id="partGrid">
</div>

</div>


<div style="margin-top:16px">

<div class="section-title">
3. 種目
</div>


<div
class="exercise-grid"
id="exerciseGrid">
</div>


<div
id="selectionInfo"
class="selection-info">

<strong>種目を選択してください</strong>

</div>

</div>


<div
id="setCountArea"
style="margin-top:16px">

<div class="section-title">
セット数
</div>


<div class="count-grid">

<button
class="count-btn"
onclick="setNormalCount(3)"
id="count3">

3セット

</button>


<button
class="count-btn"
onclick="setNormalCount(4)"
id="count4">

4セット

</button>

</div>

</div>


<button
class="btn full"
style="margin-top:14px"
onclick="addSelectedExercise()">

＋ この内容で追加

</button>


</div>


<div class="card">

<button
class="btn dark full"
onclick="copyLastWorkout()">

前回メニューをコピー

</button>

</div>


</section>


<!-- ========================= -->
<!-- HISTORY -->
<!-- ========================= -->

<section
id="historyPage"
class="hidden">


<div class="card">

<h2>
トレーニング履歴
</h2>

<div id="historyList"></div>

</div>


<div class="card">

<h2>
種目別PR
</h2>

<div id="prList"></div>

</div>


</section>


<!-- ========================= -->
<!-- SETTINGS -->
<!-- ========================= -->

<section
id="settingsPage"
class="hidden">


<div class="card">

<h2>
データ管理
</h2>


<button
class="btn full"
onclick="backup()">

バックアップ

</button>


<label>
バックアップを復元
</label>


<input
type="file"
accept=".json"
onchange="restore(event)"
>


<button
class="btn red full"
style="margin-top:12px"
onclick="clearAll()">

全データ削除

</button>


</div>

</section>


</main>


<!-- TIMER -->

<div
id="timer"
class="timer hidden">

<span id="timerText">
00:00
</span>

<button onclick="stopTimer()">
停止
</button>

</div>


<!-- NAV -->

<nav class="bottom">

<div class="bottom-inner">


<button
class="active"
onclick="showPage('workout',this)">

記録

</button>


<button
onclick="showPage('history',this)">

履歴

</button>


<button
onclick="showPage('settings',this)">

設定

</button>


</div>

</nav>


</div>


<script>


/* =========================
   DATABASE
========================= */


const KEY="WORKOUT_LOG_V4";


let db=JSON.parse(
 localStorage.getItem(KEY) ||
 '{"history":[],"draft":[]}'
);


let draft=db.draft || [];


const uid=()=>{

 return Date.now().toString(36)+
 Math.random().toString(36).substring(2);

};


const esc=s=>String(s??"").replace(
 /[&<>"']/g,
 m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[m])
);


/* =========================
   DATE
========================= */


document.getElementById("date").textContent=
new Date().toLocaleDateString(
 "ja-JP",
 {
  year:"numeric",
  month:"long",
  day:"numeric",
  weekday:"short"
 }
);


/* =========================
   EXERCISE MASTER
========================= */


const exercises={

 "胸":[
  "ベンチプレス",
  "インクラインベンチプレス",
  "ダンベルベンチプレス",
  "インクラインダンベルプレス",
  "チェストプレス",
  "ペックフライ",
  "ケーブルフライ"
 ],

 "背中":[
  "ラットプルダウン",
  "ワイドプルダウン",
  "懸垂",
  "シーテッドロー",
  "レバーロー",
  "ワンハンドロー",
  "ベントオーバーロー",
  "ストレートアームプルダウン"
 ],

 "肩":[
  "ショルダープレス",
  "ダンベルショルダープレス",
  "サイドレイズ",
  "デルトイドレイズ",
  "リアレイズ",
  "リアデルトフライ",
  "アップライトロー"
 ],

 "脚":[
  "スクワット",
  "ハックスクワット",
  "レッグプレス",
  "ブルガリアンスクワット",
  "レッグエクステンション",
  "レッグカール",
  "ルーマニアンデッドリフト",
  "ヒップスラスト",
  "アブダクション",
  "アダクション"
 ],

 "腕":[
  "バーベルカール",
  "ダンベルカール",
  "インクラインダンベルカール",
  "ハンマーカール",
  "EZバーカール",
  "プレスダウン",
  "ライイングエクステンション",
  "フレンチプレス",
  "ナローベンチプレス"
 ],

 "腹":[
  "アブドミナルクランチ",
  "ケーブルクランチ",
  "レッグレイズ",
  "ハンギングレッグレイズ",
  "プランク",
  "アブローラー"
 ],

 "お尻":[
  "ヒップスラスト",
  "ブルガリアンスクワット",
  "ルーマニアンデッドリフト",
  "キックバック",
  "ヒップアブダクション",
  "グルートマシン"
 ]

};


const parts=Object.keys(exercises);


/* =========================
   ADD UI STATE
========================= */


let selectedMethod="normal";


let selectedPart=
 localStorage.getItem("WORKOUT_LAST_PART") ||
 parts[0];


/*
 * 複数種目を保持
 *
 * 通常セット・ドロップセット
 * → 1種目
 *
 * スーパーセット
 * → 2種目
 *
 * ジャイアントセット
 * → 3〜5種目
 */

let selectedExercises=[];


let normalCount=3;


/* =========================
   SAVE
========================= */


function save(){

 db.draft=draft;

 localStorage.setItem(
  KEY,
  JSON.stringify(db)
 );

}


/* =========================
   PREVIOUS
========================= */


function previous(name){

 if(!name)return null;

 for(const workout of db.history){

  for(const ex of workout.exercises || []){

   if(ex.name===name){

    return ex;

   }

  }

 }

 return null;

}


/* =========================
   METHOD SELECT
========================= */


function selectMethod(method){

 selectedMethod=method;

 selectedExercises=[];


 document
 .querySelectorAll(".method-btn")
 .forEach(b=>
  b.classList.remove("active")
 );


 document
 .getElementById("method-"+method)
 .classList.add("active");


 const area=
 document.getElementById("setCountArea");


 if(method==="normal"){

  area.classList.remove("hidden");

 }else{

  area.classList.add("hidden");

 }


 renderExercises();

}


/* =========================
   PART UI
========================= */


function renderParts(){

 const root=
 document.getElementById("partGrid");


 root.innerHTML=
 parts.map(part=>`

 <button
 class="part-btn ${
  selectedPart===part?"active":""
 }"
 onclick="selectPart('${esc(part)}')">

 ${esc(part)}

 </button>

 `).join("");

}


function selectPart(part){

 selectedPart=part;

 selectedExercises=[];

 localStorage.setItem(
  "WORKOUT_LAST_PART",
  part
 );

 renderParts();
 renderExercises();

}


/* =========================
   EXERCISE UI
========================= */


function renderExercises(){

 const root=
 document.getElementById("exerciseGrid");


 const info=
 document.getElementById("selectionInfo");


 const list=
 exercises[selectedPart] || [];


 root.innerHTML=
 list.map(name=>{

  const selected=
   selectedExercises.includes(name);


  const number=
   selectedExercises.indexOf(name);


  return `

  <button
  class="exercise-btn"
  style="
   border-color:
   ${selected ? "#fff" : "#303030"};

   background:
   ${selected ? "#fff" : "#202020"};

   color:
   ${selected ? "#000" : "#fff"};
  "
  onclick="selectExercise('${esc(name)}')">


  ${
   selected

   ?

   `<span style="
    display:inline-block;
    width:20px;
    height:20px;
    line-height:20px;
    text-align:center;
    border-radius:50%;
    background:#000;
    color:#fff;
    margin-right:5px;
    font-size:11px;
   ">${number+1}</span>`

   :

   ""
  }


  ${esc(name)}


  </button>

  `;

 }).join("");


 /* 選択状況 */

 if(!selectedExercises.length){

  info.innerHTML=
  "<strong>種目を選択してください</strong>";

  return;

 }


 let limitText="";


 if(selectedMethod==="normal"){

  limitText="通常セット：1種目";

 }else if(selectedMethod==="drop"){

  limitText="ドロップセット：1種目";

 }else if(selectedMethod==="superset"){

  limitText="スーパーセット：2種目";

 }else if(selectedMethod==="giant"){

  limitText="ジャイアントセット：3〜5種目";

 }


 info.innerHTML=`

 <strong>
 選択中：${selectedExercises.length}種目
 </strong>

 <br>

 ${selectedExercises
  .map(
   (name,i)=>
   `${i+1}. ${esc(name)}`
  )
  .join("<br>")}

 <br>

 <span class="small">
 ${limitText}
 </span>

 `;

}


function selectExercise(name){

 /*
  * 通常セット・ドロップセット
  * は1種目だけ
  */

 if(
  selectedMethod==="normal" ||
  selectedMethod==="drop"
 ){

  selectedExercises=[name];

  renderExercises();

  return;

 }


 /*
  * スーパーセット
  */

 if(
  selectedMethod==="superset"
 ){

  const index=
   selectedExercises.indexOf(name);


  if(index>=0){

   selectedExercises.splice(
    index,
    1
   );

  }else{

   if(selectedExercises.length>=2){

    alert(
     "スーパーセットは2種目まで選択できます"
    );

    return;

   }

   selectedExercises.push(name);

  }

  renderExercises();

  return;

 }


 /*
  * ジャイアントセット
  */

 if(
  selectedMethod==="giant"
 ){

  const index=
   selectedExercises.indexOf(name);


  if(index>=0){

   selectedExercises.splice(
    index,
    1
   );

  }else{

   if(selectedExercises.length>=5){

    alert(
     "ジャイアントセットは5種目まで選択できます"
    );

    return;

   }

   selectedExercises.push(name);

  }

  renderExercises();

 }

}


/* =========================
   SET COUNT
========================= */


function setNormalCount(count){

 normalCount=count;

 document
 .querySelectorAll(".count-btn")
 .forEach(b=>
  b.classList.remove("active")
 );


 document
 .getElementById(
  "count"+count
 )
 .classList.add("active");

}


/* =========================
   CREATE SET
========================= */


function newSet(){

 return{

  id:uid(),

  weight:"",

  reps:"",

  assist:false,

  restPause:false,

  restSeconds:"",

  cheating:false,

  note:""

 };

}


/* =========================
   ADD SELECTED
========================= */


function addSelectedExercise(){

 /*
  * 種目未選択
  */

 if(!selectedExercises.length){

  alert(
   "種目を選択してください"
  );

  return;

 }


 /*
  * 通常セット
  */

 if(
  selectedMethod==="normal" &&
  selectedExercises.length!==1
 ){

  alert(
   "通常セットは1種目を選択してください"
  );

  return;

 }


 /*
  * ドロップセット
  */

 if(
  selectedMethod==="drop" &&
  selectedExercises.length!==1
 ){

  alert(
   "ドロップセットは1種目を選択してください"
  );

  return;

 }


 /*
  * スーパーセット
  */

 if(
  selectedMethod==="superset" &&
  selectedExercises.length!==2
 ){

  alert(
   "スーパーセットは2種目を選択してください"
  );

  return;

 }


 /*
  * ジャイアントセット
  */

 if(
  selectedMethod==="giant" &&
  (
   selectedExercises.length<3 ||
   selectedExercises.length>5
  )
 ){

  alert(
   "ジャイアントセットは3〜5種目を選択してください"
  );

  return;

 }


 /*
  * 選択した種目を追加
  *
  * スーパーセット・ジャイアントセットは
  * 同じセット法として記録
  */

 selectedExercises.forEach(
 name=>{

  const ex={

   id:uid(),

   type:selectedMethod,

   part:selectedPart,

   name:name,

   sets:[]

  };


  /*
   * セット数
   *
   * 通常セット
   * → 3 or 4セット
   *
   * その他
   * → 3セット
   */

  const count=
   selectedMethod==="normal"
   ? normalCount
   : 3;


  for(
   let i=0;
   i<count;
   i++
  ){

   ex.sets.push(
    newSet()
   );

  }


  draft.push(ex);

 });


 /*
  * 選択解除
  */

 selectedExercises=[];


 save();

 render();

 renderExercises();

}


/* =========================
   DELETE EXERCISE
========================= */


function deleteExercise(id){

 draft=
 draft.filter(
  e=>e.id!==id
 );

 save();

 render();

}


/* =========================
   ADD SET
========================= */


function addSet(eid){

 const e=
 draft.find(
  x=>x.id===eid
 );

 if(!e)return;


 e.sets.push(
  newSet()
 );


 save();

 render();

}


/* =========================
   DELETE SET
========================= */


function deleteSet(eid,sid){

 const e=
 draft.find(
  x=>x.id===eid
 );

 if(!e)return;


 if(e.sets.length<=1){

  alert(
   "最低1セットは残してください"
  );

  return;

 }


 e.sets=
 e.sets.filter(
  s=>s.id!==sid
 );


 save();

 render();

}


/* =========================
   UPDATE
========================= */


function updateExercise(
 id,
 key,
 value
){

 const e=
 draft.find(
  x=>x.id===id
 );

 if(!e)return;


 e[key]=value;


 save();

}


function updateSet(
 eid,
 sid,
 key,
 value
){

 const e=
 draft.find(
  x=>x.id===eid
 );

 if(!e)return;


 const s=
 e.sets.find(
  x=>x.id===sid
 );

 if(!s)return;


 s[key]=value;


 save();

}


/* =========================
   TOGGLE
========================= */


function toggleSet(
 eid,
 sid,
 key
){

 const e=
 draft.find(
  x=>x.id===eid
 );

 if(!e)return;


 const s=
 e.sets.find(
  x=>x.id===sid
 );

 if(!s)return;


 s[key]=!s[key];


 save();

 render();

}


/* =========================
   RENDER WORKOUT
========================= */


function render(){

 const root=
 document.getElementById(
  "exerciseList"
 );


 root.innerHTML="";


 if(!draft.length){

  root.innerHTML=`

  <div class="card empty">

  種目を追加してトレーニング開始

  </div>

  `;

  return;

 }


 /*
  * スーパーセット・ジャイアントセットを
  * 同じグループとして表示するための
  * グループIDを確認
  *
  * 旧データにも対応
  */

 const groups=[];

 const processed=
  new Set();


 draft.forEach(
 (e,index)=>{

  if(processed.has(e.id))return;


  if(
   e.type==="superset" ||
   e.type==="giant"
  ){

   const group=
    draft.filter(
     x=>
      x.type===e.type &&
      x.groupId===e.groupId &&
      e.groupId
    );


   if(
    group.length>1
   ){

    group.forEach(
     x=>processed.add(x.id)
    );


    groups.push({
     type:e.type,
     exercises:group
    });


    return;

   }

  }


  processed.add(e.id);


  groups.push({
   type:e.type,
   exercises:[e]
  });

 });


 groups.forEach(
 (group,index)=>{

  const typeName={

   normal:"通常",

   drop:"ドロップ",

   superset:"スーパー",

   giant:"ジャイアント"

  }[group.type];


  /*
   * グループ表示
   */

  if(
   group.type==="superset" ||
   group.type==="giant"
  ){

   let html=`

   <div class="card">

   <div class="row between">

   <div class="title">

   ${index+1}.
   ${typeName}セット

   <span class="badge">

   ${group.exercises.length}種目

   </span>

   </div>


   <button
   class="btn red"
   onclick="
   deleteGroup(
    ${JSON.stringify(
     group.exercises.map(e=>e.id)
    )}
   )
   ">

   削除

   </button>

   </div>

   `;


   group.exercises.forEach(
   (e,exerciseIndex)=>{

    html+=renderExerciseHTML(
     e,
     exerciseIndex,
     true
    );

   });


   html+=`

   </div>

   `;


   root.insertAdjacentHTML(
    "beforeend",
    html
   );


   return;

  }


  /*
   * 通常・ドロップ
   */

  const e=
   group.exercises[0];


  root.insertAdjacentHTML(
   "beforeend",
   renderExerciseHTML(
    e,
    index,
    false
   )
  );

 });

}


/* =========================
   RENDER EXERCISE HTML
========================= */


function renderExerciseHTML(
 e,
 index,
 insideGroup
){

 const typeName={

  normal:"通常",

  drop:"ドロップ",

  superset:"スーパー",

  giant:"ジャイアント"

 }[e.type];


 const prev=
  previous(e.name);


 let html=`

 <div
 class="${
  insideGroup
  ? "group-box"
  : "card"
 }">


 <div class="row between">

 <div class="title">

 ${
  insideGroup
  ? ""
  : (index+1)+". "
 }

 ${esc(e.name)}

 ${
  insideGroup
  ? ""
  : `<span class="badge">
      ${typeName}
     </span>`
 }

 </div>


 ${
  insideGroup
  ?

  ""

  :

  `<button
   class="btn red"
   onclick="deleteExercise('${e.id}')">

   削除

   </button>`

 }


 </div>


 <div class="sub">

 ${esc(e.part || "")}

 </div>

 `;


 /*
  * 前回
  */

 if(prev){

  html+=`

  <div class="prev">

  前回記録：

  ${prev.sets.map(
   (s,i)=>
   `SET${i+1}：
   ${s.weight||"-"}kg ×
   ${s.reps||"-"}回`
  ).join("<br>")}

  </div>

  `;

 }


 /*
  * SET
  */

 e.sets.forEach(
 (s,i)=>{

  html+=`

  <div class="set">


  <div class="setgrid">


  <div class="setnum">

  SET
  <br>
  ${i+1}

  </div>


  <input
  type="number"
  step="0.5"
  placeholder="重量 kg"
  value="${esc(s.weight)}"

  oninput="
  updateSet(
   '${e.id}',
   '${s.id}',
   'weight',
   this.value
  )
  ">


  <input
  type="number"
  placeholder="回数"
  value="${esc(s.reps)}"

  oninput="
  updateSet(
   '${e.id}',
   '${s.id}',
   'reps',
   this.value
  )
  ">


  <button
  class="btn red"
  onclick="
  deleteSet(
   '${e.id}',
   '${s.id}'
  )
  ">

  ×

  </button>


  </div>


  <div class="options">


  <button
  class="toggle
  ${s.assist?'active':''}"
  onclick="
  toggleSet(
   '${e.id}',
   '${s.id}',
   'assist'
  )
  ">

  補助

  </button>


  <button
  class="toggle
  ${s.restPause?'active':''}"
  onclick="
  toggleSet(
   '${e.id}',
   '${s.id}',
   'restPause'
  )
  ">

  レストポーズ

  </button>


  <button
  class="toggle
  ${s.cheating?'active':''}"
  onclick="
  toggleSet(
   '${e.id}',
   '${s.id}',
   'cheating'
  )
  ">

  チーティング

  </button>


  </div>


  `;


  if(s.restPause){

   html+=`

   <div
   class="row"
   style="margin-top:7px">

   <input
   type="number"
   placeholder="休憩秒数"
   value="${esc(s.restSeconds)}"

   oninput="
   updateSet(
    '${e.id}',
    '${s.id}',
    'restSeconds',
    this.value
   )
   ">


   <button
   class="btn"
   onclick="
   startTimer(
    ${Number(s.restSeconds)||15}
   )
   ">

   タイマー

   </button>

   </div>

   `;

  }


  html+=`

  <input
  style="margin-top:7px"
  placeholder="メモ"
  value="${esc(s.note)}"

  oninput="
  updateSet(
   '${e.id}',
   '${s.id}',
   'note',
   this.value
  )
  ">


  </div>

  `;

 });


 html+=`

 <div class="exercise-actions">


 <button
 class="btn dark"
 onclick="
 addSet('${e.id}')
 ">

 ＋ セット

 </button>


 </div>


 </div>

 `;


 return html;

}


/* =========================
   DELETE GROUP
========================= */


function deleteGroup(ids){

 if(
  !confirm(
   "このセット法の種目をすべて削除しますか？"
  )
 ){

  return;

 }


 draft=
 draft.filter(
  e=>!ids.includes(e.id)
 );


 save();

 render();

}


/* =========================
   FINISH
========================= */


function finishWorkout(){

 if(!draft.length){

  alert(
   "種目を追加してください"
  );

  return;

 }


 const workout={

  id:uid(),

  date:
  new Date().toISOString(),

  exercises:
  JSON.parse(
   JSON.stringify(draft)
  )

 };


 db.history.unshift(
  workout
 );


 draft=[];


 save();

 render();

 renderHistory();


 alert(
  "トレーニングを保存しました！"
 );

}


/* =========================
   COPY LAST
========================= */


function copyLastWorkout(){

 if(!db.history.length){

  alert(
   "まだ前回の記録がありません"
  );

  return;

 }


 const last=
 db.history[0];


 draft=
 JSON.parse(
  JSON.stringify(
   last.exercises
  )
 );


 draft.forEach(
 e=>{

  e.id=uid();

  e.sets.forEach(
   s=>{

    s.id=uid();

    s.weight="";

    s.reps="";

   }
  );

 }
 );


 save();

 render();


 alert(
  "前回メニューをコピーしました！"
 );

}


/* =========================
   HISTORY
========================= */


function renderHistory(){

 const root=
 document.getElementById(
  "historyList"
 );


 if(!db.history.length){

  root.innerHTML=`

  <div class="empty">

  まだ記録がありません

  </div>

  `;

  renderPR();

  return;

 }


 root.innerHTML=
 db.history.map(
 w=>{


 const date=
 new Date(w.date)
 .toLocaleDateString(
  "ja-JP",
  {
   year:"numeric",
   month:"short",
   day:"numeric"
  }
 );


 return`

 <div class="history-item">

 <b>
 ${date}
 </b>


 ${w.exercises.map(
 e=>`

 <div class="history-exercise">

 <strong>
 ${esc(e.name)}
 </strong>


 <div class="small">

 ${esc(e.part||"")}

 /

 ${
  e.type==="normal"
  ?"通常":
  e.type==="drop"
  ?"ドロップ":
  e.type==="superset"
  ?"スーパー":
  "ジャイアント"
 }

 </div>


 ${e.sets.map(
  (s,i)=>`

  <div class="history-set">

  SET${i+1}：

  ${s.weight||"-"}kg ×
  ${s.reps||"-"}回

  </div>

 `).join("")}


 </div>

 `
 ).join("")}


 </div>

 `;

 }).join("");


 renderPR();

}


/* =========================
   PR
========================= */


function renderPR(){

 const root=
 document.getElementById(
  "prList"
 );


 const prs={};


 db.history.forEach(
 w=>{

  w.exercises.forEach(
  e=>{

   if(!e.name)return;


   e.sets.forEach(
   s=>{

    const weight=
    Number(s.weight)||0;


    if(
     !prs[e.name] ||
     weight>prs[e.name]
    ){

     prs[e.name]=weight;

    }

   });

  });

 });


 const names=
 Object.keys(prs);


 if(!names.length){

  root.innerHTML=`

  <div class="empty">

  まだPRがありません

  </div>

  `;

  return;

 }


 root.innerHTML=
 names.map(
 name=>`

 <div class="pr">

 <span>
 ${esc(name)}
 </span>

 <b>
 ${prs[name]} kg
 </b>

 </div>

 `
 ).join("");

}


/* =========================
   PAGE
========================= */


function showPage(
 name,
 button
){

 [
  "workout",
  "history",
  "settings"
 ].forEach(
 x=>{

  document
  .getElementById(
   x+"Page"
  )
  .classList.toggle(
   "hidden",
   x!==name
  );

 });


 document
 .querySelectorAll(
  ".bottom button"
 )
 .forEach(
  b=>
  b.classList.remove(
   "active"
  )
 );


 button.classList.add(
  "active"
 );


 if(name==="history"){

  renderHistory();

 }

}


/* =========================
   TIMER
========================= */


let timerInterval=null;

let timerEnd=0;


function startTimer(
 seconds
){

 stopTimer();


 timerEnd=
 Date.now()+
 seconds*1000;


 document
 .getElementById(
  "timer"
 )
 .classList.remove(
  "hidden"
 );


 updateTimer();


 timerInterval=
 setInterval(
  updateTimer,
  250
 );

}


function updateTimer(){

 const remaining=
 Math.max(
  0,
  timerEnd-Date.now()
 );


 const sec=
 Math.ceil(
  remaining/1000
 );


 const m=
 String(
  Math.floor(sec/60)
 ).padStart(2,"0");


 const s=
 String(
  sec%60
 ).padStart(2,"0");


 document
 .getElementById(
  "timerText"
 )
 .textContent=
 `${m}:${s}`;


 if(remaining<=0){

  clearInterval(
   timerInterval
  );


  if(navigator.vibrate){

   navigator.vibrate(
    [200,100,200]
   );

  }

 }

}


function stopTimer(){

 clearInterval(
  timerInterval
 );


 document
 .getElementById(
  "timer"
 )
 .classList.add(
  "hidden"
 );

}


/* =========================
   BACKUP
========================= */


function backup(){

 const blob=
 new Blob(
  [
   JSON.stringify(
    db,
    null,
    2
   )
  ],
  {
   type:"application/json"
  }
 );


 const url=
 URL.createObjectURL(
  blob
 );


 const a=
 document.createElement(
  "a"
 );


 a.href=url;


 a.download=
 "workout-log-backup-"+
 new Date()
 .toISOString()
 .slice(0,10)+
 ".json";


 a.click();


 URL.revokeObjectURL(
  url
 );

}


/* =========================
   RESTORE
========================= */


function restore(event){

 const file=
 event.target.files[0];


 if(!file)return;


 const reader=
 new FileReader();


 reader.onload=()=>{

  try{

   const imported=
   JSON.parse(
    reader.result
   );


   if(
    !imported.history ||
    !Array.isArray(
     imported.history
    )
   ){

    throw new Error();

   }


   db=imported;

   draft=
   db.draft||[];


   save();

   render();

   renderHistory();


   alert(
    "バックアップを復元しました！"
   );


  }catch{

   alert(
    "バックアップファイルを読み込めませんでした。"
   );

  }

 };


 reader.readAsText(file);

}


/* =========================
   CLEAR
========================= */


function clearAll(){

 if(
  confirm(
   "すべてのトレーニングデータを削除しますか？"
  )
 ){

  db={
   history:[],
   draft:[]
  };


  draft=[];


  save();

  render();

  renderHistory();

 }

}


/* =========================
   INITIALIZE
========================= */


renderParts();

renderExercises();

setNormalCount(3);

render();

renderHistory();


</script>
