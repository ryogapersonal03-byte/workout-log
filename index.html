<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>WORKOUT LOG</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#090909;
 color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif;
}

button,input,select,textarea{font:inherit}
button{border:0;cursor:pointer}

.app{
 max-width:680px;
 margin:auto;
 padding-bottom:100px;
}

header{
 position:sticky;
 top:0;
 z-index:20;
 background:#090909ee;
 backdrop-filter:blur(12px);
 border-bottom:1px solid #252525;
 padding:16px;
}

.logo{
 font-size:20px;
 font-weight:900;
 letter-spacing:1.5px;
}

.date{
 color:#888;
 font-size:12px;
 margin-top:3px;
}

main{padding:14px}

.card{
 background:#151515;
 border:1px solid #252525;
 border-radius:18px;
 padding:15px;
 margin-bottom:12px;
}

.row{
 display:flex;
 gap:8px;
 align-items:center;
}

.between{justify-content:space-between}

.title{
 font-size:17px;
 font-weight:900;
}

.sub{
 color:#888;
 font-size:12px;
 margin-top:4px;
}

h2{
 font-size:14px;
 margin:0 0 12px;
}

.btn{
 background:#fff;
 color:#000;
 padding:11px 14px;
 border-radius:12px;
 font-weight:800;
}

.btn.dark{
 background:#242424;
 color:#fff;
}

.btn.red{
 background:#321616;
 color:#ff7777;
}

.btn.green{
 background:#18351f;
 color:#7cff98;
}

.btn.full{width:100%}

input,select,textarea{
 width:100%;
 border:1px solid #303030;
 background:#0e0e0e;
 color:#fff;
 border-radius:11px;
 padding:11px;
 outline:none;
}

input:focus,select:focus,textarea:focus{
 border-color:#777;
}

label{
 display:block;
 color:#888;
 font-size:11px;
 margin:10px 0 5px;
}

/* セット法 */
.method-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}

.method-button{
 background:#222;
 color:#aaa;
 border:1px solid #333;
 border-radius:13px;
 padding:15px 8px;
 font-weight:800;
}

.method-button.active{
 background:#fff;
 color:#000;
 border-color:#fff;
}

/* 部位 */
.part-tabs{
 display:flex;
 gap:6px;
 overflow-x:auto;
 padding:2px 0 10px;
 scrollbar-width:none;
}

.part-tabs::-webkit-scrollbar{
 display:none;
}

.part-tab{
 flex:0 0 auto;
 background:#222;
 color:#aaa;
 border:1px solid #333;
 border-radius:10px;
 padding:9px 13px;
 font-size:11px;
 font-weight:800;
}

.part-tab.active{
 background:#fff;
 color:#000;
 border-color:#fff;
}

/* 種目 */
.exercise-list{
 display:flex;
 flex-direction:column;
 gap:7px;
}

.exercise-choice{
 width:100%;
 text-align:left;
 background:#222;
 color:#fff;
 border:1px solid #333;
 border-radius:11px;
 padding:12px;
 font-weight:700;
}

.exercise-choice:active{
 background:#fff;
 color:#000;
}

.section-label{
 color:#888;
 font-size:11px;
 font-weight:900;
 margin:12px 0 7px;
}

/* セット */
.set{
 background:#101010;
 border:1px solid #242424;
 border-radius:13px;
 padding:9px;
 margin-top:8px;
}

.set-grid{
 display:grid;
 grid-template-columns:38px 1fr 1fr 38px;
 gap:6px;
 align-items:center;
}

.set-number{
 text-align:center;
 color:#777;
 font-size:11px;
}

.options{
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 margin-top:8px;
}

.toggle{
 background:#222;
 color:#aaa;
 padding:7px 9px;
 border-radius:9px;
 font-size:11px;
}

.toggle.active{
 background:#fff;
 color:#000;
}

.previous{
 background:#191919;
 border-radius:10px;
 padding:9px;
 margin-top:8px;
 color:#aaa;
 font-size:11px;
 line-height:1.7;
}

/* スーパー・ジャイアント */
.group{
 background:#101010;
 border:1px solid #242424;
 border-radius:13px;
 padding:10px;
 margin-top:10px;
}

.group-title{
 color:#aaa;
 font-size:11px;
 font-weight:900;
 margin-bottom:8px;
}

/* 履歴 */
.history-item{
 padding:14px 0;
 border-bottom:1px solid #292929;
}

.history-item:last-child{
 border-bottom:0;
}

.history-exercise{
 background:#101010;
 border:1px solid #242424;
 border-radius:12px;
 padding:10px;
 margin-top:9px;
}

.history-set{
 display:flex;
 justify-content:space-between;
 padding:7px 0;
 border-bottom:1px solid #222;
 font-size:12px;
}

.history-set:last-child{
 border-bottom:0;
}

.badge{
 display:inline-block;
 background:#292929;
 color:#aaa;
 padding:4px 8px;
 border-radius:99px;
 font-size:10px;
 margin-left:5px;
}

.pr{
 display:flex;
 justify-content:space-between;
 padding:10px 0;
 border-bottom:1px solid #292929;
}

.empty{
 text-align:center;
 color:#666;
 padding:35px 10px;
 line-height:1.8;
}

/* ナビ */
.bottom{
 position:fixed;
 left:0;
 right:0;
 bottom:0;
 z-index:30;
 background:#111e;
 backdrop-filter:blur(15px);
 border-top:1px solid #292929;
}

.bottom-inner{
 max-width:680px;
 margin:auto;
 display:flex;
}

.bottom button{
 flex:1;
 padding:14px 4px;
 background:transparent;
 color:#777;
 font-size:11px;
}

.bottom button.active{
 color:#fff;
}

.hidden{
 display:none!important;
}

/* タイマー */
.timer{
 position:fixed;
 right:14px;
 bottom:75px;
 z-index:50;
 background:#fff;
 color:#000;
 border-radius:15px;
 padding:12px 15px;
 font-weight:900;
 box-shadow:0 5px 30px #000;
}

.timer button{
 background:#000;
 color:#fff;
 border-radius:8px;
 padding:6px 9px;
 margin-left:8px;
}

@media(max-width:420px){

 .set-grid{
  grid-template-columns:32px 1fr 1fr 34px;
 }

 .btn{
  padding:10px;
 }

}
</style>
</head>


<body>

<div class="app">

<header>
 <div class="logo">WORKOUT LOG</div>
 <div class="date" id="date"></div>
</header>

<main>


<!-- =========================
WORKOUT
========================= -->

<section id="workoutPage">

<div class="card">

 <div class="row between">

  <div>
   <div class="title">TODAY'S WORKOUT</div>
   <div class="sub">
    セット法 → 部位 → 種目 → 重量・回数
   </div>
  </div>

  <button
   class="btn green"
   onclick="finishWorkout()">
   保存
  </button>

 </div>

</div>


<div id="exerciseList"></div>


<!-- =========================
追加エリア
========================= -->

<div class="card">

 <h2>① セット法を選択</h2>

 <div class="method-grid">

  <button
   id="method-normal"
   class="method-button"
   onclick="selectMethod('normal')">
   通常セット
  </button>

  <button
   id="method-drop"
   class="method-button"
   onclick="selectMethod('drop')">
   ドロップセット
  </button>

  <button
   id="method-superset"
   class="method-button"
   onclick="selectMethod('superset')">
   スーパーセット
  </button>

  <button
   id="method-giant"
   class="method-button"
   onclick="selectMethod('giant')">
   ジャイアントセット
  </button>

 </div>


 <div id="partArea" class="hidden">

  <h2 style="margin-top:18px">
   ② 部位を選択
  </h2>

  <div class="part-tabs">

   <button class="part-tab"
    onclick="selectPart('胸')">
    胸
   </button>

   <button class="part-tab"
    onclick="selectPart('背中')">
    背中
   </button>

   <button class="part-tab"
    onclick="selectPart('肩')">
    肩
   </button>

   <button class="part-tab"
    onclick="selectPart('腕')">
    腕
   </button>

   <button class="part-tab"
    onclick="selectPart('脚')">
    脚
   </button>

   <button class="part-tab"
    onclick="selectPart('お尻')">
    お尻
   </button>

   <button class="part-tab"
    onclick="selectPart('腹部')">
    腹部
   </button>

   <button class="part-tab"
    onclick="selectPart('その他')">
    その他
   </button>

  </div>


  <div id="exercisePicker"></div>

 </div>

</div>


<div class="card">

 <button
  class="btn dark full"
  onclick="copyLastWorkout()">
  前回メニューをコピー
 </button>

</div>

</section>


<!-- =========================
HISTORY
========================= -->

<section
 id="historyPage"
 class="hidden">

 <div class="card">

  <h2>トレーニング履歴</h2>

  <div id="historyList"></div>

 </div>


 <div class="card">

  <h2>種目別PR</h2>

  <div id="prList"></div>

 </div>

</section>


<!-- =========================
SETTINGS
========================= -->

<section
 id="settingsPage"
 class="hidden">

 <div class="card">

  <h2>種目登録</h2>

  <label>種目名</label>

  <input
   id="newExerciseName"
   placeholder="例：ベンチプレス"
  >

  <label>部位</label>

  <select id="newExercisePart">

   <option value="胸">胸</option>
   <option value="背中">背中</option>
   <option value="肩">肩</option>
   <option value="腕">腕</option>
   <option value="脚">脚</option>
   <option value="お尻">お尻</option>
   <option value="腹部">腹部</option>
   <option value="その他">その他</option>

  </select>

  <button
   class="btn full"
   style="margin-top:10px"
   onclick="registerExercise()">
   種目を登録
  </button>

  <div id="exerciseManager"></div>

 </div>


 <div class="card">

  <h2>データ管理</h2>

  <button
   class="btn full"
   onclick="backup()">
   バックアップ
  </button>

  <label>バックアップを復元</label>

  <input
   type="file"
   accept=".json"
   onchange="restore(event)"
  >

  <button
   class="btn red full"
   style="margin-top:12px"
   onclick="clearAll()">
   全データ削除
  </button>

 </div>

</section>


</main>


<!-- TIMER -->

<div
 id="timer"
 class="timer hidden">

 <span id="timerText">
  00:00
 </span>

 <button onclick="stopTimer()">
  停止
 </button>

</div>


<!-- BOTTOM -->

<nav class="bottom">

 <div class="bottom-inner">

  <button
   class="active"
   onclick="showPage('workout',this)">
   記録
  </button>

  <button
   onclick="showPage('history',this)">
   履歴
  </button>

  <button
   onclick="showPage('settings',this)">
   設定
  </button>

 </div>

</nav>

</div>


<script>

/* ==================================================
DATABASE
================================================== */

const KEY="WORKOUT_LOG_FINAL_2026";

let db;

try{

 db=JSON.parse(
  localStorage.getItem(KEY)
 );

}catch{

 db=null;

}

if(!db){

 db={
  history:[],
  draft:[],
  exercises:[]
 };

}

if(!Array.isArray(db.history))
 db.history=[];

if(!Array.isArray(db.draft))
 db.draft=[];

if(!Array.isArray(db.exercises))
 db.exercises=[];


let draft=db.draft;


/* ==================================================
現在の選択状態
================================================== */

let selectedMethod="";

let selectedPart="";


/* ==================================================
UTILITY
================================================== */

function uid(){

 return Date.now().toString(36)+
 Math.random()
 .toString(36)
 .substring(2);

}


function esc(value){

 return String(value ?? "")
 .replace(
  /[&<>"']/g,
  function(m){

   return {
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
   }[m];

  }
 );

}


function save(){

 db.draft=draft;

 localStorage.setItem(
  KEY,
  JSON.stringify(db)
 );

}


function newSet(){

 return{

  id:uid(),

  weight:"",

  reps:"",

  note:"",

  assist:false,

  restPause:false,

  restSeconds:"",

  cheating:false

 };

}


function methodLabel(type){

 return{

  normal:"通常セット",

  drop:"ドロップセット",

  superset:"スーパーセット",

  giant:"ジャイアントセット"

 }[type] || "";

}


/* ==================================================
DATE
================================================== */

document.getElementById("date").textContent=
new Date().toLocaleDateString(
 "ja-JP",
 {
  year:"numeric",
  month:"long",
  day:"numeric",
  weekday:"short"
 }
);


/* ==================================================
① セット法選択
================================================== */

function selectMethod(type){

 selectedMethod=type;

 /*
 部位を一度だけ初期化。
 同じセット法を押した場合は
 部位を維持する。
 */

 if(!selectedPart){

  selectedPart="胸";

 }

 document
 .querySelectorAll(".method-button")
 .forEach(
  button=>{
   button.classList.remove("active");
  }
 );

 document
 .getElementById(
  "method-"+type
 )
 .classList.add("active");


 document
 .getElementById("partArea")
 .classList.remove("hidden");


 renderPartArea();

}


/* ==================================================
② 部位選択
================================================== */

function selectPart(part){

 selectedPart=part;

 renderPartArea();

}


/* ==================================================
部位UI
================================================== */

function renderPartArea(){

 document
 .querySelectorAll(".part-tab")
 .forEach(
  button=>{

   button.classList.toggle(
    "active",
    button.textContent.trim()===
    selectedPart
   );

  }
 );


 renderExercisePicker();

}


/* ==================================================
③ 種目選択
================================================== */

function renderExercisePicker(){

 const root=
 document.getElementById(
  "exercisePicker"
 );


 if(!selectedMethod ||
    !selectedPart){

  root.innerHTML="";

  return;

 }


 const list=
 db.exercises.filter(
  exercise=>
   exercise.part===selectedPart
 );


 let html=`

  <div class="section-label">
   ③ ${selectedPart}の種目を選択
  </div>

 `;


 if(!list.length){

  html+=`

   <div class="empty">

    ${selectedPart}に登録された種目がありません。<br>
    「設定」から種目を登録してください。

   </div>

  `;

 }else{

  html+=`

   <div class="exercise-list">

  `;


  list.forEach(
   exercise=>{

    html+=`

     <button
      class="exercise-choice"
      onclick="
       addExercise(
        '${selectedMethod}',
        '${esc(exercise.name)}'
       )
      ">

      ${esc(exercise.name)}

     </button>

    `;

   }
  );


  html+=`

   </div>

  `;

 }


 html+=`

  <div
   style="margin-top:12px">

   <label>
    登録していない種目を直接入力
   </label>

   <div class="row">

    <input
     id="directName"
     placeholder="例：ベンチプレス"
    >

    <button
     class="btn"
     onclick="addDirectExercise()">
     追加
    </button>

   </div>

  </div>

 `;


 root.innerHTML=html;

}


/* ==================================================
直接入力
================================================== */

function addDirectExercise(){

 const input=
 document.getElementById(
  "directName"
 );


 if(!input)
  return;


 const name=
 input.value.trim();


 if(!name){

  alert("種目名を入力してください");

  return;

 }


 addExercise(
  selectedMethod,
  name
 );


}


/* ==================================================
種目追加
================================================== */

function addExercise(
 type,
 name
){

 const exercise={

  id:uid(),

  type:type,

  name:name,

  sets:[],

  groups:[]

 };


 /* 通常 */
 if(type==="normal"){

  exercise.sets=[
   newSet(),
   newSet(),
   newSet()
  ];

 }


 /* ドロップ */
 if(type==="drop"){

  exercise.sets=[
   newSet(),
   newSet(),
   newSet()
  ];

 }


 /* スーパー */
 if(type==="superset"){

  exercise.groups=[

   {
    id:uid(),
    name:name,
    sets:[
     newSet(),
     newSet(),
     newSet()
    ]
   },

   {
    id:uid(),
    name:"",
    sets:[
     newSet(),
     newSet(),
     newSet()
    ]
   }

  ];

 }


 /* ジャイアント */
 if(type==="giant"){

  exercise.groups=[

   {
    id:uid(),
    name:name,
    sets:[
     newSet(),
     newSet(),
     newSet()
    ]
   },

   {
    id:uid(),
    name:"",
    sets:[
     newSet(),
     newSet(),
     newSet()
    ]
   },

   {
    id:uid(),
    name:"",
    sets:[
     newSet(),
     newSet(),
     newSet()
    ]
   },

   {
    id:uid(),
    name:"",
    sets:[
     newSet(),
     newSet(),
     newSet()
    ]
   }

  ];

 }


 draft.push(exercise);

 save();

 render();

 /*
 ここが今回の重要ポイント。

 セット法と部位は変更しない。
 そのため連続追加ができる。
 */

 renderPartArea();

}


/* ==================================================
種目削除
================================================== */

function deleteWorkoutExercise(id){

 draft=
 draft.filter(
  exercise=>exercise.id!==id
 );

 save();

 render();

}


/* ==================================================
通常・ドロップセット更新
================================================== */

function updateSet(
 exerciseId,
 setId,
 key,
 value
){

 const exercise=
 draft.find(
  x=>x.id===exerciseId
 );


 if(!exercise)
  return;


 const set=
 exercise.sets.find(
  x=>x.id===setId
 );


 if(!set)
  return;


 set[key]=value;

 save();

 /*
 入力中はrenderしない。
 これで重量・回数が消えない。
 */

}


/* ==================================================
セット追加
================================================== */

function addSet(exerciseId){

 const exercise=
 draft.find(
  x=>x.id===exerciseId
 );


 if(!exercise)
  return;


 exercise.sets.push(
  newSet()
 );

 save();

 render();

}


/* ==================================================
セット削除
================================================== */

function deleteSet(
 exerciseId,
 setId
){

 const exercise=
 draft.find(
  x=>x.id===exerciseId
 );


 if(!exercise)
  return;


 if(exercise.sets.length<=1){

  alert(
   "最低1セットは残してください"
  );

  return;

 }


 exercise.sets=
 exercise.sets.filter(
  set=>set.id!==setId
 );


 save();

 render();

}


/* ==================================================
セットオプション
================================================== */

function toggleSet(
 exerciseId,
 setId,
 key
){

 const exercise=
 draft.find(
  x=>x.id===exerciseId
 );


 if(!exercise)
  return;


 const set=
 exercise.sets.find(
  x=>x.id===setId
 );


 if(!set)
  return;


 set[key]=!set[key];

 save();

 render();

}


/* ==================================================
スーパー・ジャイアント
================================================== */

function updateGroupName(
 exerciseId,
 groupId,
 value
){

 const exercise=
 draft.find(
  x=>x.id===exerciseId
 );

 if(!exercise)
  return;


 const group=
 exercise.groups.find(
  x=>x.id===groupId
 );

 if(!group)
  return;


 group.name=value;

 save();

}


function updateGroupSet(
 exerciseId,
 groupId,
 setId,
 key,
 value
){

 const exercise=
 draft.find(
  x=>x.id===exerciseId
 );

 if(!exercise)
  return;


 const group=
 exercise.groups.find(
  x=>x.id===groupId
 );

 if(!group)
  return;


 const set=
 group.sets.find(
  x=>x.id===setId
 );

 if(!set)
  return;


 set[key]=value;

 save();

}


function addGroupSet(
 exerciseId,
 groupId
){

 const exercise=
 draft.find(
  x=>x.id===exerciseId
 );

 if(!exercise)
  return;


 const group=
 exercise.groups.find(
  x=>x.id===groupId
 );

 if(!group)
  return;


 group.sets.push(
  newSet()
 );

 save();

 render();

}


function deleteGroupSet(
 exerciseId,
 groupId,
 setId
){

 const exercise=
 draft.find(
  x=>x.id===exerciseId
 );

 if(!exercise)
  return;


 const group=
 exercise.groups.find(
  x=>x.id===groupId
 );

 if(!group)
  return;


 if(group.sets.length<=1){

  alert(
   "最低1セットは残してください"
  );

  return;

 }


 group.sets=
 group.sets.filter(
  set=>set.id!==setId
 );

 save();

 render();

}


function addGroupExercise(
 exerciseId
){

 const exercise=
 draft.find(
  x=>x.id===exerciseId
 );

 if(!exercise)
  return;


 exercise.groups.push({

  id:uid(),

  name:"",

  sets:[
   newSet(),
   newSet(),
   newSet()
  ]

 });

 save();

 render();

}


function deleteGroupExercise(
 exerciseId,
 groupId
){

 const exercise=
 draft.find(
  x=>x.id===exerciseId
 );

 if(!exercise)
  return;


 if(exercise.groups.length<=2){

  alert(
   "最低2種目は残してください"
  );

  return;

 }


 exercise.groups=
 exercise.groups.filter(
  group=>group.id!==groupId
 );

 save();

 render();

}


/* ==================================================
前回記録
================================================== */

function findPrevious(name){

 if(!name)
  return null;


 for(
  const workout of db.history
 ){

  for(
   const exercise of workout.exercises
  ){

   if(
    exercise.name===name &&
    exercise.groups.length===0
   ){

    return exercise;

   }


   if(
    exercise.groups &&
    exercise.groups.length
   ){

    for(
     const group of exercise.groups
    ){

     if(group.name===name){

      return group;

     }

    }

   }

  }

 }


 return null;

}

/* ==================================================
メイン表示
================================================== */

function render(){

 const root=
 document.getElementById(
  "exerciseList"
 );

 root.innerHTML="";


 if(!draft.length){

  root.innerHTML=`

   <div class="card empty">
    セット法を選択して<br>
    部位 → 種目の順番で追加してください
   </div>

  `;

  return;

 }


 draft.forEach(
  (exercise,index)=>{

   const previous=
   findPrevious(
    exercise.name
   );


   let html=`

    <div class="card">

     <div class="row between">

      <div class="title">

       ${index+1}.
       ${esc(
        exercise.name ||
        "種目名"
       )}

       <span class="badge">
        ${methodLabel(
         exercise.type
        )}
       </span>

      </div>

      <button
       class="btn red"
       onclick="
        deleteWorkoutExercise(
         '${exercise.id}'
        )
       ">
       削除
      </button>

     </div>

   `;


   /* 通常・ドロップ */

   if(
    exercise.type==="normal" ||
    exercise.type==="drop"
   ){

    if(previous){

     html+=`

      <div class="previous">

       前回：

       ${
        previous.sets.map(
         set=>
          `${set.weight||"-"}kg × ${set.reps||"-"}回`
        ).join(" / ")
       }

      </div>

     `;

    }


    html+=`

     <label>種目名</label>

     <input
      value="${esc(exercise.name)}"
      oninput="
       updateExerciseName(
        '${exercise.id}',
        this.value
       )
      "
     >

    `;


    exercise.sets.forEach(
     (set,index)=>{

      html+=
      renderSet(
       exercise,
       set,
       index
      );

     }
    );


    html+=`

     <button
      class="btn dark full"
      style="margin-top:9px"
      onclick="
       addSet(
        '${exercise.id}'
       )
      ">
      ＋ セット追加
     </button>

    `;

   }


   /* スーパー・ジャイアント */

   if(
    exercise.type==="superset" ||
    exercise.type==="giant"
   ){

    html+=`

     <div class="sub">
      各種目の重量・回数を記録
     </div>

    `;


    exercise.groups.forEach(
     (group,gIndex)=>{

      const previousGroup=
      findPrevious(
       group.name
      );


      html+=`

       <div class="group">

        <div class="group-title">
         ${gIndex+1}種目目
        </div>

        <input
         placeholder="種目名"
         value="${esc(group.name)}"

         oninput="
          updateGroupName(
           '${exercise.id}',
           '${group.id}',
           this.value
          )
         "
        >

      `;


      if(previousGroup){

       html+=`

        <div class="previous">

         前回：

         ${
          previousGroup.sets.map(
           set=>
            `${set.weight||"-"}kg × ${set.reps||"-"}回`
          ).join(" / ")
         }

        </div>

       `;

      }


      group.sets.forEach(
       (set,setIndex)=>{

        html+=
        renderGroupSet(
         exercise,
         group,
         set,
         setIndex
        );

       }
      );


      html+=`

        <button
         class="btn dark full"
         style="margin-top:8px"
         onclick="
          addGroupSet(
           '${exercise.id}',
           '${group.id}'
          )
         ">
         ＋ セット追加
        </button>

        <button
         class="btn red full"
         style="margin-top:6px"
         onclick="
          deleteGroupExercise(
           '${exercise.id}',
           '${group.id}'
          )
         ">
         この種目を削除
        </button>

       </div>

      `;

     }
    );


    html+=`

     <button
      class="btn dark full"
      style="margin-top:9px"
      onclick="
       addGroupExercise(
        '${exercise.id}'
       )
      ">
      ＋ 種目追加
     </button>

    `;

   }


   html+=`

    </div>

   `;


   root.insertAdjacentHTML(
    "beforeend",
    html
   );

  }
 );

}

  return;

 }


 const workout={

  id:uid(),

  date:new Date().toISOString(),

  exercises:
   JSON.parse(
    JSON.stringify(draft)
   )

 };

 render();

 );

}

/* ==================================================
PR
================================================== */

function renderPR(){

 const root=
 document.getElementById(
  "prList"
 );


 const prs={};


 db.history.forEach(
  workout=>{

   workout.exercises.forEach(
    exercise=>{

     if(
      exercise.type==="superset" ||
      exercise.type==="giant"
     ){

      exercise.groups.forEach(
       group=>{

        if(!group.name)
         return;


        group.sets.forEach(
         set=>{

          const weight=
          Number(set.weight)||0;


          if(
           !prs[group.name] ||
           weight>prs[group.name]
          ){

           prs[group.name]=weight;

          }

         }
        );

       }
      );

     }else{

      if(!exercise.name)
       return;


      exercise.sets.forEach(
       set=>{

        const weight=
        Number(set.weight)||0;


        if(
         !prs[exercise.name] ||
         weight>prs[exercise.name]
        ){

         prs[exercise.name]=weight;

        }

       }
      );

     }

    }
   );

  }
 );


 const names=
 Object.keys(prs);


 if(!names.length){

  root.innerHTML=
   '<div class="empty">まだPRがありません</div>';

  return;

 }


 root.innerHTML=
 names.map(
  name=>`

   <div class="pr">

    <span>
     ${esc(name)}
    </span>

    <b>
     ${prs[name]}kg
    </b>

   </div>

  `
 ).join("");

}

/* ==================================================
タイマー
================================================== */

let timerInterval=null;
let timerEnd=0;


function startTimer(seconds){

 stopTimer();

 timerEnd=
 Date.now()+
 seconds*1000;

 document
 .getElementById("timer")
 .classList.remove("hidden");

 updateTimer();

 timerInterval=
 setInterval(
  updateTimer,
  250
 );

}


function updateTimer(){

 const remaining=
 Math.max(
  0,
  timerEnd-Date.now()
 );


 const sec=
 Math.ceil(
  remaining/1000
 );


 const min=
 String(
  Math.floor(sec/60)
 ).padStart(2,"0");


 const second=
 String(
  sec%60
 ).padStart(2,"0");


 document
 .getElementById(
  "timerText"
 )
 .textContent=
 `${min}:${second}`;


 if(remaining<=0){

  clearInterval(
   timerInterval
  );


  if(navigator.vibrate){

   navigator.vibrate(
    [200,100,200]
   );

  }

 }

}


function stopTimer(){

 clearInterval(
  timerInterval
 );

 document
 .getElementById("timer")
 .classList.add("hidden");

}

  }

}


/* ==================================================
復元
================================================== */

function restore(event){

 const file=
 event.target.files[0];


 if(!file)
  return;


 const reader=
 new FileReader();


 reader.onload=
 function(){

  try{

   const imported=
   JSON.parse(
    reader.result
   );


   if(
    !Array.isArray(
     imported.history
    )
   ){

    throw new Error();

   }


   db=imported;


   if(
    !Array.isArray(db.draft)
   )
    db.draft=[];


   if(
    !Array.isArray(db.exercises)
   )
    db.exercises=[];


   draft=db.draft;

   save();

   render();

   renderHistory();

   renderExerciseManager();

   alert(
    "バックアップを復元しました"
   );

  }catch{

   alert(
    "バックアップファイルを読み込めませんでした"
   );

  }

 };


 reader.readAsText(file);

}
