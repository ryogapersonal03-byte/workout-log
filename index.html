<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>WORKOUT LOG</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#090909;
 color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif;
}

button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}

.app{
 max-width:680px;
 margin:auto;
 padding-bottom:90px;
}

header{
 position:sticky;
 top:0;
 z-index:20;
 background:#090909ee;
 backdrop-filter:blur(12px);
 border-bottom:1px solid #252525;
 padding:16px;
}

.logo{
 font-size:20px;
 font-weight:900;
 letter-spacing:1.5px;
}

.date{
 color:#888;
 font-size:12px;
 margin-top:3px;
}

main{padding:14px}

.card{
 background:#151515;
 border:1px solid #252525;
 border-radius:18px;
 padding:15px;
 margin-bottom:12px;
}

.row{
 display:flex;
 gap:8px;
 align-items:center;
}

.between{justify-content:space-between}

.title{
 font-weight:900;
 font-size:17px;
}

.sub{
 color:#888;
 font-size:12px;
 margin-top:3px;
}

.btn{
 background:#fff;
 color:#000;
 padding:11px 14px;
 border-radius:12px;
 font-weight:800;
}

.btn.dark{
 background:#242424;
 color:#fff;
}

.btn.red{
 background:#321616;
 color:#ff7777;
}

.btn.green{
 background:#18351f;
 color:#7cff98;
}

.btn.full{width:100%}

input,select,textarea{
 width:100%;
 border:1px solid #303030;
 background:#0e0e0e;
 color:#fff;
 border-radius:11px;
 padding:11px;
 outline:none;
}

input:focus,
select:focus,
textarea:focus{
 border-color:#777;
}

label{
 display:block;
 font-size:11px;
 color:#888;
 margin:10px 0 5px;
}

.badge{
 display:inline-block;
 padding:4px 8px;
 border-radius:99px;
 background:#292929;
 color:#aaa;
 font-size:10px;
 margin-left:4px;
}

.set{
 background:#101010;
 border:1px solid #242424;
 border-radius:13px;
 padding:9px;
 margin-top:7px;
}

.setgrid{
 display:grid;
 grid-template-columns:34px 1fr 1fr 38px;
 gap:6px;
 align-items:center;
}

.setnum{
 color:#777;
 text-align:center;
 font-size:12px;
}

.options{
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 margin-top:8px;
}

.toggle{
 background:#222;
 color:#aaa;
 padding:7px 9px;
 border-radius:9px;
 font-size:11px;
}

.toggle.active{
 background:#fff;
 color:#000;
}

.prev{
 background:#191919;
 border-radius:10px;
 padding:8px;
 margin-top:8px;
 font-size:11px;
 color:#aaa;
}

.exercise-actions{
 display:flex;
 gap:6px;
 margin-top:9px;
}

.exercise-actions button{
 flex:1;
}

.empty{
 text-align:center;
 color:#666;
 padding:35px 10px;
}

.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 z-index:30;
 background:#111e;
 backdrop-filter:blur(15px);
 border-top:1px solid #292929;
}

.bottom-inner{
 max-width:680px;
 margin:auto;
 display:flex;
}

.bottom button{
 flex:1;
 padding:14px 4px;
 background:transparent;
 color:#777;
 font-size:11px;
}

.bottom button.active{
 color:#fff;
}

.hidden{
 display:none!important;
}

.history-item{
 padding:13px 0;
 border-bottom:1px solid #292929;
}

.history-item:last-child{
 border:0;
}

.pr{
 display:flex;
 justify-content:space-between;
 padding:10px 0;
 border-bottom:1px solid #292929;
}

.timer{
 position:fixed;
 right:14px;
 bottom:72px;
 z-index:40;
 background:#fff;
 color:#000;
 border-radius:15px;
 padding:12px 15px;
 font-weight:900;
 box-shadow:0 5px 30px #000;
}

.timer button{
 background:#000;
 color:#fff;
 border-radius:8px;
 padding:6px 9px;
 margin-left:6px;
}

h2{
 font-size:14px;
 margin:0 0 10px;
}

/* 部位 */

.muscle-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
 margin-top:10px;
}

.muscle-btn{
 background:#222;
 color:#aaa;
 border:1px solid #303030;
 padding:13px 8px;
 border-radius:12px;
 font-weight:800;
}

.muscle-btn.active{
 background:#fff;
 color:#000;
}

.exercise-option{
 display:flex;
 justify-content:space-between;
 align-items:center;
 background:#101010;
 border:1px solid #292929;
 border-radius:12px;
 padding:11px;
 margin-top:7px;
}

.exercise-option-name{
 font-weight:800;
}

.exercise-option-add{
 background:#fff;
 color:#000;
 padding:7px 10px;
 border-radius:9px;
 font-size:11px;
 font-weight:800;
}

/* 種目タイプ */

.type-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
 margin-top:10px;
}

.type-btn{
 background:#222;
 color:#aaa;
 padding:12px 8px;
 border-radius:11px;
 font-weight:800;
}

.type-btn.active{
 background:#fff;
 color:#000;
}

.type-panel{
 margin-top:12px;
 padding-top:12px;
 border-top:1px solid #292929;
}

/* グループ */

.group-exercise{
 background:#101010;
 border:1px solid #292929;
 border-radius:13px;
 padding:10px;
 margin-top:9px;
}

.group-label{
 color:#888;
 font-size:11px;
 margin-bottom:6px;
}

.group-set-title{
 font-size:11px;
 color:#777;
 margin-top:9px;
}

/* ドロップ */

.drop{
 background:#101010;
 border:1px solid #292929;
 border-radius:13px;
 padding:10px;
 margin-top:8px;
}

.drop-title{
 font-size:11px;
 color:#888;
 margin-bottom:7px;
}

.drop-row{
 display:grid;
 grid-template-columns:30px 1fr 1fr 34px;
 gap:6px;
 align-items:center;
 margin-top:6px;
}

.drop-num{
 color:#777;
 text-align:center;
 font-size:11px;
}

.small-btn{
 background:#242424;
 color:#fff;
 padding:8px 10px;
 border-radius:9px;
 font-size:11px;
 font-weight:800;
}

.delete-small{
 background:#321616;
 color:#ff7777;
 border-radius:9px;
 padding:7px;
}

.register-area{
 margin-top:12px;
 padding-top:12px;
 border-top:1px solid #292929;
}

</style>
</head>

<body>

<div class="app">

<header>
 <div class="logo">WORKOUT LOG</div>
 <div class="date" id="date"></div>
</header>

<main>

<!-- WORKOUT -->

<section id="workoutPage">

<div class="card">

 <div class="row between">

  <div>
   <div class="title">TODAY'S WORKOUT</div>
   <div class="sub">
    前回の記録を確認しながら入力
   </div>
  </div>

  <button
   class="btn green"
   onclick="finishWorkout()"
  >
   保存
  </button>

 </div>

</div>

<div id="exerciseList"></div>


<!-- 種目追加 -->

<div class="card">

 <h2>種目を追加</h2>

 <div class="sub">
  部位を選択してください
 </div>

 <div class="muscle-grid">

  <button
   class="muscle-btn"
   onclick="selectMuscle('胸',this)"
  >
   胸
  </button>

  <button
   class="muscle-btn"
   onclick="selectMuscle('背中',this)"
  >
   背中
  </button>

  <button
   class="muscle-btn"
   onclick="selectMuscle('肩',this)"
  >
   肩
  </button>

  <button
   class="muscle-btn"
   onclick="selectMuscle('脚',this)"
  >
   脚
  </button>

  <button
   class="muscle-btn"
   onclick="selectMuscle('二頭',this)"
  >
   二頭
  </button>

  <button
   class="muscle-btn"
   onclick="selectMuscle('三頭',this)"
  >
   三頭
  </button>

  <button
   class="muscle-btn"
   onclick="selectMuscle('腹',this)"
  >
   腹
  </button>

  <button
   class="muscle-btn"
   onclick="selectMuscle('その他',this)"
  >
   その他
  </button>

 </div>

 <div
  id="exerciseSelector"
  class="hidden"
 ></div>

</div>


<div class="card">

 <button
  class="btn dark full"
  onclick="copyLastWorkout()"
 >
  前回メニューをコピー
 </button>

</div>

</section>


<!-- HISTORY -->

<section
 id="historyPage"
 class="hidden"
>

<div class="card">

 <h2>トレーニング履歴</h2>

 <div id="historyList"></div>

</div>

<div class="card">

 <h2>種目別PR</h2>

 <div id="prList"></div>

</div>

</section>


<!-- SETTINGS -->

<section
 id="settingsPage"
 class="hidden"
>

<div class="card">

 <h2>データ管理</h2>

 <button
  class="btn full"
  onclick="backup()"
 >
  バックアップ
 </button>

 <label>
  バックアップを復元
 </label>

 <input
  type="file"
  accept=".json"
  onchange="restore(event)"
 >

 <button
  class="btn red full"
  style="margin-top:12px"
  onclick="clearAll()"
 >
  全データ削除
 </button>

</div>

</section>

</main>


<!-- TIMER -->

<div
 id="timer"
 class="timer hidden"
>

 <span id="timerText">
  00:00
 </span>

 <button onclick="stopTimer()">
  停止
 </button>

</div>


<!-- NAV -->

<nav class="bottom">

 <div class="bottom-inner">

  <button
   class="active"
   onclick="showPage('workout',this)"
  >
   記録
  </button>

  <button
   onclick="showPage('history',this)"
  >
   履歴
  </button>

  <button
   onclick="showPage('settings',this)"
  >
   設定
  </button>

 </div>

</nav>

</div>


<script>

const KEY="WORKOUT_LOG_V4";

let db=loadDB();

let draft=db.draft || [];

let selectedMuscle="";

let selectedType="normal";


/* =========================
   デフォルト種目
========================= */

const DEFAULT_EXERCISES={

 "胸":[
  "ベンチプレス",
  "インクラインベンチプレス",
  "ダンベルベンチプレス",
  "インクラインダンベルプレス",
  "チェストプレス",
  "ペックフライ"
 ],

 "背中":[
  "ラットプルダウン",
  "ワイドプル",
  "レバーロー",
  "シーテッドロー",
  "ベントオーバーロー",
  "懸垂"
 ],

 "肩":[
  "ショルダープレス",
  "ダンベルショルダープレス",
  "サイドレイズ",
  "デルトイドレイズ",
  "リアレイズ"
 ],

 "脚":[
  "スクワット",
  "レッグプレス",
  "ブルガリアンスクワット",
  "レッグエクステンション",
  "レッグカール",
  "ルーマニアンデッドリフト"
 ],

 "二頭":[
  "バーベルカール",
  "EZバーカール",
  "ダンベルカール",
  "ハンマーカール",
  "プリーチャーカール"
 ],

 "三頭":[
  "ライイングエクステンション",
  "EZバーナロープレス",
  "フレンチプレス",
  "プレスダウン",
  "オーバーヘッドエクステンション"
 ],

 "腹":[
  "アブドミナルクランチ",
  "クランチ",
  "レッグレイズ",
  "ケーブルクランチ"
 ],

 "その他":[
  "その他"
 ]

};


/* =========================
   基本
========================= */

const uid=()=>Date.now().toString(36)+
 Math.random().toString(36).substring(2);


const esc=s=>String(s??"").replace(
 /[&<>"']/g,
 m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[m])
);


function loadDB(){

 let old=
  localStorage.getItem("WORKOUT_LOG_V3") ||
  localStorage.getItem("WORKOUT_LOG_V2");

 let current=
  localStorage.getItem(KEY);

 if(current){

  try{
   return JSON.parse(current);
  }catch{}

 }

 if(old){

  try{

   const data=JSON.parse(old);

   data.exercises=
    data.exercises || [];

   return data;

  }catch{}

 }

 return{
  history:[],
  draft:[],
  exercises:[]
 };

}


function save(){

 db.draft=draft;

 localStorage.setItem(
  KEY,
  JSON.stringify(db)
 );

}


/* =========================
   日付
========================= */

document.getElementById("date").textContent=
 new Date().toLocaleDateString(
  "ja-JP",
  {
   year:"numeric",
   month:"long",
   day:"numeric",
   weekday:"short"
  }
);


/* =========================
   種目登録
========================= */

function selectMuscle(
 muscle,
 button
){

 selectedMuscle=muscle;

 document
  .querySelectorAll(".muscle-btn")
  .forEach(
   b=>b.classList.remove("active")
  );

 button.classList.add("active");

 selectedType="normal";

 renderExerciseSelector();

}


function getCustomExercises(){

 return (db.exercises || [])
  .filter(
   e=>e.muscle===selectedMuscle
  )
  .map(
   e=>e.name
  );

}


function renderExerciseSelector(){

 const root=
  document.getElementById(
   "exerciseSelector"
  );

 root.classList.remove("hidden");


 const defaults=
  DEFAULT_EXERCISES[selectedMuscle] || [];

 const custom=
  getCustomExercises();

 const names=
  [...new Set([
   ...defaults,
   ...custom
  ])];


 let html=`

 <div class="type-panel">

  <label>
   セットタイプ
  </label>

  <div class="type-grid">

   <button
    class="type-btn ${
     selectedType==="normal"
     ?"active":""
    }"
    onclick="selectType('normal')"
   >
    通常セット
   </button>

   <button
    class="type-btn ${
     selectedType==="drop"
     ?"active":""
    }"
    onclick="selectType('drop')"
   >
    ドロップセット
   </button>

   <button
    class="type-btn ${
     selectedType==="superset"
     ?"active":""
    }"
    onclick="selectType('superset')"
   >
    スーパーセット
   </button>

   <button
    class="type-btn ${
     selectedType==="giant"
     ?"active":""
    }"
    onclick="selectType('giant')"
   >
    ジャイアントセット
   </button>

  </div>

 `;


 if(
  selectedType==="normal" ||
  selectedType==="drop"
 ){

  html+=`

  <label>
   ${selectedMuscle}の種目
  </label>

  `;

  names.forEach(name=>{

   html+=`

   <div class="exercise-option">

    <div class="exercise-option-name">
     ${esc(name)}
    </div>

    <button
     class="exercise-option-add"
     onclick="
      addExercise(
       '${esc(name)}',
       '${selectedType}'
      )
     "
    >
     追加
    </button>

   </div>

   `;

  });

 }


 if(selectedType==="superset"){

  html+=`

  <label>
   スーパーセットの種目
  </label>

  <div class="sub">
   2種目を選択してください
  </div>

  `;

  html+=
   renderGroupExerciseSelector(
    2
   );

 }


 if(selectedType==="giant"){

  html+=`

  <label>
   ジャイアントセットの種目
  </label>

  <div class="sub">
   4種目を選択してください
  </div>

  `;

  html+=
   renderGroupExerciseSelector(
    4
   );

 }


 html+=`

 <div class="register-area">

  <label>
   新しい種目を登録
  </label>

  <div class="row">

   <input
    id="newExerciseName"
    placeholder="${esc(selectedMuscle)}の種目名"
   >

   <button
    class="btn"
    onclick="registerExercise()"
   >
    登録
   </button>

  </div>

 </div>

 </div>

 `;


 root.innerHTML=html;

}


function selectType(type){

 selectedType=type;

 renderExerciseSelector();

}


function renderGroupExerciseSelector(
 count
){

 const defaults=
  DEFAULT_EXERCISES[selectedMuscle] || [];

 const custom=
  getCustomExercises();

 const names=
  [...new Set([
   ...defaults,
   ...custom
  ])];


 let html="";


 for(let i=0;i<count;i++){

  html+=`

  <div class="group-exercise">

   <div class="group-label">
    種目 ${i+1}
   </div>

   <select
    id="groupSelect${i}"
   >

    <option value="">
     種目を選択
    </option>

    ${
     names.map(
      n=>
      `<option value="${esc(n)}">
       ${esc(n)}
      </option>`
     ).join("")
    }

   </select>

  </div>

  `;

 }


 html+=`

 <button
  class="btn full"
  style="margin-top:10px"
  onclick="
   addGroupExercise(${count})
  "
 >
  ${count===2
   ?"スーパーセットを追加"
   :"ジャイアントセットを追加"
  }
 </button>

 `;


 return html;

}


function registerExercise(){

 const input=
  document.getElementById(
   "newExerciseName"
  );

 if(!input)return;

 const name=
  input.value.trim();

 if(!name){

  alert(
   "種目名を入力してください"
  );

  return;

 }

 if(!db.exercises){
  db.exercises=[];
 }

 const exists=
  db.exercises.some(
   e=>
    e.muscle===selectedMuscle &&
    e.name===name
  );

 if(!exists){

  db.exercises.push({
   id:uid(),
   muscle:selectedMuscle,
   name:name
  });

 }

 save();

 input.value="";

 renderExerciseSelector();

}


/* =========================
   セット生成
========================= */

function createSet(){

 return{
  id:uid(),
  weight:"",
  reps:"",
  assist:false,
  restPause:false,
  restSeconds:"",
  cheating:false,
  note:""
 };

}


function createDrop(){

 return{
  id:uid(),
  weight:"",
  reps:""
 };

}


/* =========================
   種目追加
========================= */

function addExercise(
 name,
 type
){

 const e={
  id:uid(),
  type:type,
  muscle:selectedMuscle,
  name:name,
  sets:[]
 };


 for(let i=0;i<3;i++){

  const set=createSet();

  if(type==="drop"){
   set.drops=[
    createDrop(),
    createDrop()
   ];
  }

  e.sets.push(set);

 }

 draft.push(e);

 save();
 render();

}


function addGroupExercise(
 count
){

 const group=[];

 for(let i=0;i<count;i++){

  const select=
   document.getElementById(
    "groupSelect"+i
   );

  if(!select ||
     !select.value){

   alert(
    `種目${i+1}を選択してください`
   );

   return;

  }

  group.push({

   id:uid(),

   muscle:selectedMuscle,

   name:select.value,

   sets:[
    createSet(),
    createSet(),
    createSet()
   ]

  });

 }


 draft.push({

  id:uid(),

  type:
   count===2
   ?"superset"
   :"giant",

  muscle:selectedMuscle,

  group:group

 });


 save();

 render();

}


/* =========================
   通常セット
========================= */

function addSet(eid){

 const e=
  draft.find(
   x=>x.id===eid
  );

 if(!e)return;


 if(e.group){

  e.group.forEach(
   g=>{

    g.sets.push(
     createSet()
    );

   }
  );

 }else{

  const set=
   createSet();

  if(e.type==="drop"){

   set.drops=[
    createDrop(),
    createDrop()
   ];

  }

  e.sets.push(set);

 }

 save();

 render();

}


function deleteSet(
 eid,
 sid
){

 const e=
  draft.find(
   x=>x.id===eid
  );

 if(!e)return;

 e.sets=
  e.sets.filter(
   s=>s.id!==sid
  );

 save();

 render();

}


/* =========================
   種目削除
========================= */

function deleteExercise(id){

 draft=
  draft.filter(
   e=>e.id!==id
  );

 save();

 render();

}


/* =========================
   更新
========================= */

function updateExercise(
 id,
 key,
 value
){

 const e=
  draft.find(
   x=>x.id===id
  );

 if(!e)return;

 e[key]=value;

 save();

}


function updateSet(
 eid,
 sid,
 key,
 value
){

 const e=
  draft.find(
   x=>x.id===eid
  );

 if(!e)return;

 const s=
  e.sets.find(
   x=>x.id===sid
  );

 if(!s)return;

 s[key]=value;

 save();

}


function toggleSet(
 eid,
 sid,
 key
){

 const e=
  draft.find(
   x=>x.id===eid
  );

 if(!e)return;

 const s=
  e.sets.find(
   x=>x.id===sid
  );

 if(!s)return;

 s[key]=!s[key];

 save();

 render();

}


/* =========================
   ドロップ更新
========================= */

function updateDrop(
 eid,
 sid,
 did,
 key,
 value
){

 const e=
  draft.find(
   x=>x.id===eid
  );

 if(!e)return;

 const s=
  e.sets.find(
   x=>x.id===sid
  );

 if(!s)return;

 const d=
  s.drops.find(
   x=>x.id===did
  );

 if(!d)return;

 d[key]=value;

 save();

}


function addDrop(
 eid,
 sid
){

 const e=
  draft.find(
   x=>x.id===eid
  );

 if(!e)return;

 const s=
  e.sets.find(
   x=>x.id===sid
  );

 if(!s)return;

 if(!s.drops){
  s.drops=[];
 }

 s.drops.push(
  createDrop()
 );

 save();

 render();

}


function deleteDrop(
 eid,
 sid,
 did
){

 const e=
  draft.find(
   x=>x.id===eid
  );

 if(!e)return;

 const s=
  e.sets.find(
   x=>x.id===sid
  );

 if(!s)return;

 s.drops=
  s.drops.filter(
   d=>d.id!==did
  );

 save();

 render();

}


/* =========================
   グループ更新
========================= */

function updateGroupSet(
 gid,
 sid,
 key,
 value
){

 for(
  const e of draft
 ){

  if(!e.group)continue;

  const g=
   e.group.find(
    x=>x.id===gid
   );

  if(!g)continue;

  const s=
   g.sets.find(
    x=>x.id===sid
   );

  if(!s)continue;

  s[key]=value;

  save();

  return;

 }

}


function deleteGroupSet(
 gid,
 sid
){

 for(
  const e of draft
 ){

  if(!e.group)continue;

  const g=
   e.group.find(
    x=>x.id===gid
   );

  if(!g)continue;

  g.sets=
   g.sets.filter(
    s=>s.id!==sid
   );

  save();

  render();

  return;

 }

}


function updateGroupName(
 gid,
 value
){

 for(
  const e of draft
 ){

  if(!e.group)continue;

  const g=
   e.group.find(
    x=>x.id===gid
   );

  if(g){

   g.name=value;

   save();

   return;

  }

 }

}


/* =========================
   前回記録
========================= */

function previous(name){

 if(!name)return null;

 for(
  const workout of db.history
 ){

  for(
   const e of workout.exercises || []
  ){

   if(e.name===name){

    return e;

   }

   if(e.group){

    for(
     const g of e.group
    ){

     if(g.name===name){

      return g;

     }

    }

   }

  }

 }

 return null;

}

/* =========================
   グループ描画
========================= */

function renderGroup(
 e,
 index
){

 const typeName=
  e.type==="superset"
  ?"スーパーセット"
  :"ジャイアントセット";


 let html=`

 <div class="card">

  <div class="row between">

   <div>

    <div class="title">
     ${index+1}. ${typeName}
    </div>

    <div class="sub">
     ${e.group.length}種目
    </div>

   </div>

   <button
    class="btn red"
    onclick="
     deleteExercise(
      '${e.id}'
     )
    "
   >
    削除
   </button>

  </div>

 `;


 e.group.forEach(
  (g,gi)=>{

   const prev=
    previous(g.name);

   html+=`

   <div class="group-exercise">

    <div class="group-label">
     種目 ${gi+1}
    </div>

    <input
     value="${esc(g.name)}"
     placeholder="種目名"
     oninput="
      updateGroupName(
       '${g.id}',
       this.value
      )
     "
    >

   `;


   if(prev){

    html+=`

    <div class="prev">

     前回：
     ${prev.sets.map(
      s=>
      `${s.weight||"-"}kg × ${s.reps||"-"}`
     ).join(" / ")}

    </div>

    `;

   }


   g.sets.forEach(
    (s,si)=>{

     html+=`

     <div class="set">

      <div class="setgrid">

       <div class="setnum">
        SET<br>${si+1}
       </div>

       <input
        type="number"
        step="0.5"
        placeholder="重量 kg"
        value="${esc(s.weight)}"
        oninput="
         updateGroupSet(
          '${g.id}',
          '${s.id}',
          'weight',
          this.value
         )
        "
       >

       <input
        type="number"
        placeholder="回数"
        value="${esc(s.reps)}"
        oninput="
         updateGroupSet(
          '${g.id}',
          '${s.id}',
          'reps',
          this.value
         )
        "
       >

       <button
        class="delete-small"
        onclick="
         deleteGroupSet(
          '${g.id}',
          '${s.id}'
         )
        "
       >
        ×
       </button>

      </div>

     </div>

     `;

    }
   );


   html+=`

   </div>

   `;

  }
 );


 html+=`

  <div class="exercise-actions">

   <button
    class="btn dark"
    onclick="
     addSet(
      '${e.id}'
     )
    "
   >
    ＋ セット
   </button>

  </div>

 </div>

 `;


 return html;

}


/* =========================
   全体描画
========================= */

function render(){

 const root=
  document.getElementById(
   "exerciseList"
  );

 root.innerHTML="";


 if(!draft.length){

  root.innerHTML=
   '<div class="card empty">種目を追加してトレーニング開始</div>';

  return;

 }


 draft.forEach(
  (e,index)=>{

   if(e.group){

    root.insertAdjacentHTML(
     "beforeend",
     renderGroup(
      e,
      index
     )
    );

    return;

   }


   const prev=
    previous(e.name);


   let html=`

   <div class="card">

    <div class="row between">

     <div>

      <div class="title">
       ${index+1}.
       ${esc(e.name||"種目名")}
      </div>

      <div class="sub">
       ${esc(e.muscle||"その他")}
       ／
       ${
        e.type==="drop"
        ?"ドロップセット"
        :"通常セット"
       }
      </div>

     </div>

     <button
      class="btn red"
      onclick="
       deleteExercise(
        '${e.id}'
       )
      "
     >
      削除
     </button>

    </div>


    <label>
     種目名
    </label>

    <input
     value="${esc(e.name)}"
     placeholder="種目名"
     oninput="
      updateExercise(
       '${e.id}',
       'name',
       this.value
      )
     "
    >

   `;


   if(prev){

    html+=`

    <div class="prev">

     前回：
     ${prev.sets.map(
      s=>
      `${s.weight||"-"}kg × ${s.reps||"-"}`
     ).join(" / ")}

    </div>

    `;

   }


   e.sets.forEach(
    (s,i)=>{

     if(e.type==="drop"){

      html+=
       renderDropSet(
        e,
        s,
        i
       );

     }else{

      html+=
       renderNormalSet(
        e,
        s,
        i
       );

     }

    }
   );


   html+=`

    <div class="exercise-actions">

     <button
      class="btn dark"
      onclick="
       addSet(
        '${e.id}'
       )
      "
     >
      ＋ セット
     </button>

    </div>

   </div>

   `;


   root.insertAdjacentHTML(
    "beforeend",
    html
   );

  }
 );

}


/* =========================
   保存
========================= */

function finishWorkout(){

 if(!draft.length){

  alert(
   "種目を追加してください"
  );

  return;

 }


 const workout={

  id:uid(),

  date:
   new Date().toISOString(),

  exercises:
   JSON.parse(
    JSON.stringify(
     draft
    )
   )

 };


 db.history.unshift(
  workout
 );

 draft=[];

 save();

 render();

 renderHistory();

 alert(
  "トレーニングを保存しました！"
 );

}


/* =========================
   前回コピー
========================= */

function copyLastWorkout(){

 if(!db.history.length){

  alert(
   "まだ前回の記録がありません"
  );

  return;

 }


 draft=
  JSON.parse(
   JSON.stringify(
    db.history[0].exercises
   )
  );


 draft.forEach(
  e=>{

   e.id=uid();


   if(e.sets){

    e.sets.forEach(
     s=>{

      s.id=uid();

      if(s.drops){

       s.drops.forEach(
        d=>d.id=uid()
       );

      }

     }
    );

   }


   if(e.group){

    e.group.forEach(
     g=>{

      g.id=uid();

      g.sets.forEach(
       s=>s.id=uid()
      );

     }
    );

   }

  }
 );


 save();

 render();

 alert(
  "前回メニューをコピーしました！"
 );

}


/* =========================
   履歴
========================= */

function renderHistory(){

 const root=
  document.getElementById(
   "historyList"
  );


 if(!db.history.length){

  root.innerHTML=
   '<div class="empty">まだ記録がありません</div>';

  renderPR();

  return;

 }


 root.innerHTML=
  db.history.map(
   w=>{

    const date=
     new Date(
      w.date
     ).toLocaleDateString(
      "ja-JP",
      {
       year:"numeric",
       month:"short",
       day:"numeric"
      }
     );


    const names=[];


    w.exercises.forEach(
     e=>{

      if(e.name){

       names.push(
        e.name
       );

      }


      if(e.group){

       e.group.forEach(
        g=>{

         if(g.name){

          names.push(
           g.name
          );

         }

        }
       );

      }

     }
    );


    return`

    <div class="history-item">

     <b>${date}</b>

     <div class="sub">

      ${names
       .map(
        n=>esc(n)
       )
       .join(" / ")
      }

     </div>

    </div>

    `;

   }
  ).join("");


 renderPR();

}


/* =========================
   PR
========================= */

function renderPR(){

 const root=
  document.getElementById(
   "prList"
  );

 const prs={};


 db.history.forEach(
  w=>{

   w.exercises.forEach(
    e=>{

     if(e.name){

      e.sets.forEach(
       s=>{

        const weight=
         Number(s.weight)||0;

        if(
         !prs[e.name] ||
         weight>prs[e.name]
        ){

         prs[e.name]=weight;

        }

       }
      );

     }


     if(e.group){

      e.group.forEach(
       g=>{

        if(!g.name)return;

        g.sets.forEach(
         s=>{

          const weight=
           Number(s.weight)||0;

          if(
           !prs[g.name] ||
           weight>prs[g.name]
          ){

           prs[g.name]=weight;

          }

         }
        );

       }
      );

     }

    }
   );

  }
 );


 const names=
  Object.keys(prs);


 if(!names.length){

  root.innerHTML=
   '<div class="empty">まだPRがありません</div>';

  return;

 }


 root.innerHTML=
  names.map(
   name=>`

   <div class="pr">

    <span>
     ${esc(name)}
    </span>

    <b>
     ${prs[name]} kg
    </b>

   </div>

   `
  ).join("");

}


/* =========================
   ページ
========================= */

function showPage(
 name,
 button
){

 [
  "workout",
  "history",
  "settings"
 ].forEach(
  x=>{

   document
    .getElementById(
     x+"Page"
    )
    .classList.toggle(
     "hidden",
     x!==name
    );

  }
 );


 document
  .querySelectorAll(
   ".bottom button"
  )
  .forEach(
   b=>
    b.classList.remove(
     "active"
    )
  );


 button.classList.add(
  "active"
 );


 if(name==="history"){

  renderHistory();

 }

}


/* =========================
   タイマー
========================= */

let timerInterval=null;

let timerEnd=0;


function startTimer(
 seconds
){

 stopTimer();

 timerEnd=
  Date.now()+
  seconds*1000;


 document
  .getElementById(
   "timer"
  )
  .classList.remove(
   "hidden"
  );


 updateTimer();


 timerInterval=
  setInterval(
   updateTimer,
   250
  );

}


function updateTimer(){

 const remaining=
  Math.max(
   0,
   timerEnd-Date.now()
  );


 const sec=
  Math.ceil(
   remaining/1000
  );


 const m=
  String(
   Math.floor(
    sec/60
   )
  ).padStart(
   2,
   "0"
  );


 const s=
  String(
   sec%60
  ).padStart(
   2,
   "0"
  );


 document
  .getElementById(
   "timerText"
  )
  .textContent=
   `${m}:${s}`;


 if(remaining<=0){

  clearInterval(
   timerInterval
  );

  if(
   navigator.vibrate
  ){

   navigator.vibrate(
    [200,100,200]
   );

  }

 }

}


function stopTimer(){

 clearInterval(
  timerInterval
 );

 document
  .getElementById(
   "timer"
  )
  .classList.add(
   "hidden"
  );

}


/* =========================
   バックアップ
========================= */

function backup(){

 const blob=
  new Blob(
   [
    JSON.stringify(
     db,
     null,
     2
    )
   ],
   {
    type:
     "application/json"
   }
  );


 const url=
  URL.createObjectURL(
   blob
  );


 const a=
  document.createElement(
   "a"
  );


 a.href=url;

 a.download=
  "workout-log-backup-"+
  new Date()
   .toISOString()
   .slice(0,10)+
  ".json";


 a.click();

 URL.revokeObjectURL(
  url
 );

}


/* =========================
   復元
========================= */

function restore(event){

 const file=
  event.target.files[0];

 if(!file)return;


 const reader=
  new FileReader();


 reader.onload=()=>{

  try{

   const imported=
    JSON.parse(
     reader.result
    );


   if(
    !imported.history ||
    !Array.isArray(
     imported.history
    )
   ){

    throw new Error();

   }


   db=imported;

   db.exercises=
    db.exercises || [];

   draft=
    db.draft || [];


   save();

   render();

   renderHistory();


   alert(
    "バックアップを復元しました！"
   );


  }catch{

   alert(
    "バックアップファイルを読み込めませんでした。"
   );

  }

 };


 reader.readAsText(
  file
 );

}


/* =========================
   全削除
========================= */

function clearAll(){

 if(
  confirm(
   "すべてのトレーニングデータを削除しますか？"
  )
 ){

  db={
   history:[],
   draft:[],
   exercises:[]
  };

  draft=[];

  save();

  render();

  renderHistory();

 }

}


/* =========================
   起動
========================= */

render();

renderHistory();
