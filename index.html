<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>WORKOUT LOG</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#090909;
 color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif;
}

button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}

.app{
 max-width:680px;
 margin:auto;
 padding-bottom:90px;
}

header{
 position:sticky;
 top:0;
 z-index:20;
 background:#090909ee;
 backdrop-filter:blur(12px);
 border-bottom:1px solid #252525;
 padding:16px;
}

.logo{
 font-size:20px;
 font-weight:900;
 letter-spacing:1.5px;
}

.date{
 color:#888;
 font-size:12px;
 margin-top:3px;
}

main{
 padding:14px;
}

.card{
 background:#151515;
 border:1px solid #252525;
 border-radius:18px;
 padding:15px;
 margin-bottom:12px;
}

.row{
 display:flex;
 gap:8px;
 align-items:center;
}

.between{
 justify-content:space-between;
}

.title{
 font-weight:900;
 font-size:17px;
}

.sub{
 color:#888;
 font-size:12px;
 margin-top:3px;
}

.btn{
 background:#fff;
 color:#000;
 padding:11px 14px;
 border-radius:12px;
 font-weight:800;
}

.btn.dark{
 background:#242424;
 color:#fff;
}

.btn.red{
 background:#321616;
 color:#ff7777;
}

.btn.green{
 background:#18351f;
 color:#7cff98;
}

.btn.full{
 width:100%;
}

input,select,textarea{
 width:100%;
 border:1px solid #303030;
 background:#0e0e0e;
 color:#fff;
 border-radius:11px;
 padding:11px;
 outline:none;
}

input:focus,
select:focus,
textarea:focus{
 border-color:#777;
}

label{
 display:block;
 font-size:11px;
 color:#888;
 margin:10px 0 5px;
}

.badge{
 display:inline-block;
 padding:4px 8px;
 border-radius:99px;
 background:#292929;
 color:#aaa;
 font-size:10px;
 margin-left:4px;
}

.set{
 background:#101010;
 border:1px solid #242424;
 border-radius:13px;
 padding:9px;
 margin-top:7px;
}

.setgrid{
 display:grid;
 grid-template-columns:34px 1fr 1fr 38px;
 gap:6px;
 align-items:center;
}

.setnum{
 color:#777;
 text-align:center;
 font-size:12px;
}

.options{
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 margin-top:8px;
}

.toggle{
 background:#222;
 color:#aaa;
 padding:7px 9px;
 border-radius:9px;
 font-size:11px;
}

.toggle.active{
 background:#fff;
 color:#000;
}

.prev{
 background:#191919;
 border-radius:10px;
 padding:8px;
 margin-top:8px;
 font-size:11px;
 color:#aaa;
 line-height:1.7;
}

.empty{
 text-align:center;
 color:#666;
 padding:35px 10px;
 line-height:1.8;
}

.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 z-index:30;
 background:#111e;
 backdrop-filter:blur(15px);
 border-top:1px solid #292929;
}

.bottom-inner{
 max-width:680px;
 margin:auto;
 display:flex;
}

.bottom button{
 flex:1;
 padding:14px 4px;
 background:transparent;
 color:#777;
 font-size:11px;
}

.bottom button.active{
 color:#fff;
}

.hidden{
 display:none!important;
}

.method-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}

.method{
 background:#222;
 color:#fff;
 border:1px solid #333;
 border-radius:13px;
 padding:15px 8px;
 text-align:center;
 font-weight:800;
}

.exercise-picker{
 margin-top:14px;
}

.part-title{
 font-size:12px;
 font-weight:900;
 color:#aaa;
 margin:15px 0 7px;
}

.exercise-choice{
 display:flex;
 gap:7px;
 margin-top:6px;
}

.delete-small{
 background:#321616;
 color:#ff7777;
 border-radius:9px;
 padding:7px 10px;
}

.group-exercise{
 background:#101010;
 border:1px solid #242424;
 border-radius:13px;
 padding:10px;
 margin-top:8px;
}

.group-header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:8px;
}

.history-item{
 padding:13px 0;
 border-bottom:1px solid #292929;
}

.history-item:last-child{
 border-bottom:0;
}

.history-exercise{
 margin-top:12px;
 padding:10px;
 background:#101010;
 border-radius:12px;
 border:1px solid #242424;
}

.history-set{
 display:flex;
 justify-content:space-between;
 padding:6px 0;
 border-bottom:1px solid #222;
 font-size:12px;
}

.history-set:last-child{
 border-bottom:0;
}

.history-group{
 margin-top:10px;
 padding-top:8px;
 border-top:1px solid #292929;
}

.pr{
 display:flex;
 justify-content:space-between;
 padding:10px 0;
 border-bottom:1px solid #292929;
}

.timer{
 position:fixed;
 right:14px;
 bottom:72px;
 z-index:40;
 background:#fff;
 color:#000;
 border-radius:15px;
 padding:12px 15px;
 font-weight:900;
 box-shadow:0 5px 30px #000;
}

.timer button{
 background:#000;
 color:#fff;
 border-radius:8px;
 padding:6px 9px;
 margin-left:6px;
}

h2{
 font-size:14px;
 margin:0 0 10px;
}

.small{
 font-size:11px;
 color:#777;
}

@media(max-width:420px){

 .setgrid{
  grid-template-columns:30px 1fr 1fr 34px;
 }

 .btn{
  padding:10px 10px;
 }

}
</style>
</head>

<body>

<div class="app">

<header>

 <div class="logo">
  WORKOUT LOG
 </div>

 <div class="date" id="date"></div>

</header>


<main>

<!-- =========================
     WORKOUT
========================= -->

<section id="workoutPage">

 <div class="card">

  <div class="row between">

   <div>

    <div class="title">
     TODAY'S WORKOUT
    </div>

    <div class="sub">
     前回の記録を確認しながら入力
    </div>

   </div>

   <button
    class="btn green"
    onclick="finishWorkout()">

    保存

   </button>

  </div>

 </div>


 <div id="exerciseList"></div>


 <!-- セット法選択 -->

 <div class="card">

  <h2>
   セット法を選択
  </h2>

  <div class="method-grid">

   <button
    class="method"
    onclick="openExercisePicker('normal')">

    通常セット

   </button>

   <button
    class="method"
    onclick="openExercisePicker('drop')">

    ドロップセット

   </button>

   <button
    class="method"
    onclick="openExercisePicker('superset')">

    スーパーセット

   </button>

   <button
    class="method"
    onclick="openExercisePicker('giant')">

    ジャイアントセット

   </button>

  </div>


  <div id="exercisePicker"></div>

 </div>


 <div class="card">

  <button
   class="btn dark full"
   onclick="copyLastWorkout()">

   前回メニューをコピー

  </button>

 </div>

</section>


<!-- =========================
     HISTORY
========================= -->

<section
 id="historyPage"
 class="hidden">

 <div class="card">

  <h2>
   トレーニング履歴
  </h2>

  <div id="historyList"></div>

 </div>


 <div class="card">

  <h2>
   種目別PR
  </h2>

  <div id="prList"></div>

 </div>

</section>


<!-- =========================
     SETTINGS
========================= -->

<section
 id="settingsPage"
 class="hidden">

 <div class="card">

  <h2>
   種目管理
  </h2>

  <div id="exerciseManager"></div>

 </div>


 <div class="card">

  <h2>
   データ管理
  </h2>

  <button
   class="btn full"
   onclick="backup()">

   バックアップ

  </button>


  <label>
   バックアップを復元
  </label>

  <input
   type="file"
   accept=".json"
   onchange="restore(event)"
  >


  <button
   class="btn red full"
   style="margin-top:12px"
   onclick="clearAll()">

   全データ削除

  </button>

 </div>

</section>

</main>


<!-- TIMER -->

<div
 id="timer"
 class="timer hidden">

 <span id="timerText">
  00:00
 </span>

 <button onclick="stopTimer()">
  停止
 </button>

</div>


<!-- BOTTOM -->

<nav class="bottom">

 <div class="bottom-inner">

  <button
   class="active"
   onclick="showPage('workout',this)">

   記録

  </button>


  <button
   onclick="showPage('history',this)">

   履歴

  </button>


  <button
   onclick="showPage('settings',this)">

   設定

  </button>

 </div>

</nav>

</div>


<script>

/* =========================
   DATABASE
========================= */

const KEY="WORKOUT_LOG_V4";

let db;

try{

 db=JSON.parse(
  localStorage.getItem(KEY) ||
  "null"
 );

}catch{

 db=null;

}


if(!db){

 db={
  history:[],
  draft:[],
  exerciseLibrary:[]
 };

}


let draft=db.draft || [];

let exerciseLibrary=
 db.exerciseLibrary || [];


/* =========================
   BASIC
========================= */

const uid=()=>{

 return Date.now().toString(36)+
 Math.random()
 .toString(36)
 .substring(2);

};


const esc=s=>
 String(s??"").replace(
  /[&<>"']/g,
  m=>({

   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"

  }[m])
 );


document.getElementById("date").textContent=
 new Date().toLocaleDateString(
  "ja-JP",
  {
   year:"numeric",
   month:"long",
   day:"numeric",
   weekday:"short"
  }
 );


/* =========================
   SAVE
========================= */

function save(){

 db.draft=draft;

 db.exerciseLibrary=
  exerciseLibrary;

 localStorage.setItem(
  KEY,
  JSON.stringify(db)
 );

}


/* =========================
   SET
========================= */

function newSet(){

 return{

  id:uid(),

  weight:"",

  reps:"",

  assist:false,

  restPause:false,

  restSeconds:"",

  cheating:false,

  note:""

 };

}


/* =========================
   METHOD NAME
========================= */

function methodName(type){

 return{

  normal:"通常セット",

  drop:"ドロップセット",

  superset:"スーパーセット",

  giant:"ジャイアントセット"

 }[type] || type;

}


/* =========================
   PREVIOUS
========================= */

function previous(name){

 if(!name)return null;

 for(
  const workout of db.history
 ){

  for(
   const ex of workout.exercises || []
  ){

   if(ex.name===name){

    return ex;

   }


   if(ex.group){

    for(
     const g of ex.group
    ){

     if(g.name===name){

      return{

       name:g.name,

       sets:g.sets

      };

     }

    }

   }

  }

 }

 return null;

}


/* =========================
   PARTS
========================= */

const parts=[
 "胸",
 "背中",
 "肩",
 "腕",
 "脚",
 "お尻",
 "腹部",
 "その他"
];


/* =========================
   LIBRARY
========================= */

function addLibraryExercise(
 name,
 part
){

 name=name.trim();

 if(!name)return;

 if(
  exerciseLibrary.some(
   x=>x.name===name
  )
 ){

  return;

 }

 exerciseLibrary.push({

  id:uid(),

  name:name,

  part:part

 });

 save();

}


function removeLibraryExercise(id){

 exerciseLibrary=
 exerciseLibrary.filter(
  x=>x.id!==id
 );

 save();

 renderExerciseManager();

}


/* =========================
   SETTINGS
========================= */

function createLibraryExercise(){

 const name=
 document.getElementById(
  "newExerciseName"
 ).value;

 const part=
 document.getElementById(
  "newExercisePart"
 ).value;

 if(!name.trim()){

  alert("種目名を入力してください");

  return;

 }

 addLibraryExercise(
  name,
  part
 );

 document.getElementById(
  "newExerciseName"
 ).value="";

 renderExerciseManager();

}


function renderExerciseManager(){

 const root=
 document.getElementById(
  "exerciseManager"
 );

 let html="";


 parts.forEach(part=>{

  const list=
   exerciseLibrary.filter(
    x=>x.part===part
   );

  if(!list.length)return;

  html+=`

   <div class="part-title">
    ${part}
   </div>

  `;


  list.forEach(x=>{

   html+=`

    <div
     class="exercise-choice">

     <div
      class="btn dark"
      style="flex:1">

      ${esc(x.name)}

     </div>

     <button
      class="delete-small"
      onclick="
       removeLibraryExercise(
        '${x.id}'
       )
      ">

      ×

     </button>

    </div>

   `;

  });

 });


 html+=`

  <label>
   新しい種目
  </label>

  <input
   id="newExerciseName"
   placeholder="例：スクワット"
  >

  <label>
   部位
  </label>

  <select
   id="newExercisePart">

   ${parts.map(
    p=>`
     <option value="${p}">
      ${p}
     </option>
    `
   ).join("")}

  </select>

  <button
   class="btn full"
   style="margin-top:10px"
   onclick="createLibraryExercise()">

   種目を登録

  </button>

 `;


 if(!exerciseLibrary.length){

  html=`

   <div class="empty">
    登録された種目はありません。<br>
    下から種目を登録してください。
   </div>

  `+html;

 }


 root.innerHTML=html;

}


/* =========================
   EXERCISE PICKER
========================= */

function openExercisePicker(type){

 const root=
 document.getElementById(
  "exercisePicker"
 );

 /*
  ライブラリ
 */

 const library=
  exerciseLibrary.slice();


 /*
  履歴から種目取得
 */

 const historyNames=[];

 (db.history||[]).forEach(
  workout=>{

   (workout.exercises||[])
    .forEach(ex=>{

     if(
      ex.name &&
      !historyNames.includes(
       ex.name
      )
     ){

      historyNames.push(
       ex.name
      );

     }


     if(ex.group){

      ex.group.forEach(g=>{

       if(
        g.name &&
        !historyNames.includes(
         g.name
        )
       ){

        historyNames.push(
         g.name
        );

       }

      });

     }

    });

  }
 );


 /*
  統合
 */

 const all=[];


 library.forEach(x=>{

  if(
   !all.some(
    a=>a.name===x.name
   )
  ){

   all.push(x);

  }

 });


 historyNames.forEach(name=>{

  if(
   !all.some(
    a=>a.name===name
   )
  ){

   all.push({

    id:"history_"+uid(),

    name:name,

    part:"過去の種目"

   });

  }

 });


 let html=`

  <div class="exercise-picker">

   <div class="sub">

    ${methodName(type)}の種目を選択

   </div>


   <label>
    種目を直接入力
   </label>

   <div class="row">

    <input
     id="directExerciseName"
     placeholder="例：スクワット"
    >

    <button
     class="btn"
     onclick="
      addDirectExercise(
       '${type}'
      )
     ">

     追加

    </button>

   </div>

 `;


 if(!all.length){

  html+=`

   <div class="empty">

    登録された種目がありません。<br>
    上の入力欄から種目名を入力してください。

   </div>

  `;

 }else{

  parts.forEach(part=>{

   const list=
    all.filter(
     x=>x.part===part
    );

   if(!list.length)return;

   html+=`

    <div class="part-title">
     ${part}
    </div>

   `;


   list.forEach(x=>{

    html+=`

     <button
      class="btn dark full"
      style="margin-top:5px"
      onclick="
       addExerciseDirect(
        '${type}',
        ${JSON.stringify(x.name)}
       )
      ">

      ${esc(x.name)}

     </button>

    `;

   });

  });


  /*
   過去の種目
  */

  const old=
   all.filter(
    x=>x.part==="過去の種目"
   );

  if(old.length){

   html+=`

    <div class="part-title">
     過去の種目
    </div>

   `;


   old.forEach(x=>{

    html+=`

     <button
      class="btn dark full"
      style="margin-top:5px"
      onclick="
       addExerciseDirect(
        '${type}',
        ${JSON.stringify(x.name)}
       )
      ">

      ${esc(x.name)}

     </button>

    `;

   });

  }

 }


 html+=`

  <button
   class="btn red full"
   style="margin-top:12px"
   onclick="cancelPicker()">

   キャンセル

  </button>

 </div>

 `;


 root.innerHTML=html;

}


function cancelPicker(){

 document.getElementById(
  "exercisePicker"
 ).innerHTML="";

}


/* =========================
   DIRECT EXERCISE
========================= */

function addDirectExercise(type){

 const input=
  document.getElementById(
   "directExerciseName"
  );

 if(!input)return;

 const name=
  input.value.trim();

 if(!name){

  alert("種目名を入力してください");

  return;

 }

 addExerciseDirect(
  type,
  name
 );


 /*
  次回から登録種目にする
 */

 if(
  !exerciseLibrary.some(
   x=>x.name===name
  )
 ){

  exerciseLibrary.push({

   id:uid(),

   name:name,

   part:"その他"

  });

 }

 save();

}


/* =========================
   ADD EXERCISE
========================= */

function addExerciseDirect(
 type,
 name
){

 if(!name)return;

 let ex={

  id:uid(),

  type:type,

  name:name,

  part:"その他",

  sets:[]

 };


 if(type==="normal"){

  ex.sets=[
   newSet(),
   newSet(),
   newSet()
  ];

 }


 if(type==="drop"){

  /*
   メインセット＋ドロップ
  */

  ex.sets=[
   newSet(),
   newSet()
  ];

 }


 if(
  type==="superset" ||
  type==="giant"
 ){

  ex.group=[{

   id:uid(),

   name:name,

   part:"その他",

   sets:[
    newSet(),
    newSet(),
    newSet()
   ]

  }];

  ex.sets=
   ex.group[0].sets;

 }


 draft.push(ex);

 save();

 cancelPicker();

 render();

}


/* =========================
   DELETE EXERCISE
========================= */

function deleteExercise(id){

 if(
  !confirm(
   "この種目を削除しますか？"
  )
 ){

  return;

 }

 draft=
  draft.filter(
   e=>e.id!==id
  );

 save();

 render();

}


/* =========================
   SET UPDATE
========================= */

function updateSet(
 eid,
 sid,
 key,
 value
){

 const e=
  draft.find(
   x=>x.id===eid
  );

 if(!e)return;

 const s=
  e.sets.find(
   x=>x.id===sid
  );

 if(!s)return;

 s[key]=value;

 save();

}


function updateExercise(
 id,
 key,
 value
){

 const e=
  draft.find(
   x=>x.id===id
  );

 if(!e)return;

 e[key]=value;

 save();

}


/* =========================
   TOGGLE
========================= */

function toggleSet(
 eid,
 sid,
 key
){

 const e=
  draft.find(
   x=>x.id===eid
  );

 if(!e)return;

 const s=
  e.sets.find(
   x=>x.id===sid
  );

 if(!s)return;

 s[key]=!s[key];

 save();

 render();

}


/* =========================
   SET ADD / DELETE
========================= */

function addSet(eid){

 const e=
  draft.find(
   x=>x.id===eid
  );

 if(!e)return;

 e.sets.push(
  newSet()
 );

 save();

 render();

}


function deleteSet(
 eid,
 sid
){

 const e=
  draft.find(
   x=>x.id===eid
  );

 if(!e)return;

 if(e.sets.length<=1){

  alert(
   "最低1セットは残してください"
  );

  return;

 }

 e.sets=
  e.sets.filter(
   s=>s.id!==sid
  );

 save();

 render();

}


function addDropSet(eid){

 addSet(eid);

}


/* =========================
   GROUP EXERCISE
========================= */

function syncGroupSets(e){

 if(
  e.group &&
  e.group.length
 ){

  e.sets=
   e.group[0].sets;

 }

}


function addGroupExercise(
 eid
){

 const e=
  draft.find(
   x=>x.id===eid
  );

 if(!e)return;

 e.group.push({

  id:uid(),

  name:"",

  part:"その他",

  sets:[
   newSet(),
   newSet(),
   newSet()
  ]

 });

 syncGroupSets(e);

 save();

 render();

}


function deleteGroupExercise(
 eid,
 gid
){

 const e=
  draft.find(
   x=>x.id===eid
  );

 if(!e)return;

 if(e.group.length<=1){

  alert(
   "最低1種目は残してください"
  );

  return;

 }

 e.group=
  e.group.filter(
   g=>g.id!==gid
  );

 syncGroupSets(e);

 save();

 render();

}


function addGroupSet(
 eid,
 gid
){

 const e=
  draft.find(
   x=>x.id===eid
  );

 if(!e)return;

 const g=
  e.group.find(
   x=>x.id===gid
  );

 if(!g)return;

 g.sets.push(
  newSet()
 );

 syncGroupSets(e);

 save();

 render();

}


function deleteGroupSet(
 eid,
 gid,
 sid
){

 const e=
  draft.find(
   x=>x.id===eid
  );

 if(!e)return;

 const g=
  e.group.find(
   x=>x.id===gid
  );

 if(!g)return;

 if(g.sets.length<=1){

  alert(
   "最低1セットは残してください"
  );

  return;

 }

 g.sets=
  g.sets.filter(
   s=>s.id!==sid
  );

 syncGroupSets(e);

 save();

 render();

}


function updateGroupExercise(
 eid,
 gid,
 key,
 value
){

 const e=
  draft.find(
   x=>x.id===eid
  );

 if(!e)return;

 const g=
  e.group.find(
   x=>x.id===gid
  );

 if(!g)return;

 g[key]=value;

 if(
  !e.name &&
  value
 ){

  e.name=value;

 }

 save();

}


function updateGroupSet(
 eid,
 gid,
 sid,
 key,
 value
){

 const e=
  draft.find(
   x=>x.id===eid
  );

 if(!e)return;

 const g=
  e.group.find(
   x=>x.id===gid
  );

 if(!g)return;

 const s=
  g.sets.find(
   x=>x.id===sid
  );

 if(!s)return;

 s[key]=value;

 save();

}

/* =========================
   RENDER
========================= */

function render(){

 const root=
  document.getElementById(
   "exerciseList"
  );

 root.innerHTML="";


 if(!draft.length){

  root.innerHTML=`

   <div class="card empty">

    セット法を選択して<br>
    種目を追加してください

   </div>

  `;

  return;

 }


 draft.forEach(
  (e,index)=>{

   const prev=
    previous(e.name);


   let html=`

    <div class="card">

     <div class="row between">

      <div class="title">

       ${index+1}.
       ${esc(e.name||"種目名")}

       <span class="badge">

        ${methodName(e.type)}

       </span>

      </div>


      <button
       class="btn red"
       onclick="
        deleteExercise(
         '${e.id}'
        )
       ">

       削除

      </button>

     </div>

   `;


   /*
    前回
   */

   if(
    prev &&
    (
     e.type==="normal" ||
     e.type==="drop"
    )
   ){

    html+=`

     <div class="prev">

      前回：

      ${prev.sets.map(
       s=>
       `${s.weight||"-"}kg × ${s.reps||"-"}回`
      ).join(" / ")}

     </div>

    `;

   }


   /*
    通常・ドロップ
   */

   if(
    e.type==="normal" ||
    e.type==="drop"
   ){

    html+=`

     <label>
      種目名
     </label>

     <input
      value="${esc(e.name)}"
      oninput="
       updateExercise(
        '${e.id}',
        'name',
        this.value
       )
      "
     >

    `;


    e.sets.forEach(
     (s,i)=>{

      html+=
       renderSet(
        e,
        s,
        i
       );

     }
    );


    html+=`

     <button
      class="btn dark full"
      style="margin-top:9px"
      onclick="
       addSet(
        '${e.id}'
       )
      ">

      ${
       e.type==="drop"
       ?
       "＋ ドロップ追加"
       :
       "＋ セット"
      }

     </button>

    `;

   }


   /*
    スーパー・ジャイアント
   */

   if(
    e.type==="superset" ||
    e.type==="giant"
   ){

    html+=`

     <div class="sub">

      種目を追加・削除できます

     </div>

    `;


    e.group.forEach(
     g=>{

      html+=
       renderGroupExercise(
        e,
        g
       );

     }
    );


    html+=`

     <button
      class="btn dark full"
      style="margin-top:9px"
      onclick="
       addGroupExercise(
        '${e.id}'
       )
      ">

      ＋ 種目追加

     </button>

    `;

   }


   html+=`

    </div>

   `;


   root.insertAdjacentHTML(
    "beforeend",
    html
   );

  }
 );

}

function finishWorkout(){

 if(!draft.length){

  alert(
   "種目を追加してください"
  );

  return;

 }


 const workout={

  id:uid(),

  date:
   new Date().toISOString(),

  exercises:
   JSON.parse(
    JSON.stringify(
     draft
    )
   )

 };


 db.history.unshift(
  workout
 );


 draft=[];

 save();

 render();

 renderHistory();

 alert(
  "トレーニングを保存しました！"
 );

}


/* =========================
   COPY LAST
========================= */

function copyLastWorkout(){

 if(
  !db.history ||
  !db.history.length
 ){

  alert(
   "まだ前回の記録がありません"
  );

  return;

 }


 const last=
  db.history[0];


 draft=
  JSON.parse(
   JSON.stringify(
    last.exercises
   )
  );


 draft.forEach(
  e=>{

   e.id=uid();


   if(e.sets){

    e.sets.forEach(
     s=>{

      s.id=uid();

      s.weight="";

      s.reps="";

      s.note="";

     }
    );

   }


   if(e.group){

    e.group.forEach(
     g=>{

      g.id=uid();

      g.sets.forEach(
       s=>{

        s.id=uid();

        s.weight="";

        s.reps="";

        s.note="";

       }
      );

     }
    );


    syncGroupSets(e);

   }

  }
 );


 save();

 render();

 alert(
  "前回メニューをコピーしました！"
 );

}

/* =========================
   PR
========================= */

function renderPR(){

 const root=
  document.getElementById(
   "prList"
  );

 const prs={};


 (db.history||[]).forEach(
  w=>{

   (w.exercises||[])
   .forEach(
    e=>{

     if(
      e.type==="superset" ||
      e.type==="giant"
     ){

      (e.group||[])
      .forEach(
       g=>{

        if(!g.name)return;

        (g.sets||[])
        .forEach(
         s=>{

          const weight=
           Number(
            s.weight
           )||0;

          if(
           !prs[g.name] ||
           weight>prs[g.name]
          ){

           prs[g.name]=
            weight;

          }

         }
        );

       }
      );

     }else{

      if(!e.name)return;

      (e.sets||[])
      .forEach(
       s=>{

        const weight=
         Number(
          s.weight
         )||0;

        if(
         !prs[e.name] ||
         weight>prs[e.name]
        ){

         prs[e.name]=
          weight;

        }

       }
      );

     }

    }
   );

  }
 );


 const names=
  Object.keys(prs);


 if(!names.length){

  root.innerHTML=
   '<div class="empty">まだPRがありません</div>';

  return;

 }


 root.innerHTML=
  names.map(
   name=>`

    <div class="pr">

     <span>
      ${esc(name)}
     </span>

     <b>
      ${prs[name]} kg
     </b>

    </div>

   `
  ).join("");

}

/* =========================
   TIMER
========================= */

let timerInterval=null;

let timerEnd=0;


function startTimer(
 seconds
){

 stopTimer();

 timerEnd=
  Date.now()+
  seconds*1000;


 document
  .getElementById(
   "timer"
  )
  .classList.remove(
   "hidden"
  );


 updateTimer();


 timerInterval=
  setInterval(
   updateTimer,
   250
  );

}


function updateTimer(){

 const remaining=
  Math.max(
   0,
   timerEnd-
   Date.now()
  );


 const sec=
  Math.ceil(
   remaining/1000
  );


 const m=
  String(
   Math.floor(
    sec/60
   )
  ).padStart(
   2,
   "0"
  );


 const s=
  String(
   sec%60
  ).padStart(
   2,
   "0"
  );


 document
  .getElementById(
   "timerText"
  )
  .textContent=
  `${m}:${s}`;


 if(
  remaining<=0
 ){

  clearInterval(
   timerInterval
  );


  if(
   navigator.vibrate
  ){

   navigator.vibrate(
    [200,100,200]
   );

  }

 }

}


function stopTimer(){

 clearInterval(
  timerInterval
 );

 document
  .getElementById(
   "timer"
  )
  .classList.add(
   "hidden"
  );

}


/* =========================
   BACKUP
========================= */

function backup(){

 const blob=
  new Blob(
   [
    JSON.stringify(
     db,
     null,
     2
    )
   ],
   {
    type:
     "application/json"
   }
  );


 const url=
  URL.createObjectURL(
   blob
  );


 const a=
  document.createElement(
   "a"
  );


 a.href=url;


 a.download=
  "workout-log-backup-"+
  new Date()
   .toISOString()
   .slice(
    0,
    10
   )+
  ".json";


 a.click();


 URL.revokeObjectURL(
  url
 );

}


/* =========================
   RESTORE
========================= */

function restore(event){

 const file=
  event.target.files[0];

 if(!file)return;


 const reader=
  new FileReader();


 reader.onload=()=>{

  try{

   const imported=
    JSON.parse(
     reader.result
    );


   if(
    !imported.history ||
    !Array.isArray(
     imported.history
    )
   ){

    throw new Error();

   }


   db=imported;


   draft=
    db.draft||
    [];


   exerciseLibrary=
    db.exerciseLibrary||
    [];


   /*
    古いバックアップ対策
   */

   if(
    !Array.isArray(
     exerciseLibrary
    )
   ){

    exerciseLibrary=[];

   }


   save();

   render();

   renderHistory();

   renderExerciseManager();

   alert(
    "バックアップを復元しました！"
   );

  }catch{

   alert(
    "バックアップファイルを読み込めませんでした。"
   );

  }

 };


 reader.readAsText(
  file
 );

}
